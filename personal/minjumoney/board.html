<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#fff7ed"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="아빠와 민주"/>
<title>아빠와 민주 게시판</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  color:#1f2937;
  background:#9bbbd4;
}
.wrap{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:0;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:#fff;
  border-bottom:1px solid #dbe3ec;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
}
.title{
  font-size:19px;
  font-weight:900;
  letter-spacing:-.3px;
}
.navs{
  display:flex;
  align-items:center;
  gap:5px;
}
.nav{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:32px;
  padding:6px 9px;
  border-radius:999px;
  border:1px solid #dde5ee;
  background:#fff;
  color:#374151;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.board{
  min-height:calc(100vh - 58px);
  display:flex;
  flex-direction:column;
}
.board-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
  background:#b2c7da;
}
.board-head b{
  font-size:15px;
}
.unread{
  display:none;
  min-width:22px;
  height:22px;
  padding:0 6px;
  align-items:center;
  justify-content:center;
  background:#ef4444;
  color:#fff;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}
.status{
  color:#5b6976;
  font-size:11px;
  font-weight:700;
}
.notify-btn{
  border:1px solid #e5e7eb;
  background:#fff7ed;
  color:#c2410c;
  min-height:32px;
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
}
.messages{
  flex:1;
  padding:10px 10px 14px;
  background:#b2c7da;
  overflow-y:auto;
}
.empty{
  text-align:center;
  color:#4b5563;
  padding:34px 10px;
  font-size:13px;
  font-weight:700;
}
.date-divider{
  display:flex;
  justify-content:center;
  margin:10px 0 12px;
}
.date-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:26px;
  padding:4px 12px;
  border-radius:999px;
  background:rgba(0,0,0,.14);
  color:#fff;
  font-size:12px;
  font-weight:800;
}
.msg{
  display:flex;
  margin-bottom:8px;
}
.msg.mine{
  justify-content:flex-end;
}
.msg.other{
  justify-content:flex-start;
}
.msg-line{
  display:flex;
  align-items:flex-end;
  gap:4px;
  max-width:92%;
}
.msg.mine .msg-line{
  flex-direction:row-reverse;
}
.msg.other .msg-line{
  flex-direction:row;
}
.bubble{
  max-width:100%;
  padding:9px 11px;
  border-radius:12px;
  font-size:15px;
  line-height:1.4;
  word-break:break-word;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.msg.other .bubble{
  background:#fff;
  color:#111827;
  border:1px solid rgba(0,0,0,.05);
  border-top-left-radius:4px;
}
.msg.mine .bubble{
  background:#fee500;
  color:#111827;
  border:1px solid rgba(0,0,0,.06);
  border-top-right-radius:4px;
}
.time{
  flex:0 0 auto;
  font-size:11px;
  color:#5b6976;
  line-height:1;
  margin-bottom:2px;
  white-space:nowrap;
}
.del-row{
  display:flex;
  margin-top:-5px;
  margin-bottom:8px;
}
.del-row.mine{
  justify-content:flex-end;
}
.del-row.other{
  justify-content:flex-start;
}
.del{
  border:0;
  background:transparent;
  color:#6b7280;
  font-size:11px;
  padding:1px 4px;
  cursor:pointer;
}
.composer{
  position:sticky;
  bottom:0;
  background:#fff;
  border-top:1px solid #dbe3ec;
  padding:8px;
}
.send-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 68px;
  gap:6px;
}
#messageInput{
  width:100%;
  min-height:44px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:10px 12px;
  font-size:15px;
  outline:none;
  background:#fff;
}
#messageInput:focus{
  border-color:#facc15;
  box-shadow:0 0 0 3px rgba(250,204,21,.20);
}
.send-btn{
  min-height:44px;
  border:0;
  border-radius:10px;
  background:#fee500;
  color:#111827;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}
.footnote{
  display:none;
}
@media(max-width:480px){
  .head{padding:8px 8px}
  .title{font-size:17px}
  .nav{padding:5px 7px;font-size:11px}
  .board-head{padding:8px}
  .messages{padding:8px 6px 12px}
  .msg-line{max-width:96%;gap:3px}
  .bubble{font-size:14px;padding:8px 10px}
  .time{font-size:10px}
  .composer{padding:6px}
  #messageInput{font-size:15px}
}
</style>
</head>

<body>
<div class="topbar">
  <div class="wrap">
    <div class="head">
      <div class="title">💬 우리 둘 게시판</div>
      <div class="navs">
        <a class="nav" href="./schedul.html">스케쥴</a>
        <a class="nav" href="./index.html">홈</a>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="board">
    <div class="board-head">
      <div>
        <b>대화</b>
        <div id="status" class="status">Firebase 연결 중...</div>
      </div>
      <div style="display:flex;align-items:center;gap:5px;">
        <span id="unreadBadge" class="unread">0</span>
        <button id="notifyBtn" class="notify-btn" type="button">🔔 아빠폰 알림 등록</button>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="empty">아직 글이 없습니다.<br/>첫 글을 남겨보세요 🙂</div>
    </div>

    <div class="composer">
      <div class="send-row">
        <input
          id="messageInput"
          type="text"
          maxlength="200"
          placeholder="메시지 입력"
          autocomplete="off"
        />
        <button id="sendBtn" class="send-btn" type="button">전송</button>
      </div>
    </div>
  </section>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBQ2DvuwcyIctktubn7LlfJRP0hHfXfnCU",
  authDomain: "personal-51db3.firebaseapp.com",
  databaseURL: "https://personal-51db3-default-rtdb.firebaseio.com",
  projectId: "personal-51db3",
  storageBucket: "personal-51db3.firebasestorage.app",
  messagingSenderId: "146076749227",
  appId: "1:146076749227:web:a89002fef193ba224816ee"
});

const db = firebase.database();
const messagesRef = db.ref("민주용돈/게시판/messages");
const dadPushRef = db.ref("민주용돈/게시판/push/dad");

/*
  Firebase Console > 프로젝트 설정 > Cloud Messaging > Web Push certificates
  에서 생성한 "공개키"를 아래에 넣으세요.
*/
const VAPID_PUBLIC_KEY = "BHEw2viTSrGTdL8NOspFJt_-jylwy4fkWwK_KAShsM1PTkq_YDnyC0X41v0lhNdv2-d6BYGRDJcdZUDnytqAruE";

let messaging = null;
try {
  messaging = firebase.messaging();
} catch (e) {
  console.warn("Firebase Messaging 초기화 실패", e);
}

const DAD_DEVICE_KEY = "dad-minju-dad-push-device";
const isDadDevice = () =>
  localStorage.getItem(DAD_DEVICE_KEY) === "true";

const $ = id => document.getElementById(id);

let firstSnapshot = true;
let lastKnownTime = 0;

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toDate(ts){
  const d = new Date(Number(ts || 0));
  return Number.isFinite(d.getTime()) ? d : null;
}

function dateKey(ts){
  const d = toDate(ts);
  if(!d) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatDateLabel(ts){
  const d = toDate(ts);
  if(!d) return "";
  const yoil = ["일","월","화","수","목","금","토"][d.getDay()];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${yoil}요일`;
}

function formatClock(ts){
  const d = toDate(ts);
  if(!d) return "";
  let h = d.getHours();
  const mm = String(d.getMinutes()).padStart(2,"0");
  const ap = h < 12 ? "오전" : "오후";
  h = h % 12;
  if(h === 0) h = 12;
  return `${ap} ${h}:${mm}`;
}

function isMineRow(row){
  const fromDad = !!row?.fromDad;
  return isDadDevice() ? fromDad : !fromDad;
}


async function sendMessage(){
  const text = $("messageInput").value.trim();

  if(!text){
    $("messageInput").focus();
    return;
  }

  try{
    const messageRef = messagesRef.push();

    await messageRef.set({
      text,
      fromDad: isDadDevice(),
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });

    // 민주가 쓴 글일 때만 Netlify Function이 아빠폰으로 Push 전송
    if(!isDadDevice()){
      fetch("/.netlify/functions/send-dad-board-push", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messageId: messageRef.key
        })
      })
      .then(async res => {
        const result = await res.json().catch(() => null);
        if(!res.ok){
          console.warn("아빠폰 Push 전송 실패:", res.status, result);
        }else{
          console.log("아빠폰 Push 전송 결과:", result);
        }
      })
      .catch(err => {
        console.warn("아빠폰 Push 함수 호출 실패:", err);
      });
    }

    $("messageInput").value = "";
    $("messageInput").focus();
  }catch(err){
    console.error(err);
    alert("글을 저장하지 못했습니다.\n" + (err?.message || err));
  }
}

$("sendBtn").addEventListener("click",sendMessage);
$("messageInput").addEventListener("keydown",e=>{
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});

let latestRows = [];

function renderLastData(){
  renderMessages(latestRows);
}

function renderMessages(rows){
  const wrap = $("messages");
  wrap.innerHTML = "";

  if(!rows.length){
    wrap.innerHTML =
      `<div class="empty">아직 글이 없습니다.<br/>첫 글을 남겨보세요 🙂</div>`;
    return;
  }

  let lastDate = "";

  rows.forEach(({key,row})=>{
    const currentDate = dateKey(row.createdAt);

    if(currentDate && currentDate !== lastDate){
      const divider = document.createElement("div");
      divider.className = "date-divider";
      divider.innerHTML = `<div class="date-pill">${formatDateLabel(row.createdAt)}</div>`;
      wrap.appendChild(divider);
      lastDate = currentDate;
    }

    const mine = isMineRow(row);

    const msg = document.createElement("div");
    msg.className = `msg ${mine ? "mine" : "other"}`;
    msg.innerHTML = `
      <div class="msg-line">
        <div class="bubble">${esc(row.text)}</div>
        <div class="time">${formatClock(row.createdAt)}</div>
      </div>
    `;
    wrap.appendChild(msg);

    const delRow = document.createElement("div");
    delRow.className = `del-row ${mine ? "mine" : "other"}`;

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "삭제";
    del.addEventListener("click",()=>{
      if(confirm("이 글을 삭제할까요?")){
        db.ref(`민주용돈/게시판/messages/${key}`).remove();
      }
    });

    delRow.appendChild(del);
    wrap.appendChild(delRow);
  });

  if(!document.hidden){
    markRead();
  }

  requestAnimationFrame(()=>{
    wrap.scrollTop = wrap.scrollHeight;
  });
}

function markRead(){
  const now = Date.now();
  localStorage.setItem(
    "dad-minju-board-last-read",
    String(now)
  );

  $("unreadBadge").style.display = "none";
  $("unreadBadge").textContent = "0";

  if("clearAppBadge" in navigator){
    try{ navigator.clearAppBadge(); }catch(e){}
  }
}

function updateUnread(rows){
  const lastRead =
    Number(
      localStorage.getItem("dad-minju-board-last-read") || 0
    );

  let unread = 0;

  rows.forEach(({row})=>{
    if(
      Number(row.createdAt || 0) > lastRead
    ){
      unread++;
    }
  });

  $("unreadBadge").textContent =
    unread > 99 ? "99+" : String(unread);

  $("unreadBadge").style.display =
    unread > 0 ? "inline-flex" : "none";

  if("setAppBadge" in navigator){
    try{
      if(unread > 0)
        navigator.setAppBadge(unread);
      else
        navigator.clearAppBadge();
    }catch(e){}
  }
}

function maybeNotify(rows){
  // 실제 시스템 알림은 Firebase Cloud Messaging이 담당합니다.
  // 이 함수는 기존 실시간 렌더 흐름을 유지하기 위한 자리입니다.
}

messagesRef.on(
  "value",
  snap => {
    $("status").textContent = "실시간 연결됨";

    const value = snap.val() || {};

    const rows =
      Object.entries(value)
      .map(([key,row])=>({key,row:row || {}}))
      .sort(
        (a,b)=>
          Number(a.row.createdAt || 0)
          -
          Number(b.row.createdAt || 0)
      );

    latestRows = rows;

    maybeNotify(rows);
    updateUnread(rows);
    renderMessages(rows);
  },
  err => {
    $("status").textContent = "Firebase 연결 실패";
    alert("게시판 데이터를 불러오지 못했습니다.\n" + err.message);
  }
);

async function registerDadPush(showAlert = true){
  if(!messaging){
    if(showAlert) alert("이 브라우저에서 Firebase 알림을 시작할 수 없습니다.");
    return false;
  }

  if(!("serviceWorker" in navigator)){
    if(showAlert) alert("이 브라우저는 Service Worker를 지원하지 않습니다.");
    return false;
  }

  if(!("Notification" in window)){
    if(showAlert) alert("이 브라우저는 알림 기능을 지원하지 않습니다.");
    return false;
  }

  if(VAPID_PUBLIC_KEY.startsWith("여기에_")){
    if(showAlert){
      alert(
        "Firebase Web Push 공개키(VAPID)를 먼저 board.html에 넣어야 합니다.\n" +
        "Firebase 콘솔 → 프로젝트 설정 → Cloud Messaging → Web Push certificates에서 생성할 수 있습니다."
      );
    }
    return false;
  }

  try{
    const permission =
      Notification.permission === "granted"
        ? "granted"
        : await Notification.requestPermission();

    if(permission !== "granted"){
      $("notifyBtn").textContent = "🔕 알림 허용 필요";
      if(showAlert) alert("알림 권한을 허용해 주세요.");
      return false;
    }

    const swReg = await navigator.serviceWorker.register(
      "./sw.js"
    );

    const token = await messaging.getToken({
      vapidKey: VAPID_PUBLIC_KEY,
      serviceWorkerRegistration: swReg
    });

    if(!token){
      throw new Error("FCM 토큰을 발급받지 못했습니다.");
    }

    await dadPushRef.set({
      token,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
      userAgent: navigator.userAgent
    });

    localStorage.setItem(DAD_DEVICE_KEY,"true");
    $("notifyBtn").textContent = "✅ 아빠폰 알림 등록됨";

    if(showAlert){
      alert("이 휴대폰으로 민주의 새 글 알림을 받도록 등록했습니다.");
    }

    return true;
  }catch(err){
    console.error(err);
    $("notifyBtn").textContent = "⚠️ 알림 등록 실패";
    if(showAlert) alert("알림 등록에 실패했습니다.\n" + err.message);
    return false;
  }
}

$("notifyBtn").addEventListener("click", async ()=>{
  if(
    isDadDevice() &&
    !confirm("이 휴대폰의 아빠 알림 등록을 새로 갱신할까요?")
  ) return;

  await registerDadPush(true);
});

/* 등록된 아빠폰은 board.html을 열 때 FCM 토큰을 자동 갱신 */
if(isDadDevice()){
  $("notifyBtn").textContent = "✅ 아빠폰 알림 등록됨";
  registerDadPush(false);
}

/* 게시판이 화면에 떠 있는 상태에서 FCM이 오면 필요한 경우만 표시 */
if(messaging){
  messaging.onMessage(payload=>{
    if(!isDadDevice()) return;
    if(!document.hidden) return;
    if(Notification.permission !== "granted") return;

    const data = payload?.data || {};
    try{
      new Notification(
        data.title || "민주가 새 글을 남겼어요",
        {
          body: data.body || "게시판을 확인해 주세요.",
          tag: "dad-minju-board-push"
        }
      );
    }catch(e){}
  });
}

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)
    markRead();
});

</script>
</body>
</html>
