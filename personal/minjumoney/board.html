<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#fff7ed"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="아빠와 민주"/>
<title>아빠와 민주 게시판</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  color:#1f2937;
  background:
    radial-gradient(850px 450px at 10% 0%,#fff1f2 0%,transparent 60%),
    radial-gradient(850px 450px at 90% 15%,#eef2ff 0%,transparent 58%),
    #f8fafc;
}
.wrap{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:8px 8px 28px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(248,250,252,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #e5e7eb;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.title{
  font-size:20px;
  font-weight:1000;
  letter-spacing:-.4px;
}
.navs{
  display:flex;
  align-items:center;
  gap:5px;
}
.nav{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:6px 9px;
  border-radius:999px;
  border:1px solid #e5e7eb;
  background:#fff;
  color:#374151;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.who-card{
  margin-top:8px;
  padding:9px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
}
.who-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.who-btn{
  flex:1;
  min-height:42px;
  border:1px solid #e5e7eb;
  border-radius:11px;
  background:#fff;
  color:#374151;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}
.who-btn.active.dad{
  background:#dbeafe;
  border-color:#93c5fd;
  color:#1d4ed8;
}
.who-btn.active.minju{
  background:#fce7f3;
  border-color:#f9a8d4;
  color:#be185d;
}
.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:7px;
}
.status{
  color:#6b7280;
  font-size:12px;
  font-weight:700;
}
.notify-btn{
  border:1px solid #fed7aa;
  background:#fff7ed;
  color:#c2410c;
  min-height:34px;
  padding:6px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.board{
  margin-top:8px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
}
.board-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 11px;
  border-bottom:1px solid #e5e7eb;
}
.board-head b{
  font-size:15px;
}
.unread{
  display:none;
  min-width:22px;
  height:22px;
  padding:0 6px;
  align-items:center;
  justify-content:center;
  background:#ef4444;
  color:#fff;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}
.messages{
  min-height:180px;
  padding:9px 8px 3px;
}
.empty{
  text-align:center;
  color:#9ca3af;
  padding:34px 10px;
  font-size:13px;
  font-weight:700;
}
.msg{
  display:flex;
  flex-direction:column;
  margin-bottom:9px;
}
.msg.mine{align-items:flex-end}
.msg.other{align-items:flex-start}
.meta{
  display:flex;
  align-items:center;
  gap:5px;
  margin:0 3px 3px;
  font-size:11px;
  color:#9ca3af;
  font-weight:700;
}
.author{
  font-weight:900;
  color:#4b5563;
}
.bubble{
  max-width:88%;
  padding:8px 10px;
  border-radius:13px;
  font-size:15px;
  line-height:1.35;
  word-break:break-word;
  border:1px solid transparent;
}
.msg.dad .bubble{
  background:#eff6ff;
  border-color:#bfdbfe;
}
.msg.minju .bubble{
  background:#fdf2f8;
  border-color:#fbcfe8;
}
.msg.mine .bubble{
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}
.kind{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 6px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  margin-bottom:3px;
}
.kind.request{
  background:#fff7ed;
  color:#c2410c;
}
.kind.talk{
  background:#ecfdf5;
  color:#047857;
}
.del{
  margin-top:3px;
  border:0;
  background:transparent;
  color:#9ca3af;
  font-size:11px;
  padding:2px 4px;
  cursor:pointer;
}
.composer{
  border-top:1px solid #e5e7eb;
  padding:8px;
  background:#fafafa;
}
.kind-row{
  display:flex;
  gap:5px;
  margin-bottom:6px;
}
.kind-btn{
  flex:1;
  min-height:36px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  background:#fff;
  color:#4b5563;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.kind-btn.active.request{
  background:#fff7ed;
  color:#c2410c;
  border-color:#fed7aa;
}
.kind-btn.active.talk{
  background:#ecfdf5;
  color:#047857;
  border-color:#a7f3d0;
}
.send-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 66px;
  gap:6px;
}
#messageInput{
  width:100%;
  min-height:44px;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:9px 10px;
  font-size:16px;
  outline:none;
}
#messageInput:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,.10);
}
.send-btn{
  min-height:44px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#4f46e5,#ec4899);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}
.footnote{
  margin-top:8px;
  padding:9px 10px;
  color:#6b7280;
  font-size:11.5px;
  line-height:1.45;
  text-align:center;
}
@media(max-width:480px){
  .wrap{padding:6px 3px 22px}
  .title{font-size:18px}
  .nav{padding:5px 7px;font-size:11px}
  .who-card{padding:7px 5px}
  .who-btn{font-size:14px}
  .bubble{max-width:91%;font-size:14px}
  .messages{padding-left:5px;padding-right:5px}
}

/* 둘만 사용하는 게시판: 작성자 구분 없이 한 줄 기록 */
.msg,
.msg.mine,
.msg.other{
  align-items:stretch;
}
.msg .meta{
  justify-content:flex-start;
}
.msg .author{
  display:none;
}
.msg .bubble{
  max-width:100%;
  width:100%;
  background:#fff !important;
  border:1px solid #e5e7eb !important;
  border-radius:11px;
}
.msg .del{
  align-self:flex-end;
}

</style>
</head>

<body>
<div class="topbar">
  <div class="wrap">
    <div class="head">
      <div class="title">💬 우리 둘 게시판</div>
      <div class="navs">
        <a class="nav" href="./schedul.html">스케쥴</a>
        <a class="nav" href="./index.html">홈</a>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="board">
    <div class="board-head">
      <div>
        <b>우리 둘 대화</b>
        <div id="status" class="status" style="margin-top:3px;">Firebase 연결 중...</div>
      </div>
      <div style="display:flex;align-items:center;gap:5px;">
        <span id="unreadBadge" class="unread">0</span>
        <button id="notifyBtn" class="notify-btn" type="button">🔔 아빠폰 알림 등록</button>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="empty">아직 글이 없습니다.<br/>첫 글을 남겨보세요 🙂</div>
    </div>

    <div class="composer">
      <div class="kind-row">
        <button id="requestKind" class="kind-btn request active" type="button">🛠 수정요청</button>
        <button id="talkKind" class="kind-btn talk" type="button">💭 하고싶은말</button>
      </div>

      <div class="send-row">
        <input
          id="messageInput"
          type="text"
          maxlength="200"
          placeholder="한 줄 남기기"
          autocomplete="off"
        />
        <button id="sendBtn" class="send-btn" type="button">보내기</button>
      </div>
    </div>
  </section>

  <div class="footnote">
    아빠 안드로이드폰에서만 <b>🔔 아빠폰 알림 등록</b>을 한 번 눌러 주세요.
    이후 이 휴대폰은 자동으로 아빠 기기로 기억되며, 민주가 새 글을 쓰면 아빠폰으로 푸시 알림이 옵니다.
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBQ2DvuwcyIctktubn7LlfJRP0hHfXfnCU",
  authDomain: "personal-51db3.firebaseapp.com",
  databaseURL: "https://personal-51db3-default-rtdb.firebaseio.com",
  projectId: "personal-51db3",
  storageBucket: "personal-51db3.firebasestorage.app",
  messagingSenderId: "146076749227",
  appId: "1:146076749227:web:a89002fef193ba224816ee"
});

const db = firebase.database();
const messagesRef = db.ref("민주용돈/게시판/messages");
const dadPushRef = db.ref("민주용돈/게시판/push/dad");

/*
  Firebase Console > 프로젝트 설정 > Cloud Messaging > Web Push certificates
  에서 생성한 "공개키"를 아래에 넣으세요.
*/
const VAPID_PUBLIC_KEY = "BHEw2viTSrGTdL8NOspFJt_-jylwy4fkWwK_KAShsM1PTkq_YDnyC0X41v0lhNdv2-d6BYGRDJcdZUDnytqAruE";

let messaging = null;
try {
  messaging = firebase.messaging();
} catch (e) {
  console.warn("Firebase Messaging 초기화 실패", e);
}

const DAD_DEVICE_KEY = "dad-minju-dad-push-device";
const isDadDevice = () =>
  localStorage.getItem(DAD_DEVICE_KEY) === "true";

const $ = id => document.getElementById(id);

let currentKind = "request";
let firstSnapshot = true;
let lastKnownTime = 0;

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatTime(ts){
  const d = new Date(Number(ts || 0));
  if(!Number.isFinite(d.getTime())) return "";

  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const mi = String(d.getMinutes()).padStart(2,"0");

  return `${yy}.${mm}.${dd} ${hh}:${mi}`;
}

function setKind(kind){
  currentKind = kind;
  $("requestKind").classList.toggle("active",kind === "request");
  $("talkKind").classList.toggle("active",kind === "talk");
}

$("requestKind").addEventListener("click",()=>setKind("request"));
$("talkKind").addEventListener("click",()=>setKind("talk"));

async function sendMessage(){
  const text = $("messageInput").value.trim();

  if(!text){
    $("messageInput").focus();
    return;
  }

  try{
    const messageRef = messagesRef.push();

    await messageRef.set({
      kind: currentKind,
      text,
      fromDad: isDadDevice(),
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });

    // 민주가 쓴 글일 때만 Netlify Function이 아빠폰으로 Push 전송
    if(!isDadDevice()){
      fetch("/.netlify/functions/send-dad-board-push", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messageId: messageRef.key
        })
      })
      .then(async res => {
        const result = await res.json().catch(() => null);
        if(!res.ok){
          console.warn("아빠폰 Push 전송 실패:", res.status, result);
        }else{
          console.log("아빠폰 Push 전송 결과:", result);
        }
      })
      .catch(err => {
        console.warn("아빠폰 Push 함수 호출 실패:", err);
      });
    }

    $("messageInput").value = "";
    $("messageInput").focus();
  }catch(err){
    console.error(err);
    alert("글을 저장하지 못했습니다.\n" + (err?.message || err));
  }
}

$("sendBtn").addEventListener("click",sendMessage);
$("messageInput").addEventListener("keydown",e=>{
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});

let latestRows = [];

function renderLastData(){
  renderMessages(latestRows);
}

function renderMessages(rows){
  const wrap = $("messages");
  wrap.innerHTML = "";

  if(!rows.length){
    wrap.innerHTML =
      `<div class="empty">아직 글이 없습니다.<br/>첫 글을 남겨보세요 🙂</div>`;
    return;
  }

  rows.forEach(({key,row})=>{
    const msg = document.createElement("div");
    msg.className = "msg";

    const kindText =
      row.kind === "request" ? "수정요청" : "하고싶은말";

    const kindClass =
      row.kind === "request" ? "request" : "talk";

    msg.innerHTML = `
      <div class="meta">
        <span>${formatTime(row.createdAt)}</span>
      </div>
      <div class="kind ${kindClass}">${kindText}</div>
      <div class="bubble">${esc(row.text)}</div>
    `;

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "삭제";
    del.addEventListener("click",()=>{
      if(confirm("이 글을 삭제할까요?")){
        db.ref(`민주용돈/게시판/messages/${key}`).remove();
      }
    });

    msg.appendChild(del);
    wrap.appendChild(msg);
  });

  // 게시판을 보고 있으면 읽은 것으로 처리
  if(!document.hidden){
    markRead();
  }
}

function markRead(){
  const now = Date.now();
  localStorage.setItem(
    "dad-minju-board-last-read",
    String(now)
  );

  $("unreadBadge").style.display = "none";
  $("unreadBadge").textContent = "0";

  if("clearAppBadge" in navigator){
    try{ navigator.clearAppBadge(); }catch(e){}
  }
}

function updateUnread(rows){
  const lastRead =
    Number(
      localStorage.getItem("dad-minju-board-last-read") || 0
    );

  let unread = 0;

  rows.forEach(({row})=>{
    if(
      Number(row.createdAt || 0) > lastRead
    ){
      unread++;
    }
  });

  $("unreadBadge").textContent =
    unread > 99 ? "99+" : String(unread);

  $("unreadBadge").style.display =
    unread > 0 ? "inline-flex" : "none";

  if("setAppBadge" in navigator){
    try{
      if(unread > 0)
        navigator.setAppBadge(unread);
      else
        navigator.clearAppBadge();
    }catch(e){}
  }
}

function maybeNotify(rows){
  // 실제 시스템 알림은 Firebase Cloud Messaging이 담당합니다.
  // 이 함수는 기존 실시간 렌더 흐름을 유지하기 위한 자리입니다.
}

messagesRef.on(
  "value",
  snap => {
    $("status").textContent = "실시간 연결됨";

    const value = snap.val() || {};

    const rows =
      Object.entries(value)
      .map(([key,row])=>({key,row:row || {}}))
      .sort(
        (a,b)=>
          Number(a.row.createdAt || 0)
          -
          Number(b.row.createdAt || 0)
      );

    latestRows = rows;

    maybeNotify(rows);
    updateUnread(rows);
    renderMessages(rows);
  },
  err => {
    $("status").textContent = "Firebase 연결 실패";
    alert("게시판 데이터를 불러오지 못했습니다.\n" + err.message);
  }
);

async function registerDadPush(showAlert = true){
  if(!messaging){
    if(showAlert) alert("이 브라우저에서 Firebase 알림을 시작할 수 없습니다.");
    return false;
  }

  if(!("serviceWorker" in navigator)){
    if(showAlert) alert("이 브라우저는 Service Worker를 지원하지 않습니다.");
    return false;
  }

  if(!("Notification" in window)){
    if(showAlert) alert("이 브라우저는 알림 기능을 지원하지 않습니다.");
    return false;
  }

  if(VAPID_PUBLIC_KEY.startsWith("여기에_")){
    if(showAlert){
      alert(
        "Firebase Web Push 공개키(VAPID)를 먼저 board.html에 넣어야 합니다.\n" +
        "Firebase 콘솔 → 프로젝트 설정 → Cloud Messaging → Web Push certificates에서 생성할 수 있습니다."
      );
    }
    return false;
  }

  try{
    const permission =
      Notification.permission === "granted"
        ? "granted"
        : await Notification.requestPermission();

    if(permission !== "granted"){
      $("notifyBtn").textContent = "🔕 알림 허용 필요";
      if(showAlert) alert("알림 권한을 허용해 주세요.");
      return false;
    }

    const swReg = await navigator.serviceWorker.register(
      "./sw.js"
    );

    const token = await messaging.getToken({
      vapidKey: VAPID_PUBLIC_KEY,
      serviceWorkerRegistration: swReg
    });

    if(!token){
      throw new Error("FCM 토큰을 발급받지 못했습니다.");
    }

    await dadPushRef.set({
      token,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
      userAgent: navigator.userAgent
    });

    localStorage.setItem(DAD_DEVICE_KEY,"true");
    $("notifyBtn").textContent = "✅ 아빠폰 알림 등록됨";

    if(showAlert){
      alert("이 휴대폰으로 민주의 새 글 알림을 받도록 등록했습니다.");
    }

    return true;
  }catch(err){
    console.error(err);
    $("notifyBtn").textContent = "⚠️ 알림 등록 실패";
    if(showAlert) alert("알림 등록에 실패했습니다.\n" + err.message);
    return false;
  }
}

$("notifyBtn").addEventListener("click", async ()=>{
  if(
    isDadDevice() &&
    !confirm("이 휴대폰의 아빠 알림 등록을 새로 갱신할까요?")
  ) return;

  await registerDadPush(true);
});

/* 등록된 아빠폰은 board.html을 열 때 FCM 토큰을 자동 갱신 */
if(isDadDevice()){
  $("notifyBtn").textContent = "✅ 아빠폰 알림 등록됨";
  registerDadPush(false);
}

/* 게시판이 화면에 떠 있는 상태에서 FCM이 오면 필요한 경우만 표시 */
if(messaging){
  messaging.onMessage(payload=>{
    if(!isDadDevice()) return;
    if(!document.hidden) return;
    if(Notification.permission !== "granted") return;

    const data = payload?.data || {};
    try{
      new Notification(
        data.title || "민주가 새 글을 남겼어요",
        {
          body: data.body || "게시판을 확인해 주세요.",
          tag: "dad-minju-board-push"
        }
      );
    }catch(e){}
  });
}

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)
    markRead();
});

</script>
</body>
</html>
