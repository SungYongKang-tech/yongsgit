<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#fff7ed"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="아빠와 민주"/>
<title>아빠와 민주 게시판</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  color:#1f2937;
  background:
    radial-gradient(850px 450px at 10% 0%,#fff1f2 0%,transparent 60%),
    radial-gradient(850px 450px at 90% 15%,#eef2ff 0%,transparent 58%),
    #f8fafc;
}
.wrap{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:8px 8px 28px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(248,250,252,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #e5e7eb;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.title{
  font-size:20px;
  font-weight:1000;
  letter-spacing:-.4px;
}
.navs{
  display:flex;
  align-items:center;
  gap:5px;
}
.nav{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:6px 9px;
  border-radius:999px;
  border:1px solid #e5e7eb;
  background:#fff;
  color:#374151;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.who-card{
  margin-top:8px;
  padding:9px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
}
.who-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.who-btn{
  flex:1;
  min-height:42px;
  border:1px solid #e5e7eb;
  border-radius:11px;
  background:#fff;
  color:#374151;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}
.who-btn.active.dad{
  background:#dbeafe;
  border-color:#93c5fd;
  color:#1d4ed8;
}
.who-btn.active.minju{
  background:#fce7f3;
  border-color:#f9a8d4;
  color:#be185d;
}
.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:7px;
}
.status{
  color:#6b7280;
  font-size:12px;
  font-weight:700;
}
.notify-btn{
  border:1px solid #fed7aa;
  background:#fff7ed;
  color:#c2410c;
  min-height:34px;
  padding:6px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.board{
  margin-top:8px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
}
.board-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 11px;
  border-bottom:1px solid #e5e7eb;
}
.board-head b{
  font-size:15px;
}
.unread{
  display:none;
  min-width:22px;
  height:22px;
  padding:0 6px;
  align-items:center;
  justify-content:center;
  background:#ef4444;
  color:#fff;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}
.messages{
  min-height:180px;
  padding:9px 8px 3px;
}
.empty{
  text-align:center;
  color:#9ca3af;
  padding:34px 10px;
  font-size:13px;
  font-weight:700;
}
.msg{
  display:flex;
  flex-direction:column;
  margin-bottom:9px;
}
.msg.mine{align-items:flex-end}
.msg.other{align-items:flex-start}
.meta{
  display:flex;
  align-items:center;
  gap:5px;
  margin:0 3px 3px;
  font-size:11px;
  color:#9ca3af;
  font-weight:700;
}
.author{
  font-weight:900;
  color:#4b5563;
}
.bubble{
  max-width:88%;
  padding:8px 10px;
  border-radius:13px;
  font-size:15px;
  line-height:1.35;
  word-break:break-word;
  border:1px solid transparent;
}
.msg.dad .bubble{
  background:#eff6ff;
  border-color:#bfdbfe;
}
.msg.minju .bubble{
  background:#fdf2f8;
  border-color:#fbcfe8;
}
.msg.mine .bubble{
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}
.kind{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 6px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  margin-bottom:3px;
}
.kind.request{
  background:#fff7ed;
  color:#c2410c;
}
.kind.talk{
  background:#ecfdf5;
  color:#047857;
}
.del{
  margin-top:3px;
  border:0;
  background:transparent;
  color:#9ca3af;
  font-size:11px;
  padding:2px 4px;
  cursor:pointer;
}
.composer{
  border-top:1px solid #e5e7eb;
  padding:8px;
  background:#fafafa;
}
.kind-row{
  display:flex;
  gap:5px;
  margin-bottom:6px;
}
.kind-btn{
  flex:1;
  min-height:36px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  background:#fff;
  color:#4b5563;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.kind-btn.active.request{
  background:#fff7ed;
  color:#c2410c;
  border-color:#fed7aa;
}
.kind-btn.active.talk{
  background:#ecfdf5;
  color:#047857;
  border-color:#a7f3d0;
}
.send-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 66px;
  gap:6px;
}
#messageInput{
  width:100%;
  min-height:44px;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:9px 10px;
  font-size:16px;
  outline:none;
}
#messageInput:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,.10);
}
.send-btn{
  min-height:44px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#4f46e5,#ec4899);
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}
.footnote{
  margin-top:8px;
  padding:9px 10px;
  color:#6b7280;
  font-size:11.5px;
  line-height:1.45;
  text-align:center;
}
@media(max-width:480px){
  .wrap{padding:6px 3px 22px}
  .title{font-size:18px}
  .nav{padding:5px 7px;font-size:11px}
  .who-card{padding:7px 5px}
  .who-btn{font-size:14px}
  .bubble{max-width:91%;font-size:14px}
  .messages{padding-left:5px;padding-right:5px}
}
</style>
</head>

<body>
<div class="topbar">
  <div class="wrap">
    <div class="head">
      <div class="title">💬 수정요청 · 하고싶은말</div>
      <div class="navs">
        <a class="nav" href="./schedul.html">스케쥴</a>
        <a class="nav" href="./index.html">홈</a>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="who-card">
    <div class="who-row">
      <button id="dadBtn" class="who-btn dad" type="button">👨 아빠</button>
      <button id="minjuBtn" class="who-btn minju" type="button">👧 민주</button>
    </div>
    <div class="status-row">
      <div id="status" class="status">Firebase 연결 중...</div>
      <button id="notifyBtn" class="notify-btn" type="button">🔔 알림 켜기</button>
    </div>
  </section>

  <section class="board">
    <div class="board-head">
      <b>우리 둘 대화</b>
      <span id="unreadBadge" class="unread">0</span>
    </div>

    <div id="messages" class="messages">
      <div class="empty">아직 글이 없습니다.<br/>첫 글을 남겨보세요 🙂</div>
    </div>

    <div class="composer">
      <div class="kind-row">
        <button id="requestKind" class="kind-btn request active" type="button">🛠 수정요청</button>
        <button id="talkKind" class="kind-btn talk" type="button">💭 하고싶은말</button>
      </div>

      <div class="send-row">
        <input
          id="messageInput"
          type="text"
          maxlength="200"
          placeholder="한 줄 남기기"
          autocomplete="off"
        />
        <button id="sendBtn" class="send-btn" type="button">보내기</button>
      </div>
    </div>
  </section>

  <div class="footnote">
    이 화면을 열어둔 동안 상대가 새 글을 쓰면 실시간으로 바로 표시됩니다.
    알림을 허용하면 화면을 보고 있지 않을 때도 브라우저가 살아 있는 동안 알림을 받을 수 있습니다.
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBQ2DvuwcyIctktubn7LlfJRP0hHfXfnCU",
  authDomain: "personal-51db3.firebaseapp.com",
  databaseURL: "https://personal-51db3-default-rtdb.firebaseio.com",
  projectId: "personal-51db3",
  storageBucket: "personal-51db3.firebasestorage.app",
  messagingSenderId: "146076749227",
  appId: "1:146076749227:web:a89002fef193ba224816ee"
});

const db = firebase.database();
const messagesRef = db.ref("민주용돈/게시판/messages");

const $ = id => document.getElementById(id);

let me =
  localStorage.getItem("dad-minju-board-user") || "";

let currentKind = "request";
let firstSnapshot = true;
let lastKnownTime = 0;

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatTime(ts){
  const d = new Date(Number(ts || 0));
  if(!Number.isFinite(d.getTime())) return "";

  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const mi = String(d.getMinutes()).padStart(2,"0");

  return `${yy}.${mm}.${dd} ${hh}:${mi}`;
}

function setMe(next){
  me = next;
  localStorage.setItem("dad-minju-board-user",me);

  $("dadBtn").classList.toggle("active",me === "dad");
  $("minjuBtn").classList.toggle("active",me === "minju");

  markRead();
  renderLastData();
}

$("dadBtn").addEventListener("click",()=>setMe("dad"));
$("minjuBtn").addEventListener("click",()=>setMe("minju"));

function setKind(kind){
  currentKind = kind;
  $("requestKind").classList.toggle("active",kind === "request");
  $("talkKind").classList.toggle("active",kind === "talk");
}

$("requestKind").addEventListener("click",()=>setKind("request"));
$("talkKind").addEventListener("click",()=>setKind("talk"));

async function sendMessage(){
  if(!me){
    alert("먼저 아빠 또는 민주를 선택해 주세요.");
    return;
  }

  const text = $("messageInput").value.trim();

  if(!text){
    $("messageInput").focus();
    return;
  }

  await messagesRef.push({
    author: me,
    kind: currentKind,
    text,
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });

  $("messageInput").value = "";
  $("messageInput").focus();
}

$("sendBtn").addEventListener("click",sendMessage);
$("messageInput").addEventListener("keydown",e=>{
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});

let latestRows = [];

function renderLastData(){
  renderMessages(latestRows);
}

function renderMessages(rows){
  const wrap = $("messages");
  wrap.innerHTML = "";

  if(!rows.length){
    wrap.innerHTML =
      `<div class="empty">아직 글이 없습니다.<br/>첫 글을 남겨보세요 🙂</div>`;
    return;
  }

  rows.forEach(({key,row})=>{
    const msg = document.createElement("div");
    const mine = me && row.author === me;

    msg.className =
      `msg ${mine ? "mine" : "other"} ${row.author === "dad" ? "dad" : "minju"}`;

    const authorText =
      row.author === "dad" ? "아빠" : "민주";

    const kindText =
      row.kind === "request" ? "수정요청" : "하고싶은말";

    const kindClass =
      row.kind === "request" ? "request" : "talk";

    msg.innerHTML = `
      <div class="meta">
        <span class="author">${authorText}</span>
        <span>${formatTime(row.createdAt)}</span>
      </div>
      <div class="kind ${kindClass}">${kindText}</div>
      <div class="bubble">${esc(row.text)}</div>
    `;

    if(mine){
      const del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "삭제";
      del.addEventListener("click",()=>{
        if(confirm("이 글을 삭제할까요?")){
          db.ref(`민주용돈/게시판/messages/${key}`).remove();
        }
      });
      msg.appendChild(del);
    }

    wrap.appendChild(msg);
  });

  // 게시판을 보고 있으면 읽은 것으로 처리
  if(!document.hidden){
    markRead();
  }
}

function markRead(){
  const now = Date.now();
  localStorage.setItem(
    "dad-minju-board-last-read",
    String(now)
  );

  $("unreadBadge").style.display = "none";
  $("unreadBadge").textContent = "0";

  if("clearAppBadge" in navigator){
    try{ navigator.clearAppBadge(); }catch(e){}
  }
}

function updateUnread(rows){
  const lastRead =
    Number(
      localStorage.getItem("dad-minju-board-last-read") || 0
    );

  let unread = 0;

  rows.forEach(({row})=>{
    if(
      Number(row.createdAt || 0) > lastRead &&
      (!me || row.author !== me)
    ){
      unread++;
    }
  });

  $("unreadBadge").textContent =
    unread > 99 ? "99+" : String(unread);

  $("unreadBadge").style.display =
    unread > 0 ? "inline-flex" : "none";

  if("setAppBadge" in navigator){
    try{
      if(unread > 0)
        navigator.setAppBadge(unread);
      else
        navigator.clearAppBadge();
    }catch(e){}
  }
}

function maybeNotify(rows){
  if(firstSnapshot){
    firstSnapshot = false;

    rows.forEach(({row})=>{
      lastKnownTime =
        Math.max(lastKnownTime,Number(row.createdAt || 0));
    });

    return;
  }

  const newOtherRows =
    rows.filter(({row})=>{
      const ts = Number(row.createdAt || 0);
      return (
        ts > lastKnownTime &&
        me &&
        row.author !== me
      );
    });

  rows.forEach(({row})=>{
    lastKnownTime =
      Math.max(lastKnownTime,Number(row.createdAt || 0));
  });

  if(!newOtherRows.length) return;

  const newest =
    newOtherRows[newOtherRows.length - 1].row;

  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){
    const who =
      newest.author === "dad" ? "아빠" : "민주";

    try{
      new Notification(
        `${who}가 새 글을 남겼어요`,
        {
          body: String(newest.text || "").slice(0,100),
          tag: "dad-minju-board"
        }
      );
    }catch(e){}
  }
}

messagesRef.on(
  "value",
  snap => {
    $("status").textContent = "실시간 연결됨";

    const value = snap.val() || {};

    const rows =
      Object.entries(value)
      .map(([key,row])=>({key,row:row || {}}))
      .sort(
        (a,b)=>
          Number(a.row.createdAt || 0)
          -
          Number(b.row.createdAt || 0)
      );

    latestRows = rows;

    maybeNotify(rows);
    updateUnread(rows);
    renderMessages(rows);
  },
  err => {
    $("status").textContent = "Firebase 연결 실패";
    alert("게시판 데이터를 불러오지 못했습니다.\n" + err.message);
  }
);

$("notifyBtn").addEventListener("click", async ()=>{
  if(!("Notification" in window)){
    alert("이 브라우저는 알림 기능을 지원하지 않습니다.");
    return;
  }

  const result =
    await Notification.requestPermission();

  if(result === "granted"){
    $("notifyBtn").textContent = "🔔 알림 허용됨";
  }else if(result === "denied"){
    $("notifyBtn").textContent = "🔕 알림 차단됨";
  }else{
    $("notifyBtn").textContent = "🔔 알림 켜기";
  }
});

if("Notification" in window){
  if(Notification.permission === "granted"){
    $("notifyBtn").textContent = "🔔 알림 허용됨";
  }else if(Notification.permission === "denied"){
    $("notifyBtn").textContent = "🔕 알림 차단됨";
  }
}

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)
    markRead();
});

if(me){
  setMe(me);
}else{
  $("dadBtn").classList.remove("active");
  $("minjuBtn").classList.remove("active");
}
</script>
</body>
</html>
