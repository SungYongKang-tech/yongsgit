<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f6f7ff"/>
<title>민주 할일</title>

<style>
:root{
  --bg1:#f6f7ff;
  --bg2:#fff7f2;
  --card:#ffffffee;
  --bd:#e5e7eb;
  --txt:#1f2937;
  --mut:#6b7280;
  --gap:4px;
  --radius:15px;
  --shadow:0 8px 24px rgba(20,20,60,.08);
  --boxPx:15px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  color:var(--txt);
  background:
    radial-gradient(900px 500px at 10% 5%,#e8f0ff 0%,transparent 60%),
    radial-gradient(800px 450px at 90% 15%,#ffe9f0 0%,transparent 55%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  overflow-x:hidden;
}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:8px}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bd);
}
.brand-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
}
.brand{
  font-weight:1000;
  font-size:20px;
  letter-spacing:-.5px;
}
.home-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:6px 11px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--bd);
  color:#374151;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,button{
  border:1px solid var(--bd);
  border-radius:11px;
  min-height:40px;
  padding:7px 9px;
  font-size:14px;
  background:#fff;
  outline:none;
}
button{
  cursor:pointer;
  border:none;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,#4f46e5,#ec4899);
}
button.ghost{
  background:#fff;
  color:var(--txt);
  border:1px solid var(--bd);
}
button.small{min-height:36px;padding:6px 9px;font-size:12px}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--bd);
  font-size:12px;
  font-weight:900;
}
.swatch{
  width:11px;
  height:11px;
  border-radius:4px;
  border:1px solid rgba(0,0,0,.08);
}
.card{
  margin-top:8px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.cardHead{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:9px 10px;
  border-bottom:1px solid var(--bd);
}
.title{
  font-size:20px;
  font-weight:1000;
  text-align:center;
}
.grid7{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:var(--gap);
}
.dowRow{padding:7px 6px 0}
.calWrap{padding:6px}
.dow{
  text-align:center;
  color:var(--mut);
  font-size:12px;
  font-weight:900;
  padding:3px 0;
}
.day{
  min-width:0;
  min-height:78px;
  padding:4px 1px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:11px;
  background:linear-gradient(180deg,#f8faff 0%,#f1f5ff 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:5px;
  cursor:pointer;
}
.day.muted{
  background:#f7f7f8;
  border-style:dashed;
  opacity:.55;
  cursor:default;
}
.day[data-dow="0"]{background:linear-gradient(180deg,#fff7f7,#ffeded)}
.day[data-dow="6"]{background:linear-gradient(180deg,#f5f8ff,#edf2ff)}
.day.today{
  outline:2px solid #6366f1;
  background:linear-gradient(180deg,#eef2ff,#e0e7ff);
}
.dayTop{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}
.dateNum{
  font-size:13px;
  font-weight:1000;
}
.list{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px 1px;
  align-content:start;
}
.boxBtn{
  width:100%;
  min-width:0;
  min-height:20px;
  padding:0;
  border:0;
  background:transparent;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  width:var(--boxPx);
  height:var(--boxPx);
  border-radius:4px;
  border:1px solid rgba(0,0,0,.14);
  background:#fff;
}
.box.on{border-color:transparent}

.hint{
  padding:10px 12px;
  text-align:center;
  color:var(--mut);
  font-size:12px;
  font-weight:700;
  border-top:1px solid var(--bd);
}

/* 모달 */
.modalBack{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.40);
  backdrop-filter:blur(5px);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:64px 10px 10px;
  z-index:50;
}
.modalBack.show{display:flex}
.modal{
  width:min(700px,100%);
  max-height:82vh;
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 28px 80px rgba(0,0,0,.24);
}
.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:11px 12px;
  border-bottom:1px solid var(--bd);
  background:linear-gradient(135deg,#eef2ff,#fff1f2);
}
.modalTitle{font-weight:1000}
.modalBody{padding:11px 12px;overflow:auto}

.activity-add{
  display:grid;
  grid-template-columns:minmax(0,1fr) 48px 70px;
  gap:7px;
  align-items:center;
  margin-bottom:10px;
}
.colorInput{
  width:48px;
  min-height:42px;
  padding:3px;
}
.activity-row{
  display:grid;
  grid-template-columns:22px minmax(0,1fr) 46px 46px 54px;
  gap:6px;
  align-items:center;
  padding:8px 7px;
  margin-top:7px;
  border:1px solid #eef0f5;
  border-radius:13px;
}
.activity-row b{
  min-width:0;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.activity-color{
  width:44px;
  min-height:36px;
  padding:2px;
}
.edit{
  background:#fff;
  color:#2563eb;
  border:1px solid #bfdbfe;
  min-height:36px;
  padding:5px 7px;
  font-size:12px;
}

.del{
  background:#fff;
  color:#dc2626;
  border:1px solid #fecaca;
  min-height:36px;
  padding:5px 7px;
  font-size:12px;
}

.check-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 10px;
  margin-bottom:8px;
  border:1px solid #edf0f5;
  border-radius:13px;
}
.check-left{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}
.check-left b{
  font-size:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.check-btn{
  min-width:92px;
  min-height:42px;
  background:#fff;
  color:#374151;
  border:1px solid var(--bd);
}
.check-btn.on{
  color:#fff;
  border-color:transparent;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.table th,.table td{
  padding:9px 6px;
  border-bottom:1px solid #f0f1f6;
  text-align:center;
}
.table th{color:var(--mut);font-weight:1000}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-weight:900;
}
.emptyMsg{
  padding:18px 8px;
  text-align:center;
  color:var(--mut);
  font-size:13px;
  font-weight:800;
}

@media(max-width:480px){
  :root{--gap:3px;--boxPx:14px}
  .wrap{padding:5px 2px}
  .brand{font-size:18px}
  .home-link{min-height:31px;padding:5px 9px}
  input,button{font-size:13px}
  button.small{padding:5px 7px;font-size:11px}
  .title{font-size:18px}
  .dowRow{padding:6px 2px 0}
  .calWrap{padding:3px 2px 5px}
  .day{min-height:72px;border-radius:9px;padding:4px 0}
  .dateNum{font-size:12px}
  .list{gap:4px 0}
  .tag{font-size:11px;padding:5px 7px}
  .activity-add{grid-template-columns:minmax(0,1fr) 46px 62px}
  .activity-row{
    grid-template-columns:18px minmax(0,1fr) 42px 42px 48px;
    gap:4px;
    padding:7px 4px;
  }
  .activity-row b{font-size:13px}
  .edit,.del{padding:4px 3px;font-size:11px}
  .activity-color{width:40px}
}
</style>
</head>

<body>
<div class="topbar">
  <div class="wrap">
    <div class="brand-row">
      <div class="brand">📅 민주 할일</div>
      <a class="home-link" href="./index.html">← 아빠와 민주</a>
    </div>

    <div class="row">
      <input id="month" class="grow" type="month"/>
      <button class="ghost small" id="prev" type="button">◀</button>
      <button class="ghost small" id="next" type="button">▶</button>
      <button class="small" id="openActivity" type="button">활동관리</button>
      <button class="small" id="openMonthSum" type="button">월간</button>
      <button class="small" id="openYearSum" type="button">연간</button>
    </div>

    <div class="legend" id="legend"></div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="cardHead">
      <div class="title" id="calTitle">생활 체크 달력</div>
    </div>
    <div class="dowRow grid7" id="dowRow"></div>
    <div class="calWrap">
      <div class="grid7" id="grid"></div>
    </div>
    <div class="hint">날짜를 누르면 크게 체크할 수 있고, 작은 네모를 직접 눌러도 바로 체크됩니다.</div>
  </div>
</div>

<!-- 날짜 체크 -->
<div class="modalBack" id="dayModalBack" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <div class="modalTitle" id="dayModalTitle">날짜 체크</div>
      <button class="ghost small" id="closeDayModal" type="button">닫기</button>
    </div>
    <div class="modalBody" id="dayModalBody"></div>
  </div>
</div>

<!-- 활동 관리 -->
<div class="modalBack" id="activityModalBack" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <div class="modalTitle">활동 관리</div>
      <button class="ghost small" id="closeActivityModal" type="button">닫기</button>
    </div>
    <div class="modalBody">
      <div class="activity-add">
        <input id="newActivityName" placeholder="예: 독서, 산책"/>
        <input id="newActivityColor" class="colorInput" type="color" value="#22c55e" aria-label="활동 색상"/>
        <button id="addActivityBtn" type="button">추가</button>
      </div>
      <div id="activityList"></div>
      <div style="margin-top:10px;color:#6b7280;font-size:12px;font-weight:700;">
        활동을 삭제하면 그 활동의 기존 체크 기록도 함께 삭제됩니다.
      </div>
    </div>
  </div>
</div>

<!-- 월간 집계 -->
<div class="modalBack" id="monthModalBack" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <div class="modalTitle" id="monthModalTitle">월간 집계</div>
      <button class="ghost small" id="closeMonthModal" type="button">닫기</button>
    </div>
    <div class="modalBody">
      <table class="table">
        <thead>
          <tr><th>활동</th><th>체크일</th><th>달성률</th></tr>
        </thead>
        <tbody id="monthSumBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 연간 집계 -->
<div class="modalBack" id="yearModalBack" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <div class="modalTitle" id="yearModalTitle">연간 집계</div>
      <button class="ghost small" id="closeYearModal" type="button">닫기</button>
    </div>
    <div class="modalBody">
      <table class="table">
        <thead>
          <tr><th>활동</th><th>체크일</th><th>연간비율</th></tr>
        </thead>
        <tbody id="yearSumBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";

import {
  getDatabase, ref, onValue, set, remove, get, update
} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

/* 기존 민주용돈과 같은 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyBQ2DvuwcyIctktubn7LlfJRP0hHfXfnCU",
  authDomain: "personal-51db3.firebaseapp.com",
  databaseURL: "https://personal-51db3-default-rtdb.firebaseio.com",
  projectId: "personal-51db3",
  storageBucket: "personal-51db3.firebasestorage.app",
  messagingSenderId: "146076749227",
  appId: "1:146076749227:web:a89002fef193ba224816ee"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/*
  기존 가계부:
  민주용돈/내역

  새 스케쥴:
  민주용돈/스케줄/activities
  민주용돈/스케줄/checks/YYYY-MM-DD/활동KEY
*/
const ROOT = "민주용돈/스케줄";
const activitiesRef = () => ref(db, `${ROOT}/activities`);
const checksRef = () => ref(db, `${ROOT}/checks`);
const dayRef = date => ref(db, `${ROOT}/checks/${date}`);
const cellRef = (date, key) => ref(db, `${ROOT}/checks/${date}/${key}`);

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ym = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const daysInMonth = (y,m) => new Date(y,m,0).getDate();
const firstDow = (y,m) => new Date(y,m-1,1).getDay();

let activities = [];   // [{key,name,color}]
let monthCache = {};   // {date:{activityKey:true}}
let currentMonth = "";
let monthToken = 0;
let seeded = false;

["일","월","화","수","목","금","토"].forEach(text=>{
  const el = document.createElement("div");
  el.className = "dow";
  el.textContent = text;
  $("dowRow").appendChild(el);
});

$("month").value = ym(new Date());

function openModal(id){
  $(id).classList.add("show");
  $(id).setAttribute("aria-hidden","false");
}
function closeModal(id){
  $(id).classList.remove("show");
  $(id).setAttribute("aria-hidden","true");
}

function safeColor(v){
  return /^#[0-9a-fA-F]{6}$/.test(v || "") ? v : "#6366f1";
}

function escapeHtml(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setBox(box,on,color){
  box.classList.toggle("on",on);
  box.style.background = on ? color : "#fff";
  box.style.boxShadow = on ? `0 4px 10px ${color}44` : "none";
}

async function toggleCheck(date,key){
  const data = monthCache[date] || {};
  const isOn = !!data[key];

  monthCache[date] = monthCache[date] || {};

  if(isOn){
    delete monthCache[date][key];
    await remove(cellRef(date,key));
  }else{
    monthCache[date][key] = true;
    await set(cellRef(date,key),true);
  }
}

/* 활동 최초 예시: 새 경로가 완전히 비어 있을 때만 생성 */
async function seedDefaults(){
  if(seeded) return;
  seeded = true;

  const snap = await get(activitiesRef());
  if(snap.exists()) return;

  await update(activitiesRef(), {
    gym:   {name:"헬스장", color:"#ef4444", createdAt:Date.now()},
    study: {name:"공부",   color:"#3b82f6", createdAt:Date.now()+1}
  });
}

onValue(activitiesRef(), async snap=>{
  const value = snap.val() || {};

  if(!snap.exists()){
    await seedDefaults();
    return;
  }

  activities = Object.entries(value)
    .map(([key,val])=>({
      key,
      name:String(val?.name || "활동"),
      color:safeColor(val?.color),
      createdAt:Number(val?.createdAt || 0)
    }))
    .sort((a,b)=>a.createdAt-b.createdAt || a.name.localeCompare(b.name,"ko"));

  renderLegend();
  renderActivityList();
  buildCalendar();
});

function renderLegend(){
  const legend = $("legend");
  legend.innerHTML = "";

  if(!activities.length){
    legend.innerHTML = `<span class="tag">활동관리에서 활동을 추가해 주세요.</span>`;
    return;
  }

  activities.forEach(a=>{
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.innerHTML = `<span class="swatch" style="background:${a.color}"></span>${escapeHtml(a.name)}`;
    legend.appendChild(tag);
  });
}

function renderActivityList(){
  const list = $("activityList");
  list.innerHTML = "";

  if(!activities.length){
    list.innerHTML = `<div class="emptyMsg">등록된 활동이 없습니다.</div>`;
    return;
  }

  activities.forEach(a=>{
    const row = document.createElement("div");
    row.className = "activity-row";

    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = a.color;

    const name = document.createElement("b");
    name.textContent = a.name;

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.type = "button";
    edit.textContent = "수정";
    edit.addEventListener("click", async ()=>{
      const next = prompt("활동 이름을 수정하세요.", a.name);
      if(next === null) return;

      const newName = next.trim();

      if(!newName){
        alert("활동 이름을 입력해 주세요.");
        return;
      }

      if(
        activities.some(
          item => item.key !== a.key && item.name === newName
        )
      ){
        alert("같은 이름의 활동이 이미 있습니다.");
        return;
      }

      await set(
        ref(db,`${ROOT}/activities/${a.key}/name`),
        newName
      );
    });

    const color = document.createElement("input");
    color.type = "color";
    color.className = "activity-color";
    color.value = a.color;
    color.setAttribute("aria-label",`${a.name} 색상`);
    color.addEventListener("change", async ()=>{
      await set(ref(db,`${ROOT}/activities/${a.key}/color`),color.value);
    });

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "삭제";
    del.addEventListener("click", async ()=>{
      if(!confirm(`'${a.name}' 활동을 삭제할까요?\n기존 체크 기록도 함께 삭제됩니다.`)) return;

      const allSnap = await get(checksRef());
      const all = allSnap.val() || {};
      const jobs = [];

      Object.keys(all).forEach(date=>{
        if(all[date] && all[date][a.key]){
          jobs.push(remove(cellRef(date,a.key)));
        }
      });

      jobs.push(remove(ref(db,`${ROOT}/activities/${a.key}`)));
      await Promise.all(jobs);
    });

    row.append(sw,name,edit,color,del);
    list.appendChild(row);
  });
}

$("addActivityBtn").addEventListener("click", async ()=>{
  const name = $("newActivityName").value.trim();
  const color = safeColor($("newActivityColor").value);

  if(!name){
    alert("활동 이름을 입력해 주세요.");
    $("newActivityName").focus();
    return;
  }

  if(activities.some(a=>a.name === name)){
    alert("같은 이름의 활동이 이미 있습니다.");
    return;
  }

  const key = `a_${Date.now()}`;
  await set(ref(db,`${ROOT}/activities/${key}`),{
    name,
    color,
    createdAt:Date.now()
  });

  $("newActivityName").value = "";
  $("newActivityName").focus();
});

$("newActivityName").addEventListener("keydown",e=>{
  if(e.key === "Enter") $("addActivityBtn").click();
});

function buildCalendar(){
  const monthStr = $("month").value || ym(new Date());
  currentMonth = monthStr;
  monthCache = {};
  monthToken++;

  const [Y,M] = monthStr.split("-").map(Number);
  const last = daysInMonth(Y,M);
  const start = firstDow(Y,M);

  $("calTitle").textContent = `${Y}년 ${M}월 생활 체크`;

  const grid = $("grid");
  grid.innerHTML = "";

  const now = new Date();
  const today = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;

  for(let i=0;i<42;i++){
    const dayNum = i - start + 1;
    const cell = document.createElement("div");

    if(dayNum < 1 || dayNum > last){
      cell.className = "day muted";
      grid.appendChild(cell);
      continue;
    }

    const date = `${monthStr}-${pad(dayNum)}`;
    cell.className = "day";
    cell.dataset.date = date;
    cell.dataset.dow = new Date(Y,M-1,dayNum).getDay();

    if(date === today) cell.classList.add("today");

    const top = document.createElement("div");
    top.className = "dayTop";
    top.innerHTML = `<div class="dateNum">${dayNum}</div>`;

    const list = document.createElement("div");
    list.className = "list";

    activities.forEach(a=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "boxBtn";
      btn.title = a.name;
      btn.setAttribute("aria-label",`${dayNum}일 ${a.name} 체크`);

      const box = document.createElement("span");
      box.className = "box";
      box.dataset.key = a.key;

      btn.appendChild(box);

      btn.addEventListener("click", async e=>{
        e.stopPropagation();
        await toggleCheck(date,a.key);
      });

      list.appendChild(btn);
    });

    cell.addEventListener("click",()=>openDayModal(date));
    cell.append(top,list);
    grid.appendChild(cell);
  }

  subscribeMonth(monthStr,last);
}

function subscribeMonth(monthStr,last){
  const myToken = monthToken;

  for(let d=1;d<=last;d++){
    const date = `${monthStr}-${pad(d)}`;

    onValue(dayRef(date),snap=>{
      if(myToken !== monthToken || currentMonth !== monthStr) return;

      const data = snap.val() || {};
      monthCache[date] = data;

      const cell = document.querySelector(`.day[data-date="${date}"]`);
      if(!cell) return;

      cell.querySelectorAll(".box").forEach(box=>{
        const key = box.dataset.key;
        const a = activities.find(x=>x.key === key);
        setBox(box,!!data[key],a?.color || "#6366f1");
      });

      if($("dayModalBack").classList.contains("show") &&
         $("dayModalBack").dataset.date === date){
        renderDayModal(date);
      }
    });
  }
}

function openDayModal(date){
  $("dayModalBack").dataset.date = date;
  renderDayModal(date);
  openModal("dayModalBack");
}

function renderDayModal(date){
  $("dayModalTitle").textContent = `${date} 활동 체크`;
  const body = $("dayModalBody");
  body.innerHTML = "";

  if(!activities.length){
    body.innerHTML = `<div class="emptyMsg">먼저 활동을 추가해 주세요.</div>`;
    return;
  }

  const data = monthCache[date] || {};

  activities.forEach(a=>{
    const row = document.createElement("div");
    row.className = "check-row";

    const left = document.createElement("div");
    left.className = "check-left";
    left.innerHTML = `<span class="swatch" style="background:${a.color}"></span><b>${escapeHtml(a.name)}</b>`;

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = `check-btn${data[a.key] ? " on" : ""}`;
    btn.textContent = data[a.key] ? "✓ 완료" : "체크";
    if(data[a.key]) btn.style.background = a.color;

    btn.addEventListener("click", async ()=>{
      await toggleCheck(date,a.key);
    });

    row.append(left,btn);
    body.appendChild(row);
  });
}

function shiftMonth(delta){
  const [Y,M] = ($("month").value || ym(new Date())).split("-").map(Number);
  const dt = new Date(Y,(M-1)+delta,1);
  $("month").value = ym(dt);
  buildCalendar();
}

$("prev").addEventListener("click",()=>shiftMonth(-1));
$("next").addEventListener("click",()=>shiftMonth(1));
$("month").addEventListener("change",buildCalendar);

$("openActivity").addEventListener("click",()=>openModal("activityModalBack"));
$("closeActivityModal").addEventListener("click",()=>closeModal("activityModalBack"));
$("closeDayModal").addEventListener("click",()=>closeModal("dayModalBack"));
$("closeMonthModal").addEventListener("click",()=>closeModal("monthModalBack"));
$("closeYearModal").addEventListener("click",()=>closeModal("yearModalBack"));

["activityModalBack","dayModalBack","monthModalBack","yearModalBack"].forEach(id=>{
  $(id).addEventListener("click",e=>{
    if(e.target.id === id) closeModal(id);
  });
});

$("openMonthSum").addEventListener("click",()=>{
  renderMonthlySummary();
  openModal("monthModalBack");
});

function renderMonthlySummary(){
  const monthStr = $("month").value || ym(new Date());
  const [Y,M] = monthStr.split("-").map(Number);
  const totalDays = daysInMonth(Y,M);
  $("monthModalTitle").textContent = `${Y}년 ${M}월 집계`;

  const body = $("monthSumBody");
  body.innerHTML = "";

  if(!activities.length){
    body.innerHTML = `<tr><td colspan="3">등록된 활동이 없습니다.</td></tr>`;
    return;
  }

  activities.forEach(a=>{
    let count = 0;
    for(let d=1;d<=totalDays;d++){
      const date = `${monthStr}-${pad(d)}`;
      if(monthCache[date]?.[a.key]) count++;
    }

    const pct = Math.round((count / totalDays) * 100);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="badge"><span class="swatch" style="background:${a.color}"></span>${escapeHtml(a.name)}</span></td>
      <td><b>${count}일</b></td>
      <td>${pct}%</td>
    `;
    body.appendChild(tr);
  });
}

$("openYearSum").addEventListener("click",async ()=>{
  await renderYearlySummary();
  openModal("yearModalBack");
});

async function renderYearlySummary(){
  const year = Number(($("month").value || ym(new Date())).split("-")[0]);
  $("yearModalTitle").textContent = `${year}년 집계`;

  const body = $("yearSumBody");
  body.innerHTML = `<tr><td colspan="3">불러오는 중…</td></tr>`;

  const snap = await get(checksRef());
  const all = snap.val() || {};
  const totalDays = ((year%4===0 && year%100!==0) || year%400===0) ? 366 : 365;

  body.innerHTML = "";

  if(!activities.length){
    body.innerHTML = `<tr><td colspan="3">등록된 활동이 없습니다.</td></tr>`;
    return;
  }

  activities.forEach(a=>{
    let count = 0;

    Object.entries(all).forEach(([date,data])=>{
      if(date.startsWith(`${year}-`) && data?.[a.key]) count++;
    });

    const pct = Math.round((count / totalDays) * 100);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="badge"><span class="swatch" style="background:${a.color}"></span>${escapeHtml(a.name)}</span></td>
      <td><b>${count}일</b></td>
      <td>${pct}%</td>
    `;
    body.appendChild(tr);
  });
}

/* 달력 좌우 스와이프 */
const swipeArea = document.querySelector(".card");
let sx=0, sy=0, st=0;

swipeArea.addEventListener("touchstart",e=>{
  if(e.touches.length !== 1) return;
  if(e.target.closest("button,input,a")) return;
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
  st=Date.now();
},{passive:true});

swipeArea.addEventListener("touchend",e=>{
  if(!st || Date.now()-st > 700) return;

  const t=e.changedTouches?.[0];
  if(!t) return;

  const dx=t.clientX-sx;
  const dy=t.clientY-sy;

  if(Math.abs(dy)>60 || Math.abs(dx)<45) return;
  shiftMonth(dx<0 ? 1 : -1);
},{passive:true});

seedDefaults();
</script>
