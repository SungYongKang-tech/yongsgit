<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#f5f8ff;background:#0b1221;font-synthesis:none}
*{box-sizing:border-box}
html{overflow-y:auto;overscroll-behavior-y:auto}body{margin:0;min-height:100dvh;overflow-y:auto;background:radial-gradient(ellipse at 50% -15%,#244677 0%,#101c31 45%,#0a1120 100%)}
button{font:inherit;cursor:pointer}
.app{max-width:640px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{padding:19px 2px 7px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#7bbaff}
.h1{font-size:20px;line-height:1.35;font-weight:850;margin:4px 0 5px}
.sub{color:#aabbd4;font-size:12px;line-height:1.55}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#17253c;border:1px solid #354764;border-radius:14px;padding:4px;gap:5px;margin:12px 0 9px}
.tab{border:0;border-radius:10px;padding:11px 5px;background:transparent;color:#a5bad6;font-weight:800;font-size:14px}
.tab.active{background:#417bdd;color:white;box-shadow:0 3px 12px #132f5d}
.bar{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:5px 3px 11px;color:#bed0e9;font-size:12px;flex-wrap:wrap}
.bar strong{color:white}
.progress{height:4px;background:#283650;border-radius:20px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#58b4ff,#9fe4ed);transition:width .2s}
.card-wrap{flex:0 0 auto;display:block;min-height:0;padding-top:14px}
.card{background:linear-gradient(155deg,#203757,#15253d 45%,#121f34);border:1px solid #455f80;border-radius:24px;box-shadow:0 22px 45px #02071270;padding:22px 19px 18px;min-height:340px;overflow:visible;touch-action:pan-y}
.tagline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;border-radius:30px;background:#2d5080;color:#c7e6ff;padding:7px 12px;font-size:12px;font-weight:800}
.sequence{font-size:12px;color:#a8bdd5}
.time{font-size:clamp(26px,7.4vw,39px);letter-spacing:-1.4px;font-weight:900;margin-top:18px;line-height:1.25;white-space:nowrap;overflow-x:auto;overflow-y:hidden}
.time span{color:#6cb3f7;font-size:24px}
.duration{font-size:12px;margin:7px 0 20px;color:#afc7e4}
.team{font-size:20px;line-height:1.43;overflow-wrap:anywhere;font-weight:850;margin:0 0 10px}
.content{font-size:16px;font-weight:650;line-height:1.62;color:#e5f3ff;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 17px}
.details{border-top:1px solid #3c526f;padding-top:15px;display:grid;gap:13px}
.detail .label{font-size:11px;color:#95b6db;letter-spacing:.4px;font-weight:800;margin-bottom:5px}
.detail .value{font-size:14px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;color:#f3f7ff}
.muted{color:#8ca4c2!important}
.controls{display:flex;gap:9px;margin:14px 0 9px}
.nav{min-height:48px;border-radius:13px;background:#203755;color:#e8f4ff;border:1px solid #45628c;font-weight:750;flex:1}
.nav:disabled{opacity:.28}
.nav.primary{background:#327ad5;border-color:#468ee9}
.hint{font-size:12px;color:#8fa8c6;text-align:center;margin:2px 0 14px}
.footerbuttons{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding-bottom:10px}
.tiny{border:1px solid #344964;border-radius:9px;color:#b9cde4;padding:7px 10px;background:#13233a;font-size:11px}
.summary{display:none;background:#14253c;border:1px solid #344963;padding:15px;border-radius:15px;max-height:45dvh;overflow:auto;margin:5px 0}
.summary.open{display:block}
.summary p{font-size:12px;color:#bed0e5;line-height:1.75;margin:6px 0}
.list{display:none;position:fixed;inset:0;z-index:3;background:#0a1324ed;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom);overflow:auto}
.list.open{display:block}
.list-inner{max-width:600px;margin:auto}
.list h2{font-size:20px}
.listitem{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;color:#edf6ff;background:#1c304d;border:1px solid #3b5879;border-radius:13px}
.listitem small{display:block;color:#8bb8eb;margin-bottom:4px}
.close{position:sticky;top:5px;float:right;background:#387bd4;border:0;color:white;border-radius:9px;padding:9px 13px}
.share{background:linear-gradient(110deg,#ffed83,#f9d53b);border:1px solid #ffe278;color:#342a06;font-weight:850;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;padding:10px 13px;border-radius:12px}
.share:active{transform:scale(.98)}
.share-toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#eff6ff;color:#1b3155;padding:12px 16px;border-radius:12px;box-shadow:0 10px 28px #0008;z-index:8;max-width:min(90vw,420px);font-size:13px;line-height:1.5;display:none;text-align:center}
.share-toast.visible{display:block}
@media(min-height:850px){.card{padding-top:29px}.time{margin-top:25px}.team{font-size:22px}}
@media(max-width:390px){.tabs{grid-template-columns:repeat(3,1fr)} .tab{font-size:13px;padding:10px 4px} .time{font-size:25px} .card{padding:17px 14px} .team{font-size:19px}}

/* 탁구 경기 기록 관리 */
.tennis-switch{display:none;gap:8px;margin:9px 0 6px}.tennis-switch.show{display:flex}
.tennis-mode{flex:1;padding:11px 5px;border:1px solid #3b567a;border-radius:11px;background:#162b46;color:#d4e8ff;font-size:13px;font-weight:800}.tennis-mode.active{background:#4288d7;color:#fff;border-color:#7ab4f2}
.tennis-panel{display:none;padding-bottom:18px}.tennis-panel.show{display:block}
.tennis-head{margin:14px 0 8px}.tennis-head h2{font-size:20px;margin:5px 0}.tennis-head p{font-size:12px;color:#bdcce0;line-height:1.6;margin:5px 0 12px}
.tennis-disciplines{display:flex;gap:6px;position:sticky;top:0;z-index:2;background:#101d30;padding:9px 0}
.discipline-btn{flex:1;min-height:42px;background:#1d344f;border:1px solid #466383;border-radius:10px;color:#d7eaff;font-size:13px;font-weight:800}.discipline-btn.active{background:#397dcb;border-color:#9acaff;color:#fff}
.tennis-section{background:#152840;border:1px solid #3a5575;border-radius:17px;padding:15px 12px;margin:13px 0}
.tennis-section h3{margin:0 0 7px;font-size:17px}.tennis-section p{font-size:12px;color:#aabfda;margin:3px 0 11px;line-height:1.5}
.group-card{margin:10px 0;padding:12px;border-radius:12px;background:#1d3551;border:1px solid #365a81}.group-card h4{margin:0 0 10px;font-size:14px;color:#c6e6ff}
.rankrow{display:grid;grid-template-columns:53px minmax(0,1fr);gap:7px;align-items:center;margin:7px 0}.rankrow label{font-size:13px;font-weight:750;color:#dcecff}.rankrow select{width:100%;min-width:0;font:inherit;font-size:13px;background:#0e2035;color:#f4f9ff;border:1px solid #6384a7;border-radius:9px;padding:10px 7px}
.group-players{font-size:11px;color:#b7cae3;line-height:1.65;margin:6px 0 10px;overflow-wrap:anywhere}
.stage-title{font-size:13px;margin:16px 0 8px;color:#a8d9ff;font-weight:900}
.match{border:1px solid #436282;border-radius:12px;background:#203852;margin:9px 0;padding:10px}.match.final{border-color:#d7b55d;background:#343223}.match-top{font-size:11px;color:#a7c5e4;font-weight:800;margin:0 0 7px}
.contender{width:100%;min-height:43px;display:flex;align-items:center;text-align:left;justify-content:space-between;gap:10px;padding:8px 10px;margin-top:5px;background:#152943;border:1px solid #415b7a;border-radius:9px;color:#eef6ff;font-size:13px;overflow-wrap:anywhere}
.contender:disabled{opacity:.6;cursor:default}.contender.winner{background:#236b56;border-color:#74d3a4;color:white;font-weight:850}.contender .slot{font-size:10px;color:#b3cce3;flex-shrink:0}
.champion{border:1px solid #d3b366;background:linear-gradient(120deg,#483b21,#2e352c);padding:14px;border-radius:12px;margin-top:15px;font-weight:900;line-height:1.6}.champion small{display:block;color:#ffe39b;font-size:12px}
.rec-tools{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.rec-tools button{flex:1;min-width:130px;padding:11px 6px;border-radius:9px;border:1px solid #5276a0;background:#223a59;color:#e4f3ff;font:inherit;font-size:12px;font-weight:750}.rec-tools .danger{border-color:#bd6b65;color:#ffe2de;background:#432a34}
.rec-note{font-size:11px;color:#a7bcdb;line-height:1.65}.rec-status{font-size:12px;color:#c5e5d8;padding:8px 0}.rec-message{background:#234535;padding:11px 12px;border-radius:10px;font-size:12px;white-space:pre-wrap;line-height:1.6;margin-top:8px}

.firebase-state{margin:10px 0;padding:10px 12px;background:#142a43;border:1px solid #3e6389;border-radius:12px;color:#c2daf0;font-size:12px;line-height:1.5}
.adminbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.adminbar button{background:#274973;border:1px solid #5489bd;color:white;padding:10px 14px;border-radius:9px;font-weight:800;font-size:13px}
.adminbar button.unlocked{background:#27553f;border-color:#58a580}
.adminbar .adminhint{font-size:11px;color:#a8c0de}

/* 터치 선택형 예선 순위와 대진 경로 안내 */
.group-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.group-title h4{margin:0}.group-count{font-size:11px;color:#a9c7e6}
.rank-tiles{display:grid;gap:8px}.rank-tile{display:grid;grid-template-columns:47px minmax(0,1fr);align-items:center;column-gap:9px;text-align:left;padding:11px;border-radius:11px;background:#132b45;border:1px solid #58728d;color:#e9f4ff;width:100%}.rank-tile.selected{border:2px solid #ffd46c;background:#334566;padding:10px}.rank-tile.filled{background:#214865}.rank-tile strong{font-size:15px}.rank-tile small{grid-column:2;color:#aed1f2;font-size:11px;line-height:1.5;margin-top:3px}.rank-number{font-weight:900;font-size:13px;color:#ffe298}
.rank-guide{margin:13px 0 7px!important;font-size:12px!important;color:#e1ecff!important}.player-picks{display:grid;gap:7px}.player-pick{display:flex;align-items:center;gap:9px;min-height:54px;text-align:left;background:#254360;border:1px solid #6583a5;color:white;border-radius:11px;padding:9px 11px;width:100%}.player-pick.assigned{background:#244c45;border-color:#5ca896}.player-pick.target-player{outline:2px solid #ffd46c}.player-pick:disabled{opacity:.8}.player-badge{font-size:11px;font-weight:850;background:#3d5e80;border-radius:7px;padding:7px;min-width:38px;text-align:center}.player-pick.assigned .player-badge{background:#2a8066}.player-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.player-info strong{font-size:15px}.player-info small{font-size:11px;color:#bacfe5;overflow-wrap:anywhere}.player-check{font-size:19px;color:#b3eacf}
</style>
</head>
<body>
<main class="app">
<header>
<div class="eyebrow">2026 JINJU INNOVATION CITY</div>
<h1 class="h1">경남 진주 혁신도시의 날</h1>
<div class="sub">11.10.(화) 탁구경기 · 11.11.(수) 본행사/리허설 · 손가락으로 넘겨 확인</div>
</header>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="tennis-switch" id="tennisSwitch"><button class="tennis-mode active" id="tennisInfoBtn" onclick="switchTennisView('info')">📋 일정·대진 안내</button><button class="tennis-mode" id="tennisRecordBtn" onclick="switchTennisView('record')">🏆 경기결과 입력</button></div>
<section class="tennis-panel" id="tennisPanel"></section>
<div class="bar" id="scheduleBar"><span id="position"></span><span id="range"></span></div>
<div class="progress" id="scheduleProgress"><div id="progress"></div></div>
<div class="card-wrap" id="scheduleCardWrap">
<article class="card" id="card" aria-live="polite">
<div class="tagline"><span class="tag" id="category"></span><span class="sequence" id="sequence"></span></div>
<div class="time" id="time"></div>
<div class="duration" id="duration"></div>
<h2 class="team" id="team"></h2>
<p class="content" id="content"></p>
<div class="details" id="details"></div>
</article>
</div>
<div class="controls" id="scheduleControls"><button class="nav" onclick="move(-1)" id="prev">← 이전</button><button class="nav primary" onclick="move(1)" id="next">다음 →</button></div>
<div class="hint" id="scheduleHint">위아래로 내용 스크롤 · 좌우로 밀어서 일정 이동</div>
<div class="footerbuttons" id="scheduleFooter">
<button class="share" onclick="shareKakao()" aria-label="카카오톡 등으로 공유">💬 카카오톡 공유</button>
<button class="tiny" onclick="showList()">☷ 전체 보기</button>
<button class="tiny" onclick="toggleInfo()">ⓘ 행사 안내</button>
<button class="tiny" onclick="jumpCurrent()">◷ 현재 시간 일정</button>
</div>
<section class="summary" id="info"></section>
</main>
<aside class="list" id="list"><div class="list-inner"><button class="close" onclick="hideList()">닫기 ✕</button><h2 id="listTitle">전체 일정</h2><div id="listItems"></div></div></aside>
<div class="share-toast" id="shareToast" role="status" aria-live="polite"></div>
<!-- Firebase compat SDK: 정적 Netlify 사이트에서 바로 실행 -->
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script defer src="./app.js"></script>
</body>
