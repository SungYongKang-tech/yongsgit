  if(!isWeb){toast('카카오톡 링크 공유는 웹에 올린 뒤 가능합니다. 먼저 index.html과 kakao-preview.png를 같은 폴더에 게시해 주세요.');return}
  const url=location.href.split('#')[0].split('?')[0];
  const payload={title:SHARE_TITLE,text:SHARE_TEXT,url};
  if(navigator.share){try{await navigator.share(payload);return}catch(err){if(err&&err.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(`${SHARE_TITLE}\n${SHARE_TEXT}\n${url}`);toast('공유 문구와 링크를 복사했어요. 카카오톡 대화창에 붙여넣으세요.');return}catch(e){}
  const input=document.createElement('textarea');input.value=`${SHARE_TITLE}\n${SHARE_TEXT}\n${url}`;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();let copied=false;try{copied=document.execCommand('copy')}catch(e){}input.remove();toast(copied?'공유 문구와 링크를 복사했어요. 카카오톡에 붙여넣으세요.':'링크를 복사할 수 없습니다. 브라우저 주소창에서 주소를 복사해 주세요.');
}
const keys=['타임테이블','리허설'];let current='타임테이블',indices={'타임테이블':0,'리허설':0};
const el=id=>document.getElementById(id);const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const rows=DATA.sheets[current],idx=indices[current],r=rows[idx];el('tab-event').classList.toggle('active',current==='타임테이블');el('tab-rehearsal').classList.toggle('active',current==='리허설');el('position').innerHTML=`<strong>${idx+1}</strong> / ${rows.length} 일정`;el('range').textContent=current==='타임테이블'?'본행사 · 17:50 ~ 21:00':'리허설 · 15:00 ~ 17:30 (종료 항목 포함)';el('progress').style.width=`${(idx+1)/rows.length*100}%`;el('category').textContent=r.category||'미분류';el('sequence').textContent=`원본 순번 ${r.n||'—'} · ${r.sourceRow}행`;el('time').innerHTML=`${safe(r.start||'시간 미정')} <span>→</span> ${safe(r.end||'종료 미정')}`;el('duration').textContent=r.duration?`진행 시간 ${r.duration}분`:'진행 시간 미기재';el('team').textContent=r.team||'출연팀 / 구성 미기재';el('content').textContent=r.content||'내용 미기재';el('details').innerHTML=[['운영 큐(안)',r.cue],['확인사항',r.check]].map(([label,value])=>`<div class="detail"><div class="label">${label}</div><div class="value ${!value?'muted':''}">${safe(value||'원본 공란')}</div></div>`).join('');el('prev').disabled=idx===0;el('next').disabled=idx===rows.length-1;el('card').scrollTop=0;localStorage.setItem('jinju-schedule-position',JSON.stringify({current,indices}));}
function move(delta){const n=indices[current]+delta;if(n<0||n>=DATA.sheets[current].length)return;indices[current]=n;render()}
function changeTab(tab){current=tab;el('info').classList.remove('open');render()}
function toggleInfo(){const box=el('info');box.classList.toggle('open');box.innerHTML=DATA.meta[current].map(x=>`<p>${safe(x)}</p>`).join('')+`<p>원본 엑셀 시트: ${safe(current)} · 원본 순번 및 내용 보존 (빈 칸은 ‘원본 공란’으로 표시)</p>`}
function showList(){const rows=DATA.sheets[current];el('listTitle').textContent=(current==='타임테이블'?'본행사':'리허설')+' 전체 일정';el('listItems').innerHTML=rows.map((r,i)=>`<button class="listitem" data-i="${i}"><small>${i+1}/${rows.length} · ${safe(r.start||'미정')} ~ ${safe(r.end||'미정')} · ${safe(r.category)}</small>${safe(r.team||r.content||'일정')}</button>`).join('');el('list').classList.add('open');el('listItems').querySelectorAll('button').forEach(b=>b.onclick=()=>{indices[current]=Number(b.dataset.i);hideList();render()})}
function hideList(){el('list').classList.remove('open')}
function jumpCurrent(){const now=new Date(),hm=now.toTimeString().slice(0,5),rows=DATA.sheets[current];let target=rows.findIndex(r=>r.start&&r.end&&r.start<=hm&&hm<r.end);if(target<0)target=rows.findIndex(r=>r.start&&r.start>=hm);if(target<0)target=rows.length-1;indices[current]=target;render()}
let sy=0,sx=0,started=false;document.addEventListener('touchstart',e=>{if(el('list').classList.contains('open')||e.touches.length!==1)return;sy=e.touches[0].clientY;sx=e.touches[0].clientX;started=true},{passive:true});document.addEventListener('touchend',e=>{if(!started||el('list').classList.contains('open'))return;started=false;const dy=e.changedTouches[0].clientY-sy,dx=e.changedTouches[0].clientX-sx;if(Math.abs(dy)>65&&Math.abs(dy)>Math.abs(dx)*1.3){const node=e.target;if(node.closest('button')||node.closest('.summary'))return;move(dy<0?1:-1)}},{passive:true});document.addEventListener('keydown',e=>{if(el('list').classList.contains('open')){if(e.key==='Escape')hideList();return}if(e.key==='ArrowUp'||e.key==='PageDown')move(1);if(e.key==='ArrowDown'||e.key==='PageUp')move(-1)});
try{const s=JSON.parse(localStorage.getItem('jinju-schedule-position'));if(s&&keys.includes(s.current)){current=s.current;for(const k of keys){if(Number.isInteger(s.indices?.[k])&&s.indices[k]>=0&&s.indices[k]<DATA.sheets[k].length)indices[k]=s.indices[k]}}}catch(e){}render();
</script></body></html>
