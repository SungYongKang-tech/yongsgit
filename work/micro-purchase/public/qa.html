<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>소액계약 동일업체 반복 제한 Q&A</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="qaSecure" class="hidden">
<header class="topbar"><div class="container inner"><div class="brand"><b>소액계약 동일업체 반복 제한 Q&A</b><span>2026.9 FAQ 기준</span></div><div class="top-actions"><a class="btn primary" href="./index.html">대장으로 돌아가기</a></div></div></header>
<main class="container qa-wrap">
  <div class="card" style="margin-bottom:16px">
    <h2 style="margin-top:0">핵심 기준</h2>
    <div class="statusbox warn"><b>2026년 산정기간:</b> 2026.6.30.~12.31. / <b>2027년부터:</b> 매년 1.1.~12.31.<br><b>5회 초과:</b> 동일업체 계약 자체가 금지되는 것이 아니라 객관적인 사유 명시가 필요합니다.</div>
    <div class="doc-links" style="margin-top:12px">
       </div>
    <div class="qa-toolbar"><input id="qaSearch" class="input" type="search" placeholder="질문이나 답변 검색 (예: 5회, 안전, 긴급, 우선구매)" /></div>
  </div>
  <div id="qaList"></div>
</main>
</div>
<script>
const ACCESS_KEY = "microPurchaseAccessV1";
const ACCESS_TOKEN = "granted-1930";
if (localStorage.getItem(ACCESS_KEY) !== ACCESS_TOKEN) {
  location.replace("./index.html");
} else {
  document.getElementById("qaSecure").classList.remove("hidden");
}

const DATA = [
{section:'1. 제도도입과 적용기준',q:'Q1 소액계약 시 동일업체 반복 제한 조항이 추가된 사유가 무엇인가요?',a:'2025년 12월 국민권익위원회의 「공공기관 수의계약제도 운영 투명성 제고」 관련 제도개선 권고사항을 반영하여, 특정 업체와의 반복적 소액수의계약을 통한 부패 위험을 예방하고 계약의 투명성과 공정성을 제고하기 위해 2026년 6월 말 신설되었습니다. 5개 발전사 모두 권고사항을 반영하였고, 우리 회사는 의견수렴 과정에서 산업안전보건법 등 관계 법령에 따른 안전·보건 확보를 위한 공사·용역·물품은 예외로 하는 단서를 포함했습니다.'},
{section:'1. 제도도입과 적용기준',q:'Q2 적용기준일이 1월~12월 기준인가요? 개정일(6.30)부터인지요?',a:'연간 산정기간은 원칙적으로 매년 1월 1일부터 12월 31일까지입니다. 다만 2026년은 시행일인 6월 30일부터 12월 31일까지의 기간으로 횟수를 산정합니다.'},
{section:'1. 제도도입과 적용기준',q:'Q3 부서별 연 5회 기준을 파트별·개인별 기준으로 조정할 여지는 없나요?',a:'연 5회 기준은 권익위가 제시한 반복계약 관리기준(통상 연 3~5회)의 상한을 반영한 것입니다. 부서별 인원 차이는 인정되나 파트별·개인별 기준은 제도의 실효성이 약화될 수 있어 현 단계에서 상향은 곤란합니다.'},
{section:'1. 제도도입과 적용기준',q:'Q4 2,000만원 건과 1만원 건이 같은 기준인가요? 금액별 차등 기준은 없나요?',a:'현재 규정은 추정가격 2,000만원 미만인 소액계약 전체에 금액과 관계없이 횟수 기준을 일괄 적용합니다. 동일업체와 연 5회를 초과하여 반복 수의계약을 체결하는 경우 부득이한 근거를 제시하여 구매할 수 있습니다.'},
{section:'1. 제도도입과 적용기준',q:'Q5 사유만 명시하면 횟수 제한 없이 계속 동일 업체를 사용할 수 있나요?',a:'가능합니다. 이 조항은 동일업체 거래 자체를 금지하는 것이 아니라 ‘사유 명시 의무’를 부과하는 것입니다. 타당한 사유가 있다면 횟수와 무관하게 계속 거래할 수 있으나, 형식적 체크가 아닌 실질적인 사유를 기재해야 합니다.'},
{section:'1. 제도도입과 적용기준',q:'Q6 도서지역은 업체 수가 적은데 횟수가 아닌 총금액 기준으로 변경할 계획은 없나요?',a:'현재로서는 변경계획이 없습니다. 지역여건에 따라 최대한 다양한 업체를 활용하되, 불가피한 경우에는 지역 여건상 납품 가능 업체가 제한적인 경우로 사유를 명시하여 동일업체에서도 구매할 수 있습니다.'},
{section:'1. 제도도입과 적용기준',q:'Q7 간이공사(또는 용역)도 5회 제한에 포함되나요?',a:'부서에서 자체적으로 체결하는 소액수의계약에 적용됩니다. 간이공사(또는 용역)는 견적서를 여러 개 받더라도 경쟁입찰이 아닌 소액수의계약으로 간주되므로 적용받습니다.'},
{section:'1. 제도도입과 적용기준',q:'Q8 경쟁입찰로 계약한 횟수도 동일업체 횟수 산정에 포함되나요?',a:'포함하지 않습니다. 부서에서 자체적으로 체결한 소액계약 횟수만으로 산정합니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q9 일반적으로 인정 가능한 ‘사유’에는 어떤 것들이 있나요?',a:'지역 여건상 납품 가능 업체가 제한적인 경우, 설비·기술의 특수성으로 대체 업체 확보가 어려운 경우, 정부 우선구매 대상 물품인 경우, 긴급한 복구·납기가 필요한 경우, 기존 설비와의 호환성·연속성이 필요한 경우 등이 있습니다. 편의, 친분, 관행 등은 사유가 될 수 없습니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q10 발전설비 신뢰도에 영향을 미치는 주요 자재 구매 건이면 반복 구매 사유가 되나요?',a:'발전설비 신뢰도에 영향을 미친다는 사정만으로는 사유가 되지 않습니다. 다만 호환성, 긴급 복구, 단일 제작사, 대체 업체 부재 등이 확인되면 반복 구매 사유로 명시할 수 있습니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q11 정비업체가 한정된 중장비의 동일업체 반복 거래가 필요합니다. 사유가 될 수 있나요?',a:'정비 가능 업체가 제한되고 원거리 업체 이용 시 비용·납기·설비운영에 불리한 점이 객관적으로 확인된다면 사유로 인정할 수 있습니다. 설비 운영의 시급성과 대체업체 부재 등 구체적 사유를 기재하면 됩니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q12 제주·도서지역의 제한된 공급시장과 운송비 등은 반복 구매 사유가 되나요?',a:'제한된 공급시장, 운송비, 긴급 납기 등은 반복 구매 사유로 인정할 수 있습니다. 다만 가능한 경우 다양한 업체를 활용하고, 불가피한 경우 사유를 명시하여 동일업체에서 구매할 수 있습니다. 법인카드 구매는 법인카드관리지침에 따릅니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q13 명찰, 플래카드 같은 일회성 소모품도 매번 업체를 바꿔야 하나요?',a:'매번 업체를 의무적으로 변경하라는 의미는 아닙니다. 동일한 품질·디자인 연속성·신속성 등을 근거로 동일업체 선정 필요성이 있을 수 있습니다. 다만 ‘긴급’을 상시적인 사유로 반복 기재하는 것은 지양해야 합니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q14 연 5회를 초과한 업체가 최저가 견적을 제출한 경우 어떻게 하나요?',a:'5회 초과라는 이유만으로 더 비싼 업체를 선정할 필요는 없습니다. 가격·품질·납기 등을 비교한 결과 기존 업체가 가장 유리하다면 동일업체 선정 사유를 명시한 후 구매처를 선정할 수 있습니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q15 일반 기안문서로 품의 시에도 같은 수준으로 사유를 기재하면 되나요?',a:'예외 사유가 충분히 전달된다면 간단히 작성해도 무방합니다. FAQ Q9의 답변 수준으로 작성하면 됩니다.'},
{section:'2. 반복계약 사유와 작성방법',q:'Q16 소액발전자재에도 해당되나요? 사유는 어디에 명시하나요?',a:'소액발전자재에도 해당됩니다. GENi 소액자재구매 시스템을 이용하는 경우 기타(1300자) 항목에 동일 계약상대방과 연 5회를 초과하여 계약을 체결한 사유를 명시하면 됩니다.'},
{section:'3. 예외판단 및 책임',q:'Q17 O/H 기간 등 업무가 바쁠 때 예외사항을 둘 수 있나요?',a:'O/H 기간 또는 단순한 업무 과중만으로는 예외가 되지 않습니다. 다만 설비 안전·신뢰도 확보를 위한 긴급성, 납기 제약, 정비 가능 업체 제한 등이 구체적으로 확인되면 반복 구매 사유로 명시할 수 있습니다.'},
{section:'3. 예외판단 및 책임',q:'Q18 연 5회 초과 구매 시 판단은 구매부서장이 하면 되나요? 추가 결재선이나 서류가 필요한가요?',a:'담당자는 주관적 판단이 아니라 객관적으로 사유를 판단하고 부서장의 책임 하에 추진하면 됩니다. 감사 등의 추가 결재선 및 서류는 별도로 필요하지 않습니다.'},
{section:'3. 예외판단 및 책임',q:'Q19 안전 관련 구매면 모두 예외인가요?',a:'아닙니다. 산업안전보건법 등 관계 법령에 따라 반드시 필요한 안전·보건 조치를 위한 공사·용역·물품인 경우 예외 적용을 검토할 수 있습니다. 안전시설, 보호구, 위험요인 개선 등은 해당될 수 있으나 현수막·홍보물·기념품 등 일반 홍보 목적 구매는 예외에 해당하지 않습니다.'},
{section:'3. 예외판단 및 책임',q:'Q20 우선구매, 긴급 사유로 동일업체 반복 구매하면 추후 문제가 되지 않나요?',a:'우선구매 필요성과 긴급성은 반복 계약의 합리적인 사유가 될 수 있습니다. 다만 실질적 필요성이 아닌 ‘긴급’을 상시적으로 반복 기재하는 것은 문제가 될 수 있습니다.'},
{section:'4. 기타',q:'Q21 연 5회 초과 업체 확인을 위한 구매 이력은 부서별 별도 관리해야 하나요?',a:'현재로서는 부서 자체적으로 구매 이력을 관리해야 합니다. 소액물품은 인트라넷의 소액물품 시스템, 소액발전자재는 GENi 소액자재구매에서 부서별 이력을 확인할 수 있으므로 보완하여 이용할 수 있습니다.'},
{section:'4. 기타',q:'Q22 신규 업체의 품질·납기 문제로 차질이 생기면 담당자가 책임져야 하나요?',a:'정상적인 선정 절차를 거쳐 업체를 선정했다면 사후 발생한 품질·납기 문제만으로 담당자에게 과도한 책임을 부과할 수는 없습니다. 일반적인 계약행정 책임 원칙이 동일하게 적용됩니다.'},
{section:'4. 기타',q:'Q23 우선구매 지표 조정이 필요한 것 아닌가요?',a:'우선구매는 사유를 명시할 경우 5회를 초과하여도 구매할 수 있는 사유가 되므로 규정 신설로 지표조정이 이루어지지는 않습니다. 다만 같은 물품을 다양한 업체에서 구매할 수 있다면 다수 업체 이용을 권고합니다.'},
{section:'4. 기타',q:'Q24 기부금 지급 및 전표처리도 횟수 산정 대상인가요?',a:'복지시설에 대한 기부금 지급 및 전표처리 자체는 횟수 산정 대상이 아닙니다. 다만 기부를 위해 사회적기업 쇼핑몰 등에서 물품을 구매한다면 그 구매처를 기준으로 적용 여부를 판단해야 합니다.'}
];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=document.getElementById('qaSearch').value.trim().toLowerCase();const filtered=DATA.filter(x=>!q||(x.q+' '+x.a+' '+x.section).toLowerCase().includes(q));const groups={};filtered.forEach(x=>(groups[x.section]??=[]).push(x));document.getElementById('qaList').innerHTML=Object.entries(groups).map(([s,items])=>`<section class="qa-section"><h2>${esc(s)}</h2>${items.map(x=>`<div class="qa-item"><button class="qa-q"><span>${esc(x.q.split(' ')[0])}</span><span>${esc(x.q.replace(/^Q\d+\s*/,''))}</span></button><div class="qa-a hidden">${esc(x.a)}</div></div>`).join('')}</section>`).join('')||'<div class="card">검색 결과가 없습니다.</div>';document.querySelectorAll('.qa-q').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.toggle('hidden'))}
document.getElementById('qaSearch').addEventListener('input',render);render();
</script>
</body>
</html>
