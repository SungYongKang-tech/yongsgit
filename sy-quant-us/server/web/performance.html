<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SY Quant US 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.15; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      color: #fff;
      background: #2563eb;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn.secondary { background: #374151; }
    .status-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      color: #9ca3af;
      font-size: 12px;
    }
    .status-pill {
      padding: 5px 8px;
      border-radius: 999px;
      background: #1f2937;
      color: #d1d5db;
      font-weight: 700;
    }
    .status-pill.ok { color: #86efac; }
    .status-pill.bad { color: #fca5a5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .card {
      min-height: 68px;
      padding: 9px;
      border-radius: 12px;
      background: #1f2937;
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
    }
    .label {
      color: #9ca3af;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 5px;
    }
    .value {
      font-size: 19px;
      font-weight: 900;
      text-align: right;
      word-break: keep-all;
    }
    .plus { color: #f87171 !important; }
    .minus { color: #60a5fa !important; }
    .section { margin-top: 14px; }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .section h2 { font-size: 18px; margin: 0; }
    .section-note { color: #9ca3af; font-size: 12px; text-align: right; }
    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .strategy-card {
      padding: 12px;
      border-radius: 14px;
      background: #1f2937;
      border: 1px solid #374151;
    }
    .strategy-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .strategy-name { font-weight: 900; font-size: 16px; }
    .strategy-status {
      color: #cbd5e1;
      background: #374151;
      border-radius: 999px;
      padding: 4px 7px;
      font-size: 11px;
      white-space: nowrap;
    }
    .strategy-profit { font-size: 23px; font-weight: 900; text-align: right; }
    .strategy-sub {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: #9ca3af;
      font-size: 12px;
    }
    .strategy-sub b { color: #e5e7eb; }
    .empty {
      padding: 20px;
      border-radius: 12px;
      background: #1f2937;
      color: #9ca3af;
      text-align: center;
    }
    .holding-list { display: grid; gap: 8px; }
    .holding-card {
      display: grid;
      grid-template-columns: minmax(150px, 1.4fr) repeat(5, minmax(90px, .8fr));
      gap: 7px;
      align-items: center;
      padding: 11px;
      border-radius: 13px;
      background: #1f2937;
      border: 1px solid #374151;
    }
    .holding-name { font-size: 16px; font-weight: 900; }
    .holding-sub { color: #9ca3af; font-size: 11px; margin-top: 3px; }
    .metric { text-align: right; }
    .metric span { display: block; color: #9ca3af; font-size: 11px; margin-bottom: 3px; }
    .metric b { font-size: 14px; }
    .footer-note {
      margin: 14px 0 4px;
      color: #6b7280;
      text-align: center;
      font-size: 11px;
    }
    @media (max-width: 760px) {
      body { padding: 8px; }
      h1 { font-size: 21px; }
      .btn { padding: 8px 9px; min-height: 36px; font-size: 12px; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
      .card { min-height: 63px; padding: 7px 5px; }
      .label { font-size: 11px; }
      .value { font-size: 15px; }
      .strategy-grid { grid-template-columns: 1fr; }
      .section-head { align-items: start; }
      .section-note { max-width: 58%; }
      .holding-card {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }
      .holding-card > div:first-child { grid-column: 1 / -1; }
      .metric { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>🇺🇸 SY Quant US</h1>
      <div class="header-actions">
        <a class="btn secondary" href="/sy-quant.html">SY Quant</a>
        <a class="btn secondary" href="/us-api/strategy-settings">⚙️ 전략 설정</a>
        <button class="btn" type="button" onclick="loadDashboard()">새로고침</button>
      </div>
    </header>

    <div class="status-line">
      <span id="apiStatus" class="status-pill">API 확인 중</span>
      <span class="status-pill">PAPER</span>
      <span class="status-pill">USD</span>
      <span id="masterBuyStatus" class="status-pill">전체 매수 OFF</span>
      <span id="updatedAt">갱신 대기</span>
    </div>

    <section class="grid" aria-label="US 계좌 요약">
      <article class="card"><div class="label">총자산</div><div id="totalAsset" class="value">-</div></article>
      <article class="card"><div class="label">누적손익</div><div id="netProfit" class="value">-</div></article>
      <article class="card"><div class="label">누적수익률</div><div id="profitRate" class="value">-</div></article>
      <article class="card"><div class="label">현재 투자금액</div><div id="totalExposure" class="value">-</div></article>
      <article class="card"><div class="label">보유손익</div><div id="unrealizedProfit" class="value">-</div></article>
      <article class="card"><div class="label">현금</div><div id="totalCash" class="value">-</div></article>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>전략별 수익</h2>
        <div id="strategyNote" class="section-note">전략자료 확인 중</div>
      </div>
      <div id="strategyGrid" class="strategy-grid">
        <div class="empty">전략자료를 불러오는 중입니다.</div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>보유종목</h2>
        <div id="holdingCount" class="section-note">0종목</div>
      </div>
      <div id="holdingList" class="holding-list">
        <div class="empty">현재 보유종목이 없습니다.</div>
      </div>
    </section>

    <div class="footer-note">30초 자동 갱신 · SY Quant US PAPER</div>
  </main>

  <script src="/us-performance.js?v=2"></script>
</body>
</html>
