<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SY Quant US 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.15; white-space: nowrap; }
    .settings-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid #2dd4bf;
      border-radius: 10px;
      background: #0f766e;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }
    .status-line {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      margin: 5px 0 12px;
      color: #94a3b8;
      font-size: 12px;
    }
    .status-ok { color: #86efac; }
    .status-off { color: #fbbf24; }
    .status-on { color: #86efac; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .card {
      min-height: 86px;
      padding: 11px 10px;
      border-radius: 13px;
      background: #111c30;
      border: 1px solid #334155;
    }
    .label {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .value {
      font-size: 23px;
      font-weight: 900;
      text-align: center;
      word-break: keep-all;
    }
    .value.strategy-value { font-size: 18px; }
    .plus { color: #fb7185 !important; }
    .minus { color: #60a5fa !important; }
    .section { margin-top: 14px; }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .section h2 { font-size: 20px; margin: 0; }
    .section-note { color: #94a3b8; font-size: 12px; text-align: right; }
    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .strategy-card {
      padding: 13px 12px;
      border-radius: 14px;
      background: #111c30;
      border: 1px solid #334155;
      border-top-width: 4px;
    }
    .strategy-card.strategy-open { border-top-color: #f59e0b; }
    .strategy-card.strategy-core { border-top-color: #3b82f6; }
    .strategy-card.strategy-volume { border-top-color: #8b5cf6; }
    .strategy-card.strategy-wave { border-top-color: #14b8a6; }
    .strategy-card.strategy-fast { border-top-color: #ef4444; }
    .strategy-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .strategy-name { font-weight: 900; font-size: 17px; }
    .strategy-status {
      color: #cbd5e1;
      background: #1e293b;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      white-space: nowrap;
    }
    .strategy-profit {
      margin: 8px 0 7px;
      font-size: 24px;
      font-weight: 900;
      text-align: right;
    }
    .strategy-sub {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: #94a3b8;
      font-size: 12px;
    }
    .strategy-sub b { color: #e2e8f0; text-align: right; }
    .empty {
      padding: 22px;
      border-radius: 12px;
      background: #111c30;
      border: 1px solid #1e293b;
      color: #94a3b8;
      text-align: center;
    }
    .holding-list { display: grid; gap: 8px; }
    .holding-card {
      display: grid;
      grid-template-columns: minmax(150px, 1.4fr) repeat(5, minmax(90px, .8fr));
      gap: 7px;
      align-items: center;
      padding: 11px;
      border-radius: 13px;
      background: #111c30;
      border: 1px solid #334155;
    }
    .holding-name { font-size: 16px; font-weight: 900; }
    .holding-sub { color: #94a3b8; font-size: 11px; margin-top: 3px; }
    .metric { text-align: right; }
    .metric span { display: block; color: #94a3b8; font-size: 11px; margin-bottom: 3px; }
    .metric b { font-size: 14px; }
    .footer-note {
      margin: 14px 0 4px;
      color: #64748b;
      text-align: center;
      font-size: 11px;
    }
    @media (max-width: 760px) {
      body { padding: 8px; }
      h1 { font-size: 21px; }
      .settings-btn { min-height: 38px; padding: 8px 10px; font-size: 12px; }
      .status-line { margin-bottom: 9px; font-size: 11px; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
      .card { min-height: 72px; padding: 8px 5px; }
      .label { font-size: 10.5px; margin-bottom: 5px; }
      .value { font-size: 15px; }
      .value.strategy-value { font-size: 13px; }
      .strategy-grid { grid-template-columns: 1fr; }
      .section-head { align-items: start; }
      .section-note { max-width: 58%; }
      .holding-card { grid-template-columns: repeat(2, 1fr); gap: 9px; }
      .holding-card > div:first-child { grid-column: 1 / -1; }
      .metric { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>🇺🇸 SY Quant US</h1>
      <a class="settings-btn" href="/us-api/strategy-settings">⚙️ 전략설정</a>
    </header>

    <div class="status-line">
      <span>서버 정상</span><span>·</span>
      <span id="apiStatus">API 확인 중</span><span>·</span>
      <span>PAPER</span><span>·</span>
      <span>USD</span><span>·</span>
      <span id="masterBuyStatus">전체 매수 OFF</span><span>·</span>
      <span id="updatedAt">갱신 대기</span>
    </div>

    <section class="grid" aria-label="US 계좌 요약">
      <article class="card"><div class="label">총자산</div><div id="totalAsset" class="value">-</div></article>
      <article class="card"><div class="label">누적손익</div><div id="netProfit" class="value">-</div></article>
      <article class="card"><div class="label">누적수익률</div><div id="profitRate" class="value">-</div></article>
      <article class="card"><div class="label">현재 투자전략</div><div id="currentStrategy" class="value strategy-value">-</div></article>
      <article class="card"><div class="label">현재 투자금액</div><div id="totalExposure" class="value">-</div></article>
      <article class="card"><div class="label">보유손익</div><div id="unrealizedProfit" class="value">-</div></article>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>전략별 수익</h2>
        <div id="strategyNote" class="section-note">전략자료 확인 중</div>
      </div>
      <div id="strategyGrid" class="strategy-grid">
        <div class="empty">전략자료를 불러오는 중입니다.</div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>보유종목</h2>
        <div id="holdingCount" class="section-note">0종목</div>
      </div>
      <div id="holdingList" class="holding-list">
        <div class="empty">현재 보유종목이 없습니다.</div>
      </div>
    </section>

    <div class="footer-note">30초 자동 갱신 · SY Quant US PAPER</div>
  </main>

  <script src="/us-performance.js?v=3"></script>
</body>
</html>
