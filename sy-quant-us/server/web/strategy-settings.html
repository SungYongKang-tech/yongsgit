<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SY Quant US 전략 운전설정</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 27px; line-height: 1.15; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      color: #fff;
      background: #374151;
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

    .load-message {
      min-height: 38px;
      display: flex;
      align-items: center;
      padding: 9px 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: #166534;
      color: #dcfce7;
      font-size: 12px;
      line-height: 1.45;
    }
    .load-message.bad { background: #7f1d1d; color: #fee2e2; }
    .safety-note {
      padding: 10px 12px;
      margin-bottom: 9px;
      border-radius: 12px;
      border: 1px solid #b45309;
      background: #431407;
      color: #fde68a;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.6;
    }

    .master-card,
    .strategy-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
    }
    .master-card { padding: 13px; margin-bottom: 9px; }
    .master-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 11px;
    }
    .master-title { font-size: 18px; font-weight: 900; }
    .subtext { color: #93b4d6; font-size: 12px; line-height: 1.45; margin-top: 3px; }

    .switch {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 30px;
      flex: 0 0 auto;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #4b5563;
      border: 1px solid #64748b;
      border-radius: 999px;
      transition: .18s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      left: 2px;
      top: 2px;
      background: white;
      border-radius: 50%;
      transition: .18s;
    }
    input:checked + .slider { background: #07883f; border-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(24px); }
    input:disabled + .slider { opacity: .5; cursor: not-allowed; }

    .master-grid,
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .field-box {
      min-width: 0;
      padding: 9px;
      border-radius: 10px;
      background: #111827;
    }
    .field-title {
      display: block;
      color: #93b4d6;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .input-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
    input[type="number"] {
      width: 100%;
      min-width: 0;
      height: 42px;
      border: 1px solid #475569;
      border-radius: 9px;
      background: #0f172a;
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      text-align: right;
      padding: 8px 10px;
      outline: none;
    }
    input[type="number"]:focus { border-color: #60a5fa; }
    .unit { color: #e2e8f0; font-size: 12px; font-weight: 800; white-space: nowrap; }

    .strategy-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .strategy-card {
      min-width: 0;
      padding: 11px;
      border-top: 4px solid var(--accent, #64748b);
    }
    .strategy-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
    }
    .strategy-name { font-size: 17px; font-weight: 900; }
    .strategy-desc { color: #93b4d6; font-size: 11px; margin-top: 4px; }
    .buy-area {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }
    .buy-badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: #7f1d1d;
      color: #fecaca;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }
    .buy-badge.on { background: #166534; color: #bbf7d0; }
    .strategy-foot {
      margin-top: 8px;
      padding: 8px 9px;
      border-radius: 9px;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 11px;
      line-height: 1.45;
    }
    .strategy-foot .good { color: #86efac; font-weight: 900; }
    .strategy-foot .off { color: #fca5a5; font-weight: 900; }

    .bottom-wrap {
      position: sticky;
      bottom: 0;
      z-index: 10;
      margin-top: 8px;
      padding-top: 8px;
      background: linear-gradient(to bottom, rgba(17,24,39,0), #111827 28%);
    }
    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .cancel-btn { background: #475569; }
    .apply-btn { background: #0f766e; }
    .bottom-actions .btn { min-height: 46px; font-size: 14px; }
    .message {
      min-height: 18px;
      margin: 5px 2px 0;
      text-align: center;
      color: #94a3b8;
      font-size: 11px;
    }
    .message.ok { color: #86efac; }
    .message.bad { color: #fca5a5; }

    @media (max-width: 700px) {
      body { padding: 7px; }
      h1 { font-size: 21px; }
      .btn { min-height: 36px; padding: 8px 10px; font-size: 12px; }
      .strategy-list { grid-template-columns: 1fr; }
      .master-title { font-size: 16px; }
      .strategy-name { font-size: 16px; }
      input[type="number"] { font-size: 16px; }
    }
    @media (max-width: 390px) {
      .header { align-items: flex-start; }
      .actions { gap: 4px; }
      .btn { padding: 7px 8px; }
      .field-box { padding: 7px; }
      .unit { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>⚙️ US 전략 운전설정</h1>
      <div class="actions">
        <a class="btn" href="/us-performance.html">대시보드</a>
        <button id="reloadBtn" class="btn" type="button">새로고침</button>
      </div>
    </header>

    <div id="loadMessage" class="load-message">서버의 현재 전략 설정을 불러오는 중입니다.</div>

    <div class="safety-note">
      안전 원칙 · 여기서 끄는 기능은 <b>신규매수만 차단</b>합니다. 이미 보유한 종목의 손절·익절·트레일링 등 자동매도 관리는 계속 작동하도록 서버에서 분리합니다.
    </div>

    <section class="master-card">
      <div class="master-head">
        <div>
          <div class="master-title">MASTER 전체 신규매수</div>
          <div id="masterSub" class="subtext">OFF로 바꾸면 OPEN·CORE·VOLUME·WAVE·FAST의 신규매수를 모두 차단합니다.</div>
        </div>
        <label class="switch" aria-label="MASTER 전체 신규매수">
          <input id="masterBuyEnabled" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="master-grid">
        <label class="field-box">
          <span class="field-title">MASTER 최대 투자비율</span>
          <span class="input-wrap">
            <input id="masterMaxInvestmentRate" type="number" min="0" max="100" step="1" />
            <span class="unit">%</span>
          </span>
        </label>
        <label class="field-box">
          <span class="field-title">남겨둘 최소 현금</span>
          <span class="input-wrap">
            <input id="minimumCashRate" type="number" min="0" max="100" step="1" />
            <span class="unit">%</span>
          </span>
        </label>
      </div>
    </section>

    <section id="strategyList" class="strategy-list"></section>

    <div class="bottom-wrap">
      <div class="bottom-actions">
        <button id="cancelBtn" class="btn cancel-btn" type="button" disabled>변경 취소</button>
        <button id="saveBtn" class="btn apply-btn" type="button" disabled>설정 적용</button>
      </div>
      <div id="message" class="message">설정을 불러오는 중입니다.</div>
    </div>
  </main>

  <script>
    'use strict';

    const API = '/us-api/api/strategy-settings';
    const ORDER = ['OPEN', 'CORE', 'VOLUME', 'WAVE', 'FAST'];
    const META = {
      OPEN: { desc: '장초 단기 급등 포착', accent: '#f59e0b' },
      CORE: { desc: '강한 주도주 추세', accent: '#3b82f6' },
      VOLUME: { desc: '거래량 급증 종목', accent: '#8b5cf6' },
      WAVE: { desc: '눌림 후 반등', accent: '#14b8a6' },
      FAST: { desc: '초기 급등 빠른 진입', accent: '#ef4444' }
    };

    let current = null;
    let loading = false;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function num(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function percent(value) {
      const n = num(value, 0);
      return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    function setLoadMessage(text, bad = false) {
      const el = document.getElementById('loadMessage');
      el.textContent = text;
      el.className = bad ? 'load-message bad' : 'load-message';
    }

    function setMessage(text, type = '') {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = `message ${type}`.trim();
    }

    function theoreticalExposure(s, data) {
      const byCount = num(s.singleBuyRate) * num(s.maxHoldings);
      const strategyCap = num(s.strategyMaxInvestmentRate, 100);
      const masterCap = Math.max(0, Math.min(
        num(data.masterMaxInvestmentRate, 100),
        100 - num(data.minimumCashRate, 0)
      ));
      return Math.max(0, Math.min(byCount, strategyCap, masterCap));
    }

    function render(data) {
      current = JSON.parse(JSON.stringify(data));

      const anyImplemented = ORDER.some(id => Boolean(data.strategies?.[id]?.implemented));
      const master = document.getElementById('masterBuyEnabled');
      master.checked = Boolean(data.masterBuyEnabled) && anyImplemented;
      master.disabled = !anyImplemented;
      document.getElementById('masterSub').textContent = anyImplemented
        ? 'OFF로 바꾸면 OPEN·CORE·VOLUME·WAVE·FAST의 신규매수를 모두 차단합니다.'
        : '현재 구현된 US 전략이 없어 MASTER 신규매수도 OFF로 잠겨 있습니다.';

      document.getElementById('masterMaxInvestmentRate').value = percent(data.masterMaxInvestmentRate ?? 100);
      document.getElementById('minimumCashRate').value = percent(data.minimumCashRate ?? 0);

      const list = document.getElementById('strategyList');
      list.innerHTML = ORDER.map(id => {
        const s = data.strategies[id];
        const meta = META[id];
        const buyOn = Boolean(s.buyEnabled) && Boolean(s.implemented);
        const exposure = theoreticalExposure(s, data);
        return `
          <article class="strategy-card" data-id="${id}" style="--accent:${meta.accent}">
            <div class="strategy-head">
              <div>
                <div class="strategy-name">${escapeHtml(s.icon)} ${id}</div>
                <div class="strategy-desc">${escapeHtml(meta.desc)}</div>
              </div>
              <div class="buy-area">
                <span class="buy-badge ${buyOn ? 'on' : ''}">${buyOn ? '매수 허용' : '매수 OFF'}</span>
                <label class="switch" aria-label="${id} 신규매수 허용">
                  <input class="buy-enabled" type="checkbox" ${buyOn ? 'checked' : ''} ${s.implemented ? '' : 'disabled'} />
                  <span class="slider"></span>
                </label>
              </div>
            </div>

            <div class="field-grid">
              <label class="field-box">
                <span class="field-title">1종목 매수비율</span>
                <span class="input-wrap">
                  <input class="single-buy-rate" type="number" min="0" max="100" step="0.1" value="${percent(s.singleBuyRate)}" />
                  <span class="unit">%</span>
                </span>
              </label>
              <label class="field-box">
                <span class="field-title">전략 최대 투자비율</span>
                <span class="input-wrap">
                  <input class="strategy-max-rate" type="number" min="0" max="100" step="0.1" value="${percent(s.strategyMaxInvestmentRate ?? s.allocationRate)}" />
                  <span class="unit">%</span>
                </span>
              </label>
              <label class="field-box">
                <span class="field-title">최대 보유종목</span>
                <span class="input-wrap">
                  <input class="max-holdings" type="number" min="1" max="20" step="1" value="${Math.max(1, Math.trunc(num(s.maxHoldings, 1)))}" />
                  <span class="unit">종목</span>
                </span>
              </label>
              <label class="field-box">
                <span class="field-title">하루 최대 신규매수</span>
                <span class="input-wrap">
                  <input class="daily-max-buys" type="number" min="1" max="20" step="1" value="${Math.max(1, Math.trunc(num(s.dailyMaxNewBuys, s.maxHoldings || 1)))}" />
                  <span class="unit">회</span>
                </span>
              </label>
            </div>

            <div class="strategy-foot">
              신규매수 <span class="${buyOn ? 'good' : 'off'}">${buyOn ? '허용' : 'OFF'}</span>
              · 1종목 ${percent(s.singleBuyRate)}%
              · 이론상 최대 보유노출 약 ${percent(exposure)}%
              ${s.implemented ? '' : ' · 전략 준비중'}
            </div>
          </article>`;
      }).join('');

      bindFormEvents();
      setDirty(false);
      setLoadMessage('서버의 현재 전략 설정을 불러왔습니다.');
      setMessage(
        data.updatedAt ? '저장된 설정을 표시하고 있습니다.' : '기본 설정을 표시하고 있습니다.',
        'ok'
      );
    }

    function bindFormEvents() {
      document.querySelectorAll('input').forEach(el => {
        el.addEventListener('input', onFormChange);
        el.addEventListener('change', onFormChange);
      });
    }

    function onFormChange() {
      if (loading) return;
      setDirty(true);
      refreshFooters();
      setMessage('변경사항이 있습니다. 확인 후 설정 적용을 누르세요.');
    }

    function setDirty(dirty) {
      document.getElementById('cancelBtn').disabled = !dirty || loading;
      document.getElementById('saveBtn').disabled = !dirty || loading;
    }

    function collect() {
      const strategies = {};
      document.querySelectorAll('.strategy-card').forEach(card => {
        const id = card.dataset.id;
        strategies[id] = {
          singleBuyRate: num(card.querySelector('.single-buy-rate').value),
          strategyMaxInvestmentRate: num(card.querySelector('.strategy-max-rate').value),
          maxHoldings: Math.trunc(num(card.querySelector('.max-holdings').value, 1)),
          dailyMaxNewBuys: Math.trunc(num(card.querySelector('.daily-max-buys').value, 1)),
          buyEnabled: Boolean(card.querySelector('.buy-enabled').checked)
        };
      });

      return {
        masterBuyEnabled: Boolean(document.getElementById('masterBuyEnabled').checked),
        masterMaxInvestmentRate: num(document.getElementById('masterMaxInvestmentRate').value, 100),
        minimumCashRate: num(document.getElementById('minimumCashRate').value, 0),
        strategies
      };
    }

    function validate(form) {
      if (form.masterMaxInvestmentRate < 0 || form.masterMaxInvestmentRate > 100) {
        return 'MASTER 최대 투자비율은 0~100%로 입력하세요.';
      }
      if (form.minimumCashRate < 0 || form.minimumCashRate > 100) {
        return '남겨둘 최소 현금은 0~100%로 입력하세요.';
      }
      if (form.masterMaxInvestmentRate + form.minimumCashRate > 100.0001) {
        return 'MASTER 최대 투자비율 + 최소 현금은 100%를 넘을 수 없습니다.';
      }

      for (const id of ORDER) {
        const s = form.strategies[id];
        if (s.singleBuyRate < 0 || s.singleBuyRate > 100) return `${id} 1종목 매수비율을 확인하세요.`;
        if (s.strategyMaxInvestmentRate < 0 || s.strategyMaxInvestmentRate > 100) return `${id} 전략 최대 투자비율을 확인하세요.`;
        if (s.singleBuyRate > s.strategyMaxInvestmentRate && s.strategyMaxInvestmentRate > 0) {
          return `${id} 1종목 매수비율이 전략 최대 투자비율보다 큽니다.`;
        }
        if (s.maxHoldings < 1 || s.maxHoldings > 20) return `${id} 최대 보유종목은 1~20종목입니다.`;
        if (s.dailyMaxNewBuys < 1 || s.dailyMaxNewBuys > 20) return `${id} 하루 최대 신규매수는 1~20회입니다.`;
      }
      return '';
    }

    function refreshFooters() {
      const form = collect();
      document.querySelectorAll('.strategy-card').forEach(card => {
        const id = card.dataset.id;
        const s = form.strategies[id];
        const serverStrategy = current?.strategies?.[id] || {};
        const buyOn = Boolean(s.buyEnabled) && Boolean(serverStrategy.implemented);
        const exposure = theoreticalExposure(s, form);
        const foot = card.querySelector('.strategy-foot');
        foot.innerHTML = `신규매수 <span class="${buyOn ? 'good' : 'off'}">${buyOn ? '허용' : 'OFF'}</span> · 1종목 ${percent(s.singleBuyRate)}% · 이론상 최대 보유노출 약 ${percent(exposure)}%${serverStrategy.implemented ? '' : ' · 전략 준비중'}`;

        const badge = card.querySelector('.buy-badge');
        badge.textContent = buyOn ? '매수 허용' : '매수 OFF';
        badge.className = `buy-badge ${buyOn ? 'on' : ''}`.trim();
      });
    }

    async function loadSettings() {
      if (loading) return;
      loading = true;
      setDirty(false);
      setLoadMessage('서버의 현재 전략 설정을 불러오는 중입니다.');
      setMessage('불러오는 중입니다.');

      try {
        const response = await fetch(`${API}?t=${Date.now()}`, { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok || payload.ok === false || !payload.settings) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        loading = false;
        render(payload.settings);
      } catch (err) {
        loading = false;
        setLoadMessage(`설정을 불러오지 못했습니다: ${err.message}`, true);
        setMessage('API 연결을 확인하세요.', 'bad');
      }
    }

    async function saveSettings() {
      if (loading || !current) return;
      const form = collect();
      const error = validate(form);
      if (error) {
        setMessage(error, 'bad');
        return;
      }

      loading = true;
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('cancelBtn').disabled = true;
      setMessage('서버에 설정을 적용하는 중입니다.');

      try {
        const response = await fetch(API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(form)
        });
        const payload = await response.json();
        if (!response.ok || payload.ok === false || !payload.settings) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        loading = false;
        render(payload.settings);
        setLoadMessage('서버에 전략 운전 설정을 적용했습니다.');
        setMessage('설정 적용 완료 · 미구현 전략의 신규매수는 계속 서버에서 강제 OFF입니다.', 'ok');
      } catch (err) {
        loading = false;
        setDirty(true);
        setMessage(`설정 적용 실패: ${err.message}`, 'bad');
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', loadSettings);
    document.getElementById('cancelBtn').addEventListener('click', () => {
      if (!current || loading) return;
      render(current);
      setMessage('변경사항을 취소했습니다.');
    });
    document.getElementById('saveBtn').addEventListener('click', saveSettings);

    loadSettings();
  </script>
</body>
</html>
