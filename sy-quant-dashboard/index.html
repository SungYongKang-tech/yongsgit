<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SY Quant" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/sy-quant-icon-192.png" />
  <link rel="icon" href="/sy-quant-icon.svg" type="image/svg+xml" />
  <title>SY Quant</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #0b1220; }
    body {
      margin: 0;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #f9fafb;
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .title-wrap h1 { margin: 0; font-size: 30px; line-height: 1.15; }
    .subtitle { margin-top: 4px; color: #94a3b8; font-size: 12px; }
    .refresh-btn {
      border: 0;
      border-radius: 10px;
      min-height: 40px;
      padding: 9px 14px;
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .notice {
      margin-bottom: 12px;
      padding: 9px 11px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 11px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }
    .market-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: start;
    }
    .market-panel {
      background: #111827;
      border: 1px solid #273449;
      border-radius: 16px;
      padding: 11px;
      box-shadow: 0 6px 18px rgba(0,0,0,.2);
    }
    .market-panel.kr { border-top: 3px solid #f87171; }
    .market-panel.us { border-top: 3px solid #60a5fa; }
    .market-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }
    .market-title { font-size: 21px; font-weight: 900; }
    .market-actions { display: flex; gap: 5px; align-items: center; }
    .status {
      padding: 4px 7px;
      border-radius: 999px;
      background: #1f2937;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .status.ok { color: #86efac; }
    .status.bad { color: #fca5a5; }
    .dashboard-link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 34px;
      padding: 7px 10px;
      border-radius: 9px;
      background: #374151;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .overall-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 11px;
    }
    .overall-card {
      min-height: 70px;
      padding: 8px 6px;
      background: #1f2937;
      border-radius: 11px;
    }
    .overall-label {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 5px;
    }
    .overall-value {
      font-size: 17px;
      font-weight: 900;
      text-align: right;
      word-break: keep-all;
    }
    .plus { color: #f87171 !important; }
    .minus { color: #60a5fa !important; }
    .strategy-title-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 8px;
      margin: 4px 1px 7px;
    }
    .strategy-title { font-size: 15px; font-weight: 900; }
    .updated-at { color: #64748b; font-size: 10px; text-align: right; }
    .strategy-list { display: grid; gap: 6px; }
    .strategy-row {
      display: grid;
      grid-template-columns: minmax(80px, 1.1fr) minmax(100px, 1fr) 78px;
      gap: 7px;
      align-items: center;
      padding: 9px;
      border-radius: 10px;
      background: #1f2937;
    }
    .strategy-name { font-size: 13px; font-weight: 900; }
    .strategy-profit { text-align: right; font-size: 14px; font-weight: 900; }
    .strategy-rate { text-align: right; font-size: 12px; font-weight: 800; }
    .empty {
      padding: 17px 10px;
      border-radius: 10px;
      background: #1f2937;
      color: #94a3b8;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }
    .footer {
      margin: 12px 0 2px;
      color: #64748b;
      text-align: center;
      font-size: 11px;
    }
    @media (max-width: 820px) {
      body { padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
      .title-wrap h1 { font-size: 24px; }
      .market-grid { grid-template-columns: 1fr; }
      .market-title { font-size: 19px; }
      .overall-value { font-size: 15px; }
    }
    @media (max-width: 430px) {
      .header { align-items: flex-start; }
      .refresh-btn { min-height: 36px; padding: 7px 9px; font-size: 12px; }
      .overall-card { min-height: 62px; padding: 7px 4px; }
      .overall-label { font-size: 10px; }
      .overall-value { font-size: 14px; }
      .strategy-row { grid-template-columns: minmax(72px, 1fr) minmax(92px, 1fr) 68px; padding: 8px 6px; gap: 4px; }
      .strategy-name { font-size: 12px; }
      .strategy-profit { font-size: 12px; }
      .strategy-rate { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="title-wrap">
        <h1>SY Quant</h1>
        <div class="subtitle">KR + US 통합 성과 대시보드</div>
      </div>
      <button class="refresh-btn" type="button" onclick="loadAll()">새로고침</button>
    </header>

    <div class="notice">한국은 KRW, 미국은 USD 기준으로 각각 표시합니다. 환율을 임의 적용해 두 시장의 금액을 하나로 합산하지 않습니다.</div>

    <section class="market-grid">
      <article class="market-panel kr">
        <div class="market-head">
          <div class="market-title">🇰🇷 SY Quant KR</div>
          <div class="market-actions">
            <span id="krStatus" class="status">조회 중</span>
            <a class="dashboard-link" href="/performance.html">한국 대시보드</a>
          </div>
        </div>
        <div class="overall-grid">
          <div class="overall-card"><div class="overall-label">총자산</div><div id="krAsset" class="overall-value">-</div></div>
          <div class="overall-card"><div class="overall-label">전체수익</div><div id="krProfit" class="overall-value">-</div></div>
          <div class="overall-card"><div class="overall-label">전체수익률</div><div id="krRate" class="overall-value">-</div></div>
        </div>
        <div class="strategy-title-row"><div class="strategy-title">전략별 수익</div><div id="krUpdated" class="updated-at">-</div></div>
        <div id="krStrategies" class="strategy-list"><div class="empty">한국 전략성과를 불러오는 중입니다.</div></div>
      </article>

      <article class="market-panel us">
        <div class="market-head">
          <div class="market-title">🇺🇸 SY Quant US</div>
          <div class="market-actions">
            <span id="usStatus" class="status">조회 중</span>
            <a class="dashboard-link" href="/us-performance.html">미국 대시보드</a>
          </div>
        </div>
        <div class="overall-grid">
          <div class="overall-card"><div class="overall-label">총자산</div><div id="usAsset" class="overall-value">-</div></div>
          <div class="overall-card"><div class="overall-label">전체수익</div><div id="usProfit" class="overall-value">-</div></div>
          <div class="overall-card"><div class="overall-label">전체수익률</div><div id="usRate" class="overall-value">-</div></div>
        </div>
        <div class="strategy-title-row"><div class="strategy-title">전략별 수익</div><div id="usUpdated" class="updated-at">-</div></div>
        <div id="usStrategies" class="strategy-list"><div class="empty">미국 전략성과를 불러오는 중입니다.</div></div>
      </article>
    </section>

    <div class="footer">30초 자동 갱신 · 각 시장 대시보드는 위 버튼으로 이동</div>
  </main>

  <script src="/sy-quant.js?v=1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(error => {
          console.error('SY Quant service worker registration failed', error);
        });
      });
    }
  </script>
</body>
</html>
