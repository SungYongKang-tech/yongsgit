<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>🏓 친선경기 리포트</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{--ink:#0f172a;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--accent:#2563eb;--accent2:#1e40af;--ok:#16a34a;--danger:#ef4444;--shadow:0 8px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Pretendard","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#eff6ff 0%,var(--bg) 240px);color:var(--ink);font-weight:650}
header{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;text-align:center;padding:12px 8px 10px}
h1{margin:2px 0 9px;color:var(--accent);font-size:clamp(19px,4.8vw,25px);font-weight:950;letter-spacing:-.4px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}.btn{border:1px solid #cbd5e1;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;background:#fff;font-weight:850;text-decoration:none;color:#111827;box-shadow:0 2px 8px rgba(15,23,42,.05)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:12px 10px 60px}
.eventHero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:18px;padding:17px 16px;margin:4px 0 12px;box-shadow:0 10px 25px rgba(37,99,235,.22)}.eventHero h2{margin:0;font-size:clamp(19px,5vw,25px);font-weight:950;line-height:1.3}.eventHero p{margin:7px 0 0;font-size:13px;font-weight:800;opacity:.9}.status{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;margin-left:4px;font-size:11px;font-weight:950;background:rgba(255,255,255,.2)}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:4px 0 12px}.statCard{background:rgba(255,255,255,.97);border:1px solid rgba(226,232,240,.9);border-radius:16px;padding:12px 8px;text-align:center;font-weight:900;font-size:16px;box-shadow:0 6px 18px rgba(15,23,42,.06);min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:3px}.statCard span{display:block;color:var(--muted);font-size:12px;font-weight:900}.statCard strong{color:var(--accent2);font-weight:950}
.teamGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.teamCard{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:13px;box-shadow:var(--shadow)}.teamCardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.teamName{font-size:17px;font-weight:950;color:#1e3a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamRate{text-align:right;color:#2563eb;font-size:20px;font-weight:950;white-space:nowrap}.teamRate small{display:block;color:var(--muted);font-size:10px;font-weight:800}.teamRecord{margin-top:9px;padding-top:9px;border-top:1px dashed #dbeafe;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px}.teamMetric{background:#f8fafc;border-radius:9px;padding:7px;text-align:center;color:#475569;font-weight:800}.teamMetric strong{display:block;color:#0f172a;font-size:14px;font-weight:950;margin-top:2px}.teamNote{margin:8px 2px 0;color:var(--muted);font-size:11.5px;font-weight:750;line-height:1.5}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 14px}.podiumCard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 6px;text-align:center;min-height:86px;display:flex;flex-direction:column;justify-content:center;gap:4px}.podiumCard .medal{font-size:22px;line-height:1}.podiumCard .name{font-size:15px;font-weight:950;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.podiumCard .score{font-size:12px;color:var(--muted);font-weight:800}.podiumCard.first{border-color:#fde68a;background:linear-gradient(180deg,#fffbeb,#fff)}.podiumCard.second{border-color:#cbd5e1;background:linear-gradient(180deg,#f8fafc,#fff)}.podiumCard.third{border-color:#fed7aa;background:linear-gradient(180deg,#fff7ed,#fff)}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px;color:#1e3a8a;font-size:17px;font-weight:950;padding:0 2px}.sectionTitle small{color:var(--muted);font-size:12px;font-weight:800}
.tableWrap{background:var(--card);box-shadow:var(--shadow);border-radius:16px;overflow:hidden;border:1px solid rgba(226,232,240,.8)}table{width:100%;border-collapse:collapse;font-size:14px}thead th{background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:10px 3px;text-align:center;color:#334155;font-weight:950;white-space:nowrap;font-size:13px}tbody td{border-bottom:1px solid #f1f5f9;padding:10px 3px;text-align:center;font-weight:850}tbody tr:last-child td{border-bottom:none}tbody tr:nth-child(even){background:#fbfdff}.rankCell{width:42px;font-weight:950;color:#334155}.nameCell{text-align:left;padding-left:8px;max-width:130px}.nameText{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}.teamText{display:block;font-size:10px;color:var(--muted);font-weight:750;margin-top:2px}.rateCell{color:#1e40af;font-weight:950}.win{color:#dc2626;font-weight:950}.lose{color:#2563eb;font-weight:950}.rank1{background:#e0f2fe!important}.rank2{background:#f8fafc!important}.rank3{background:#fff7ed!important}.rankBadge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:13px}.rank1 .rankBadge{background:#fef3c7;color:#92400e}.rank2 .rankBadge{background:#e2e8f0;color:#334155}.rank3 .rankBadge{background:#fed7aa;color:#9a3412}.officialRank{background:#dbeafe}
.matchList{display:grid;gap:8px}.matchItem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:0 4px 14px rgba(15,23,42,.05)}.matchTop{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:5px}.modeBadge{border-radius:999px;padding:3px 7px;background:#e0f2fe;color:#075985;font-size:11px;font-weight:950}.matchText{font-size:15px;font-weight:850;line-height:1.5}.matchWinner{color:#dc2626;font-weight:950}.empty{text-align:center;color:var(--muted);padding:24px 16px;background:#fff;border-radius:16px;box-shadow:var(--shadow);font-weight:800;line-height:1.6}
@media(max-width:420px){main{padding-left:8px;padding-right:8px}.summary{gap:7px}.statCard{font-size:14px;padding:10px 5px;min-height:60px}.statCard span{font-size:11.5px}.teamGrid{grid-template-columns:1fr}.podium{gap:6px}.podiumCard{padding:9px 4px;min-height:82px}.podiumCard .name{font-size:13px}.podiumCard .score{font-size:11px}table{font-size:13px}thead th,tbody td{padding:9px 1px}.btn{font-size:13px;padding:6px 11px}.nameCell{padding-left:4px;max-width:104px}.rankCell{width:36px}.rankBadge{min-width:25px;height:25px;font-size:12px}}
</style>
</head>
<body>
<header>
  <h1>🏓 친선경기 리포트</h1>
  <div class="row">
    <a href="index.html" class="btn primary">경기입력</a>
    <a href="index.html?view=history" class="btn">역대 친선경기</a>
  </div>
</header>
<main>
  <section id="eventHero" class="eventHero"><h2 id="eventTitle">친선경기</h2><p id="eventMeta">자료를 불러오는 중입니다.</p></section>
  <div id="summary" class="summary"></div>
  <div class="sectionTitle"><span>🏢 팀별 종합성적</span><small id="teamCount">0팀</small></div>
  <div id="teamGrid" class="teamGrid"></div>
  <p id="teamNote" class="teamNote"></p>
  <div id="podium" class="podium"></div>
  <div class="sectionTitle"><span>🏆 개인별 순위</span><small id="rankCount">0명</small></div>
  <div id="rankingWrap"></div>
  <div class="sectionTitle"><span>📝 경기 결과</span><small id="matchCount">0경기</small></div>
  <div id="matchList" class="matchList"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyC0prJtmZ25JTLsG9R9JRCapCtOqH2PGaA",authDomain:"pingpongfriend-19295.firebaseapp.com",
  databaseURL:"https://pingpongfriend-19295-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pingpongfriend-19295",
  storageBucket:"pingpongfriend-19295.firebasestorage.app",messagingSenderId:"201223495919",appId:"1:201223495919:web:b8f20c2cfec45043d8fb1a"
};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let players={},matches={},meta={};
const $=id=>document.getElementById(id);
const escapeHtml=str=>String(str??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const pad2=n=>String(n).padStart(2,"0");
const getKSTDate=(date=new Date())=>new Date(date.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
const formatRate=n=>`${(Math.round(n*10)/10).toFixed(1)}%`;
const formatCredit=n=>{const value=Math.round((Number(n)||0)*10)/10;return Number.isInteger(value)?String(value):value.toFixed(1)};

function getNames(m){
  const winners=Array.isArray(m?.winnerNames)?m.winnerNames:(m?.winnerSide==="A"?(m?.namesA||[]):(m?.namesB||[]));
  const losers=Array.isArray(m?.loserNames)?m.loserNames:(m?.winnerSide==="A"?(m?.namesB||[]):(m?.namesA||[]));
  return {winners,losers};
}
function memberMap(){
  const map={}; Object.values(players||{}).forEach(p=>{if(p?.name) map[p.name]={bu:Number(p.bu??99),team:p.team||""}}); return map;
}
function buildTeamStats(){
  const stats={}; const order=[]; const memberInfo=memberMap(); let includedMatches=0; let excludedMatches=0;
  const ensureTeam=team=>{
    const name=String(team||"").trim(); if(!name) return null;
    if(!stats[name]){stats[name]={name,win:0,lose:0,singleWin:0,doubleWin:0,players:new Set()};order.push(name)}
    return stats[name];
  };
  (Array.isArray(meta.teams)?meta.teams:[]).forEach(ensureTeam);
  Object.values(matches||{}).forEach(m=>{
    const {winners,losers}=getNames(m);
    const winnerTeams=winners.map((name,index)=>String(m?.winnerTeams?.[index]||m?.teamByName?.[name]||memberInfo[name]?.team||"").trim());
    const loserTeams=losers.map((name,index)=>String(m?.loserTeams?.[index]||m?.teamByName?.[name]||memberInfo[name]?.team||"").trim());
    if(!winners.length||!losers.length||winnerTeams.some(team=>!team)||loserTeams.some(team=>!team)){excludedMatches++;return}
    const uniqueWinners=[...new Set(winnerTeams)]; const uniqueLosers=[...new Set(loserTeams)];
    if(!uniqueWinners.length||!uniqueLosers.length){excludedMatches++;return}
    includedMatches++;
    winners.forEach((name,index)=>ensureTeam(winnerTeams[index])?.players.add(name));
    losers.forEach((name,index)=>ensureTeam(loserTeams[index])?.players.add(name));
    const winShare=1/uniqueWinners.length; const loseShare=1/uniqueLosers.length; const isDouble=(m.mode||m.type)==="double";
    uniqueWinners.forEach(team=>{const row=ensureTeam(team);row.win+=winShare;if(isDouble)row.doubleWin+=winShare;else row.singleWin+=winShare});
    uniqueLosers.forEach(team=>{ensureTeam(team).lose+=loseShare});
  });
  const rows=order.map((name,index)=>{const row=stats[name];const total=row.win+row.lose;return {...row,players:row.players.size,rate:total?row.win/total*100:0,order:index}})
    .sort((a,b)=>b.rate-a.rate||b.win-a.win||a.order-b.order);
  return {rows,includedMatches,excludedMatches};
}
function buildStats(){
  const stats={};
  Object.values(players||{}).forEach(p=>{if(p?.name&&p.active!==false) stats[p.name]={name:p.name,bu:Number(p.bu??99),team:p.team||"",total:0,win:0,lose:0}});
  Object.values(matches||{}).forEach(m=>{
    const {winners,losers}=getNames(m);
    [...winners,...losers].forEach(name=>{if(!stats[name]) stats[name]={name,bu:99,team:m?.teamByName?.[name]||"",total:0,win:0,lose:0}});
    winners.forEach(name=>{stats[name].total++;stats[name].win++}); losers.forEach(name=>{stats[name].total++;stats[name].lose++});
  });
  return Object.values(stats).map(p=>({...p,rate:p.total?p.win/p.total*100:0})).filter(p=>p.total>0)
    .sort((a,b)=>b.rate-a.rate||b.win-a.win||b.total-a.total||a.bu-b.bu||a.name.localeCompare(b.name,"ko"));
}
function renderEventHero(){
  const title=meta.displayTitle||"탁구 친선경기"; const teams=Array.isArray(meta.teams)?meta.teams.filter(Boolean):[];
  if(meta.empty===true){document.title="🏓 저장된 친선경기 없음";$("eventTitle").textContent=title;$("eventMeta").textContent="역대 친선경기에서 새 경기를 만들어 주세요.";return}
  const done=meta.status==="finalized"||meta.locked===true; document.title=`🏓 ${title}`; $("eventTitle").textContent=title;
  $("eventMeta").innerHTML=`${teams.length?`참가팀 ${teams.map(escapeHtml).join(" · ")} · `:""}${Object.keys(matches||{}).length}경기 <span class="status">${done?"🔒 최종 저장":"입력 중"}</span>`;
}
function renderSummary(arr,official){
  const totalMatches=Object.keys(matches||{}).length; const top=official[0];
  const topWin=arr.slice().sort((a,b)=>b.win-a.win||b.rate-a.rate||a.bu-b.bu)[0];
  const mostPlayed=arr.slice().sort((a,b)=>b.total-a.total||b.win-a.win||a.bu-b.bu)[0];
  const mostLose=arr.slice().sort((a,b)=>b.lose-a.lose||b.total-a.total||a.bu-b.bu)[0];
  $("summary").innerHTML=`<div class="statCard"><span>총 경기</span><strong>${totalMatches}</strong>경기</div>
    <div class="statCard"><span>참여 선수</span><strong>${arr.length}</strong>명</div>
    <div class="statCard"><span>개인 순위 1위</span>${top?`<strong>${escapeHtml(top.name)}</strong> ${formatRate(top.rate)}`:"<strong>-</strong> 3경기 이상 없음"}</div>
    <div class="statCard"><span>다승 1위</span>${topWin?`<strong>${escapeHtml(topWin.name)}</strong> ${topWin.win}승`:"-"}</div>
    <div class="statCard"><span>최다 경기</span>${mostPlayed?`<strong>${escapeHtml(mostPlayed.name)}</strong> ${mostPlayed.total}경기`:"-"}</div>
    <div class="statCard"><span>최다 패</span>${mostLose?`<strong>${escapeHtml(mostLose.name)}</strong> ${mostLose.lose}패`:"-"}</div>`;
}
function renderTeamStats(){
  const {rows,includedMatches,excludedMatches}=buildTeamStats(); $("teamCount").textContent=`${rows.length}팀`;
  if(!rows.length){$("teamGrid").innerHTML='<div class="empty" style="grid-column:1/-1">등록된 팀 정보가 없습니다.</div>';$("teamNote").textContent="";return}
  $("teamGrid").innerHTML=rows.map(team=>`<div class="teamCard">
    <div class="teamCardTop"><div class="teamName">${escapeHtml(team.name)}</div><div class="teamRate">${formatRate(team.rate)}<small>팀 승률</small></div></div>
    <div class="teamRecord">
      <div class="teamMetric">승 / 패<strong><span class="win">${formatCredit(team.win)}</span> / <span class="lose">${formatCredit(team.lose)}</span></strong></div>
      <div class="teamMetric">참가 선수<strong>${team.players}명</strong></div>
      <div class="teamMetric">단식 승수<strong>${formatCredit(team.singleWin)}승</strong></div>
      <div class="teamMetric">복식 승수<strong>${formatCredit(team.doubleWin)}승</strong></div>
    </div></div>`).join("");
  const base="혼합 복식은 한 경기의 1승·1패를 해당 편의 참가팀 수로 나눠 반영합니다.";
  $("teamNote").textContent=excludedMatches?`${base} 소속팀 정보가 없는 ${excludedMatches}경기는 팀 통계에서만 제외했으며 개인별 성적과 경기 결과는 그대로 유지됩니다.`:`${base} 팀 통계 반영 ${includedMatches}경기.`;
}
function renderPodium(arr){
  const top3=arr.slice(0,3); if(!top3.length){$("podium").innerHTML="";return}
  const medals=["🥇","🥈","🥉"],classes=["first","second","third"];
  $("podium").innerHTML=top3.map((p,i)=>`<div class="podiumCard ${classes[i]}"><div class="medal">${medals[i]}</div><div class="name">${escapeHtml(p.name)}</div><div class="score">${p.win}승 ${p.lose}패 · ${formatRate(p.rate)}</div></div>`).join("");
}
function renderRanking(official,waiting){
  $("rankCount").textContent=`${official.length}명`; if(!official.length&&!waiting.length){$("rankingWrap").innerHTML='<div class="empty">아직 입력된 경기 결과가 없습니다.</div>';return}
  const rows=official.map((p,i)=>{const rankClass=i===0?"rank1":i===1?"rank2":i===2?"rank3":"";const badge=i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1);
    return `<tr class="officialRank ${rankClass}"><td class="rankCell"><span class="rankBadge">${badge}</span></td><td class="nameCell"><span class="nameText">${escapeHtml(p.name)}(${p.bu})</span>${p.team?`<span class="teamText">${escapeHtml(p.team)}</span>`:""}</td><td>${p.total}</td><td><span class="win">${p.win}</span>/<span class="lose">${p.lose}</span></td><td class="rateCell">${formatRate(p.rate)}</td></tr>`}).join("");
  const waitingRows=waiting.map(p=>`<tr><td>-</td><td class="nameCell"><span class="nameText">${escapeHtml(p.name)}(${p.bu})</span>${p.team?`<span class="teamText">${escapeHtml(p.team)}</span>`:""}</td><td>${p.total}</td><td><span class="win">${p.win}</span>/<span class="lose">${p.lose}</span></td><td class="rateCell">${formatRate(p.rate)}</td></tr>`).join("");
  $("rankingWrap").innerHTML=`<div class="tableWrap"><table><thead><tr><th>순위</th><th>이름</th><th>경기</th><th>승/패</th><th>승률</th></tr></thead><tbody>${rows}${waiting.length?`<tr><td colspan="5" style="background:#bfdbfe;color:#1e3a8a;font-weight:900;text-align:center">순위 제외 (3경기 미만)</td></tr>${waitingRows}`:""}</tbody></table></div>`;
}
function renderMatches(){
  const arr=Object.entries(matches||{}).map(([id,m])=>({id,...m})).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)); $("matchCount").textContent=`${arr.length}경기`;
  if(!arr.length){$("matchList").innerHTML='<div class="empty">저장된 경기 결과가 없습니다.</div>';return}
  $("matchList").innerHTML=arr.map(m=>{const {winners,losers}=getNames(m);const kst=getKSTDate(new Date(Number(m.createdAt||Date.now())));const time=`${kst.getFullYear()}.${kst.getMonth()+1}.${kst.getDate()} ${pad2(kst.getHours())}:${pad2(kst.getMinutes())}`;
    return `<div class="matchItem"><div class="matchTop"><span>${time}</span><span class="modeBadge">${(m.mode||m.type)==="double"?"복식":"단식"}</span></div><div class="matchText"><span class="matchWinner">${winners.map(escapeHtml).join(" / ")} 승</span> vs ${losers.map(escapeHtml).join(" / ")}</div></div>`}).join("");
}
function render(){
  renderEventHero(); const arr=buildStats(); const official=arr.filter(p=>p.total>=3); const waiting=arr.filter(p=>p.total<3);
  renderSummary(arr,official); renderTeamStats(); renderPodium(official); renderRanking(official,waiting); renderMatches();
}
function subscribeFriendly(eventId){
  onValue(ref(db,`friendlies/${eventId}`),snap=>{const event=snap.val()||{};meta=event.meta||{};players=event.members||{};matches=event.matches||{};render()});
}
function subscribeLegacy(){
  meta={date:"2026-07-06",teams:["남동","저작권위원회"],displayTitle:"26.7.6 남동 vs 저작권위원회",status:"finalized",locked:true};
  onValue(ref(db,"members"),snap=>{players=snap.val()||{};render()}); onValue(ref(db,"matches"),snap=>{matches=snap.val()||{};render()});
}
function renderEmptyHistory(){
  meta={displayTitle:"저장된 친선경기가 없습니다",teams:[],empty:true};players={};matches={};render();
}
async function init(){
  const requested=new URLSearchParams(location.search).get("event"); const friendliesSnap=await get(ref(db,"friendlies")); const all=friendliesSnap.val()||{}; let eventId=requested;
  if(!eventId){const active=await get(ref(db,"config/activeFriendlyId"));eventId=active.exists()?String(active.val()):""}
  if(!eventId&&Object.keys(all).length){eventId=Object.entries(all).sort((a,b)=>String(b[1]?.meta?.date||"").localeCompare(String(a[1]?.meta?.date||""))||Number(b[1]?.meta?.createdAt||0)-Number(a[1]?.meta?.createdAt||0))[0][0]}
  if(eventId&&all[eventId]) subscribeFriendly(eventId);
  else if(!requested){const migrated=await get(ref(db,"config/historyMigratedAt"));if(migrated.exists())renderEmptyHistory();else subscribeLegacy()}
  else {meta={displayTitle:"친선경기를 찾을 수 없습니다",teams:[],empty:true};players={};matches={};render()}
}
init().catch(error=>{console.error(error);$("eventMeta").textContent="자료를 불러오지 못했습니다."});
</script>
</body>
</html>
