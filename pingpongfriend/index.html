<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>🏓 탁구 친선경기</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{
  --ink:#0f172a;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;
  --accent:#2563eb;--ok:#16a34a;--danger:#ef4444;--gold:#f59e0b;
  --shadow:0 8px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-weight:650}
header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;text-align:center;padding:10px 8px}
h1{margin:2px 0 8px;color:var(--accent);font-size:clamp(18px,4vw,23px);font-weight:900}
h2{font-size:18px;text-align:center;color:#1e3a8a;margin:16px 0 10px;font-weight:900}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.btn{border:1px solid #cbd5e1;border-radius:9px;padding:7px 11px;font-size:14px;cursor:pointer;background:#fff;font-weight:800;color:#111827;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:960px;margin:0 auto;padding:10px 8px 50px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid rgba(226,232,240,.8);border-radius:14px;box-shadow:var(--shadow);padding:11px;margin-bottom:12px}
.eventBar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,#eff6ff,#fff)}
.eventBarTitle{font-size:17px;font-weight:950;color:#1e3a8a;line-height:1.35}
.eventBarMeta{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px}
.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;white-space:nowrap}
.status.draft{background:#dcfce7;color:#166534}.status.finalized{background:#e2e8f0;color:#475569}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.chip{border:1px solid #ccc;border-radius:10px;padding:7px 10px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:#fff;color:#111;cursor:pointer;font-weight:800;line-height:1.15;touch-action:manipulation}
.chip small{font-size:10px;margin-top:3px;opacity:.9}.chip.selected{border-color:var(--accent)!important;background:#efef07!important;color:#111!important;outline:2px solid var(--accent)}
.chip.bu1,.chip.bu2,.chip.bu3{background:#dc2626;color:#fff;border-color:#dc2626}.chip.bu4{background:#f97316;color:#fff;border-color:#f97316}.chip.bu5{background:#facc15;color:#111;border-color:#eab308}.chip.bu6{background:#22c55e;color:#fff;border-color:#16a34a}.chip.bu7{background:#06b6d4;color:#fff;border-color:#0891b2}.chip.bu8{background:#3b82f6;color:#fff;border-color:#2563eb}.chip.bu9{background:#6366f1;color:#fff;border-color:#4f46e5}.chip.bu10{background:#8b5cf6;color:#fff;border-color:#7c3aed}.chip.bu11{background:#ec4899;color:#fff;border-color:#db2777}.chip.bu12{background:#94a3b8;color:#fff;border-color:#64748b}
.matchBox{margin:8px 0 5px;text-align:center;font-size:18px;font-weight:900;line-height:1.35;min-height:24px}
.sidePick{display:flex;gap:7px;justify-content:center;margin:5px 0 3px}.sideBtn{display:none;flex:1;max-width:360px;border:0;border-radius:12px;padding:11px 8px;font-size:17px;font-weight:950;cursor:pointer;color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.12)}
.sideBtn.left{background:#2563eb}.sideBtn.right{background:#ef4444}.subActions{display:flex;justify-content:center;gap:6px;margin-top:5px}
.notice{position:fixed;left:12px;right:12px;bottom:18px;z-index:60;display:none;max-width:520px;margin:0 auto;padding:11px 12px;border-radius:12px;background:#111827;color:#fff;font-size:14px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--muted);padding:22px 14px;background:#fff;border-radius:14px;box-shadow:var(--shadow);line-height:1.6}
#logs{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px 10px}.log-item{border-bottom:1px solid #e5e7eb;padding:9px 34px 9px 2px;position:relative}.log-item:last-child{border-bottom:none}.log-time{display:block;font-size:13px;color:#334155;margin-bottom:4px;font-weight:850}.log-match{font-size:15px;font-weight:850;line-height:1.45}.log-win{color:#dc2626;font-weight:950}.delete-btn{position:absolute;right:6px;top:8px;border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:17px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(120px,.7fr);gap:8px}input,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:9px 10px;background:#fff;font-size:15px;font-weight:750;color:var(--ink)}
.adminActions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.adminActions .btn{flex:1;min-width:90px}.playerList{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start;margin-top:12px}.playerChip{min-height:44px}.resetBox{margin-top:14px;padding-top:12px;border-top:1px dashed #cbd5e1}.resetBox p,.helper{margin:0 0 8px;color:#64748b;font-size:13px;font-weight:700;line-height:1.45}
.createGrid{display:grid;grid-template-columns:135px repeat(3,minmax(0,1fr));gap:8px}.createActions{display:flex;justify-content:flex-end;margin-top:10px}.historyList{display:grid;gap:9px}.historyItem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;text-decoration:none;color:inherit;box-shadow:0 5px 16px rgba(15,23,42,.05);transition:.15s}.historyItem:hover{border-color:#93c5fd;transform:translateY(-1px)}.historyTitle{font-size:16px;font-weight:950;color:#1e3a8a}.historyMeta{font-size:12px;color:var(--muted);font-weight:800;margin-top:5px}.historyArrow{font-size:20px;color:#94a3b8}.historyEmpty{text-align:center;color:var(--muted);padding:20px}
@media(max-width:680px){.createGrid{grid-template-columns:1fr 1fr}.createGrid input:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr 88px}.grid select{grid-column:1/-1}.eventBar{align-items:flex-start;flex-direction:column}.eventBar .row{justify-content:flex-start}}
@media(max-width:390px){.chip{font-size:14px;padding:6px 7px}.btn{font-size:12.5px;padding:6px 8px}.sideBtn{font-size:15px}.createGrid{grid-template-columns:1fr}.createGrid input:first-child{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>🏓 탁구 친선경기</h1>
  <div class="row">
    <button id="showMainBtn" class="btn primary">경기입력</button>
    <button id="showHistoryBtn" class="btn">역대 친선경기</button>
    <button id="adminBtn" class="btn">⚙ 관리자</button>
    <a id="reportLink" href="report.html" class="btn ok">Report</a>
  </div>
</header>
<main>
  <div id="notice" class="notice"></div>

  <section id="mainPanel" class="panel active">
    <div id="noActiveEvent" class="empty" style="display:none">
      현재 입력 중인 친선경기가 없습니다.<br />
      <button id="goCreateBtn" class="btn primary" style="margin-top:10px">새 친선경기 만들기</button>
    </div>
    <div id="activeEventArea" style="display:none">
      <div class="card eventBar">
        <div>
          <div id="currentEventTitle" class="eventBarTitle"></div>
          <div id="currentEventMeta" class="eventBarMeta"></div>
        </div>
        <div class="row">
          <span class="status draft">입력 중</span>
          <button id="finalizeBtn" class="btn gold">🔒 최종 저장</button>
        </div>
      </div>
      <div class="card">
        <div id="playerTiles" class="chips"></div>
        <div id="matchDisplay" class="matchBox"></div>
        <div class="sidePick">
          <button id="leftWinBtn" class="sideBtn left"></button>
          <button id="rightWinBtn" class="sideBtn right"></button>
        </div>
        <div class="subActions"><button id="clearSelected" class="btn">비우기</button></div>
      </div>
      <h2>📝 최근 경기</h2>
      <div id="logs"></div>
    </div>
  </section>

  <section id="historyPanel" class="panel">
    <div class="card">
      <h2 style="margin-top:4px">새 친선경기</h2>
      <p class="helper">팀명은 목록에 표시할 짧은 이름으로 입력하세요. 두 팀은 필수이고 세 번째 팀은 선택입니다.</p>
      <div class="createGrid">
        <input id="eventDate" type="date" aria-label="경기 날짜" />
        <input id="team1" value="남동" placeholder="1팀 (예: 남동)" />
        <input id="team2" placeholder="2팀" />
        <input id="team3" placeholder="3팀 (선택)" />
      </div>
      <div class="createActions"><button id="createEventBtn" class="btn primary">친선경기 만들기</button></div>
    </div>
    <h2>📚 역대 친선경기</h2>
    <div id="historyList" class="historyList"></div>
  </section>

  <section id="adminPanel" class="panel">
    <div class="card">
      <h2 style="margin-top:4px">관리자 선수입력</h2>
      <div class="grid">
        <input id="playerName" placeholder="선수 이름" />
        <input id="playerBu" type="number" placeholder="부수" />
        <select id="playerTeam" aria-label="소속 팀"></select>
      </div>
      <div class="adminActions">
        <button id="addPlayerBtn" class="btn primary">추가</button>
        <button id="deleteSelectedPlayerBtn" class="btn danger">선택삭제</button>
        <button id="closeAdminBtn" class="btn">닫기</button>
      </div>
      <div id="playerList" class="playerList"></div>
      <div class="resetBox">
        <p>아래 리셋은 현재 입력 중인 친선경기에만 적용됩니다. 최종 저장된 역대 경기는 변경되지 않습니다.</p>
        <div class="adminActions">
          <button id="resetMatchesBtn" class="btn danger">현재 경기기록 리셋</button>
          <button id="resetAllBtn" class="btn danger">현재 선수·경기 전체리셋</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, get, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyC0prJtmZ25JTLsG9R9JRCapCtOqH2PGaA",
  authDomain:"pingpongfriend-19295.firebaseapp.com",
  databaseURL:"https://pingpongfriend-19295-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"pingpongfriend-19295",
  storageBucket:"pingpongfriend-19295.firebasestorage.app",
  messagingSenderId:"201223495919",
  appId:"1:201223495919:web:b8f20c2cfec45043d8fb1a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const friendliesRef = ref(db,"friendlies");
const activeFriendlyIdRef = ref(db,"config/activeFriendlyId");
const legacyMembersRef = ref(db,"members");
const legacyMatchesRef = ref(db,"matches");
const LEGACY_ID = "friendly-2026-07-06-koen-kcc";

let friendlies = {};
let currentEventId = "";
let currentMeta = null;
let players = {};
let matches = {};
let selectedNames = [];
let selectedAdminPlayerId = null;
let isAdmin = false;
let stopCurrentEvent = null;

const $ = id => document.getElementById(id);
const escapeHtml = str => String(str ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const pad2 = n => String(n).padStart(2,"0");
const safeNameKey = name => String(name).trim().replace(/[.#$[\]/]/g,"_");
const getKSTDate = (date=new Date()) => new Date(date.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
const localDateKey = () => { const d=getKSTDate(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const monthKey = () => localDateKey().slice(0,7);
const isEditable = () => Boolean(currentEventId && currentMeta && currentMeta.status !== "finalized" && currentMeta.locked !== true);

function showNotice(message){
  const box=$("notice"); box.textContent=message; box.style.display="block";
  clearTimeout(showNotice.timer); showNotice.timer=setTimeout(()=>box.style.display="none",1900);
}
function showPanel(id){
  ["mainPanel","historyPanel","adminPanel"].forEach(panelId => $(panelId).classList.toggle("active",panelId===id));
  $("showMainBtn").classList.toggle("primary",id==="mainPanel");
  $("showHistoryBtn").classList.toggle("primary",id==="historyPanel");
}
function eventTeams(){ return Array.isArray(currentMeta?.teams) ? currentMeta.teams.filter(Boolean) : []; }
function playerArray(){
  return Object.entries(players||{}).map(([id,p])=>({id,name:p?.name||"",bu:Number(p?.bu??99),team:p?.team||"",active:p?.active!==false}))
    .filter(p=>p.name&&p.active).sort((a,b)=>a.bu-b.bu||a.name.localeCompare(b.name,"ko"));
}
function getMode(){ return selectedNames.length===2 ? "single" : selectedNames.length===4 ? "double" : ""; }
function getSides(){
  if(selectedNames.length===2) return {left:[selectedNames[0]],right:[selectedNames[1]]};
  if(selectedNames.length===4) return {left:selectedNames.slice(0,2),right:selectedNames.slice(2,4)};
  return {left:[],right:[]};
}
function teamForName(name){ return playerArray().find(p=>p.name===name)?.team||""; }

async function ensureLegacyFriendly(){
  const existing = await get(friendliesRef);
  if(existing.exists()) return;
  const [memberSnap,matchSnap] = await Promise.all([get(legacyMembersRef),get(legacyMatchesRef)]);
  if(!memberSnap.exists()&&!matchSnap.exists()) return;
  await set(ref(db,`friendlies/${LEGACY_ID}`),{
    meta:{
      date:"2026-07-06",teams:["남동","저작권위원회"],displayTitle:"26.7.6 남동 vs 저작권위원회",
      status:"finalized",locked:true,createdAt:Date.now(),finalizedAt:Date.now(),migratedFromLegacy:true
    },
    members:memberSnap.val()||{},matches:matchSnap.val()||{}
  });
  await set(ref(db,"config/historyMigratedAt"),Date.now());
}

function subscribeCurrentEvent(eventId){
  if(stopCurrentEvent){ stopCurrentEvent(); stopCurrentEvent=null; }
  currentEventId=eventId||""; currentMeta=null; players={}; matches={}; selectedNames=[]; selectedAdminPlayerId=null;
  if(!currentEventId){ renderCurrentEvent(); return; }
  stopCurrentEvent=onValue(ref(db,`friendlies/${currentEventId}`),snap=>{
    const event=snap.val()||{}; currentMeta=event.meta||{}; players=event.members||{}; matches=event.matches||{};
    if(!isEditable() && $("adminPanel").classList.contains("active")) showPanel("mainPanel");
    renderCurrentEvent(); renderPlayerList();
  });
}

function renderCurrentEvent(){
  const active=Boolean(currentEventId&&currentMeta);
  $("noActiveEvent").style.display=active?"none":"block";
  $("activeEventArea").style.display=active&&isEditable()?"block":"none";
  $("reportLink").href=currentEventId?`report.html?event=${encodeURIComponent(currentEventId)}`:"report.html";
  if(!active){ renderLogs(); return; }
  $("currentEventTitle").textContent=currentMeta.displayTitle||"친선경기";
  $("currentEventMeta").textContent=`참가팀 ${eventTeams().join(" · ")} · 현재 ${Object.keys(matches||{}).length}경기`;
  updateTeamSelect(); renderTiles(); renderMatchDisplay(); renderLogs();
}

function renderHistory(){
  const arr=Object.entries(friendlies||{}).map(([id,event])=>({id,meta:event?.meta||{},count:Object.keys(event?.matches||{}).length}))
    .sort((a,b)=>String(b.meta.date||"").localeCompare(String(a.meta.date||""))||Number(b.meta.createdAt||0)-Number(a.meta.createdAt||0));
  if(!arr.length){ $("historyList").innerHTML='<div class="historyEmpty">저장된 친선경기가 없습니다.</div>'; return; }
  $("historyList").innerHTML=arr.map(item=>{
    const done=item.meta.status==="finalized"||item.meta.locked===true;
    const statusClass=done?"finalized":"draft"; const statusText=done?"최종 저장":"입력 중";
    return `<a class="historyItem" href="report.html?event=${encodeURIComponent(item.id)}">
      <div><div class="historyTitle">${escapeHtml(item.meta.displayTitle||"친선경기")}</div>
      <div class="historyMeta"><span class="status ${statusClass}">${statusText}</span> · ${item.count}경기 · 클릭하면 경기 내용과 개인별 성적을 봅니다</div></div>
      <span class="historyArrow">›</span></a>`;
  }).join("");
}

function togglePlayer(name){
  if(!isEditable()) return;
  const index=selectedNames.indexOf(name);
  if(index>=0) selectedNames.splice(index,1); else { if(selectedNames.length>=4) return showNotice("최대 4명까지 선택"); selectedNames.push(name); }
  renderTiles(); renderMatchDisplay();
}
function renderTiles(){
  const arr=playerArray();
  if(!arr.length){ $("playerTiles").innerHTML='<div class="empty" style="width:100%">관리자에서 선수를 입력하세요.</div>'; return; }
  $("playerTiles").innerHTML=arr.map(p=>`<button class="chip bu${Math.min(Math.max(p.bu,1),12)} ${selectedNames.includes(p.name)?"selected":""}" data-name="${escapeHtml(p.name)}">
    <span>${escapeHtml(p.name)}(${p.bu})</span>${p.team?`<small>${escapeHtml(p.team)}</small>`:""}</button>`).join("");
  document.querySelectorAll("#playerTiles .chip").forEach(btn=>btn.addEventListener("click",()=>togglePlayer(btn.dataset.name)));
}
function renderMatchDisplay(){
  const mode=getMode(); const {left,right}=getSides(); const leftBtn=$("leftWinBtn"); const rightBtn=$("rightWinBtn");
  if(!selectedNames.length){ $("matchDisplay").innerHTML=""; leftBtn.style.display="none"; rightBtn.style.display="none"; return; }
  if(!mode){ $("matchDisplay").innerHTML=selectedNames.map(escapeHtml).join(" , "); leftBtn.style.display="none"; rightBtn.style.display="none"; return; }
  const leftText=left.map(escapeHtml).join(", "); const rightText=right.map(escapeHtml).join(", ");
  $("matchDisplay").innerHTML=`${leftText} <span style="color:#64748b">vs</span> ${rightText}`;
  leftBtn.textContent=`${leftText} 승`; rightBtn.textContent=`${rightText} 승`; leftBtn.style.display="block"; rightBtn.style.display="block";
}
async function saveByWinner(side){
  if(!isEditable()) return showNotice("최종 저장된 경기는 수정할 수 없습니다");
  const mode=getMode(); if(!mode) return showNotice("2명 또는 4명을 선택하세요");
  const {left,right}=getSides(); const winners=side==="left"?left:right; const losers=side==="left"?right:left; const now=Date.now();
  const teamByName={}; [...winners,...losers].forEach(name=>teamByName[name]=teamForName(name));
  await set(push(ref(db,`friendlies/${currentEventId}/matches`)),{
    type:mode,mode,winnerNames:[...winners],loserNames:[...losers],namesA:[...winners],namesB:[...losers],winnerSide:"A",loserSide:"B",
    winnerTeams:winners.map(teamForName),loserTeams:losers.map(teamForName),teamByName,dateKey:localDateKey(),monthKey:monthKey(),createdAt:now
  });
  selectedNames=[]; renderTiles(); renderMatchDisplay(); showNotice("저장되었습니다");
}

function renderLogs(){
  const arr=Object.entries(matches||{}).map(([id,m])=>({id,...m})).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
  if(!arr.length){ $("logs").innerHTML='<div style="text-align:center;color:#999;padding:10px">최근 경기 없음</div>'; return; }
  $("logs").innerHTML=arr.map(m=>{
    const kst=getKSTDate(new Date(Number(m.createdAt||Date.now()))); const time=`${kst.getFullYear()}-${pad2(kst.getMonth()+1)}-${pad2(kst.getDate())} ${pad2(kst.getHours())}:${pad2(kst.getMinutes())}`;
    const winners=Array.isArray(m.winnerNames)?m.winnerNames:(m.winnerSide==="A"?(m.namesA||[]):(m.namesB||[]));
    const losers=Array.isArray(m.loserNames)?m.loserNames:(m.winnerSide==="A"?(m.namesB||[]):(m.namesA||[]));
    return `<div class="log-item"><span class="log-time">${time} [${(m.mode||m.type)==="double"?"복식":"단식"}]</span><div class="log-match"><span class="log-win">${winners.map(escapeHtml).join("/")} 승</span> vs ${losers.map(escapeHtml).join("/")}</div>${isEditable()?`<button class="delete-btn" data-del="${escapeHtml(m.id)}">🗑️</button>`:""}</div>`;
  }).join("");
  document.querySelectorAll("[data-del]").forEach(btn=>btn.addEventListener("click",()=>deleteMatch(btn.dataset.del)));
}
async function deleteMatch(id){
  if(!isEditable()) return;
  if(!(await verifyPassword("deletePassword","삭제 비밀번호를 입력하세요."))) return;
  if(!confirm("이 경기결과를 삭제할까요?")) return;
  await remove(ref(db,`friendlies/${currentEventId}/matches/${id}`)); showNotice("삭제되었습니다");
}

function updateTeamSelect(){
  const teams=eventTeams(); $("playerTeam").innerHTML=teams.length?teams.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join(""):'<option value="">소속 미지정</option>';
}
function renderPlayerList(){
  const arr=playerArray();
  if(!arr.length){ selectedAdminPlayerId=null; $("playerList").innerHTML='<div class="empty" style="width:100%">등록된 선수가 없습니다.</div>'; return; }
  if(selectedAdminPlayerId&&!arr.some(p=>p.id===selectedAdminPlayerId)) selectedAdminPlayerId=null;
  $("playerList").innerHTML=arr.map(p=>`<button class="chip playerChip bu${Math.min(Math.max(p.bu,1),12)} ${p.id===selectedAdminPlayerId?"selected":""}" data-id="${escapeHtml(p.id)}">
    <span>${escapeHtml(p.name)}(${p.bu})</span>${p.team?`<small>${escapeHtml(p.team)}</small>`:""}</button>`).join("");
  document.querySelectorAll(".playerChip").forEach(btn=>btn.addEventListener("click",()=>{selectedAdminPlayerId=selectedAdminPlayerId===btn.dataset.id?null:btn.dataset.id;renderPlayerList();}));
}
async function verifyPassword(key,message){
  const snap=await get(ref(db,`config/${key}`)); const saved=snap.exists()?String(snap.val()).trim():"1111"; const input=prompt(message);
  if(input===null) return false; if(String(input).trim()!==saved){alert("비밀번호가 올바르지 않습니다.");return false} return true;
}
async function openAdmin(){
  if(!isEditable()) return alert("먼저 새 친선경기를 만들거나 입력 중인 경기를 선택하세요. 최종 저장된 경기는 수정할 수 없습니다.");
  if(!isAdmin&&!(await verifyPassword("adminPassword","관리자 비밀번호를 입력하세요."))) return;
  isAdmin=true; updateTeamSelect(); renderPlayerList(); showPanel("adminPanel");
}
async function addPlayer(){
  if(!isEditable()) return;
  const name=$("playerName").value.trim(); const bu=Number($("playerBu").value||99); const team=$("playerTeam").value;
  if(!name) return alert("선수 이름을 입력하세요."); if(playerArray().some(p=>p.name===name)) return alert("이미 등록된 선수입니다.");
  await set(ref(db,`friendlies/${currentEventId}/members/${safeNameKey(name)}`),{name,bu:Number.isFinite(bu)?bu:99,team,active:true,createdAt:Date.now()});
  $("playerName").value=""; $("playerBu").value=""; showNotice("추가되었습니다");
}
async function deleteSelectedPlayer(){
  if(!isEditable()||!selectedAdminPlayerId) return alert("삭제할 선수를 먼저 선택하세요.");
  const p=playerArray().find(item=>item.id===selectedAdminPlayerId); if(!confirm(`${p?.name||"선택한 선수"} 선수를 삭제할까요?`)) return;
  await remove(ref(db,`friendlies/${currentEventId}/members/${selectedAdminPlayerId}`)); selectedAdminPlayerId=null; showNotice("선수 삭제 완료");
}
async function resetMatches(){
  if(!isEditable()||!(await verifyPassword("adminPassword","관리자 비밀번호를 입력하세요."))) return;
  if(!confirm("현재 친선경기의 경기 기록을 전부 삭제할까요?")) return;
  await remove(ref(db,`friendlies/${currentEventId}/matches`)); selectedNames=[]; renderMatchDisplay(); showNotice("현재 경기 기록이 리셋되었습니다");
}
async function resetAll(){
  if(!isEditable()||!(await verifyPassword("adminPassword","관리자 비밀번호를 입력하세요."))) return;
  if(!confirm("현재 친선경기의 선수와 경기 기록을 모두 삭제할까요?")) return; if(!confirm("정말 삭제합니다. 되돌릴 수 없습니다.")) return;
  await remove(ref(db,`friendlies/${currentEventId}/matches`)); await remove(ref(db,`friendlies/${currentEventId}/members`)); selectedNames=[]; selectedAdminPlayerId=null; showNotice("현재 친선경기 전체 리셋 완료");
}

async function createFriendly(){
  const date=$("eventDate").value; const teams=[$("team1").value,$("team2").value,$("team3").value].map(v=>v.trim()).filter(Boolean);
  if(!date) return alert("경기 날짜를 선택하세요."); if(teams.length<2) return alert("두 팀 이상 입력하세요.");
  if(new Set(teams).size!==teams.length) return alert("같은 팀명이 중복되었습니다.");
  if(currentEventId&&isEditable()) return alert("현재 입력 중인 친선경기를 먼저 최종 저장한 뒤 새 경기를 만들어 주세요.");
  if(!(await verifyPassword("adminPassword","새 친선경기 생성 관리자 비밀번호를 입력하세요."))) return;
  const [year,month,day]=date.split("-").map(Number); const displayTitle=`${String(year).slice(-2)}.${month}.${day} ${teams.join(" vs ")}`; const id=`friendly-${date}-${Date.now()}`;
  await set(ref(db,`friendlies/${id}/meta`),{date,teams,displayTitle,status:"draft",locked:false,createdAt:Date.now()});
  await set(activeFriendlyIdRef,id); isAdmin=false; $("team2").value=""; $("team3").value=""; showPanel("mainPanel"); showNotice("새 친선경기를 시작했습니다");
}
async function finalizeFriendly(){
  if(!isEditable()) return;
  if(!(await verifyPassword("adminPassword","최종 저장 관리자 비밀번호를 입력하세요."))) return;
  const count=Object.keys(matches||{}).length;
  if(!confirm(`${currentMeta.displayTitle||"현재 친선경기"} (${count}경기)를 최종 저장할까요?\n최종 저장 후에는 선수·경기 기록을 수정하거나 삭제할 수 없습니다.`)) return;
  await update(ref(db),{
    [`friendlies/${currentEventId}/meta/status`]:"finalized",
    [`friendlies/${currentEventId}/meta/locked`]:true,
    [`friendlies/${currentEventId}/meta/finalizedAt`]:Date.now(),
    "config/activeFriendlyId":null
  });
  isAdmin=false; showPanel("historyPanel"); showNotice("최종 저장되어 역대 친선경기에 보관되었습니다");
}

$("leftWinBtn").addEventListener("click",()=>saveByWinner("left"));
$("rightWinBtn").addEventListener("click",()=>saveByWinner("right"));
$("clearSelected").addEventListener("click",()=>{selectedNames=[];renderTiles();renderMatchDisplay()});
$("showMainBtn").addEventListener("click",()=>showPanel("mainPanel"));
$("showHistoryBtn").addEventListener("click",()=>showPanel("historyPanel"));
$("goCreateBtn").addEventListener("click",()=>showPanel("historyPanel"));
$("adminBtn").addEventListener("click",openAdmin);
$("closeAdminBtn").addEventListener("click",()=>showPanel("mainPanel"));
$("addPlayerBtn").addEventListener("click",addPlayer);
$("deleteSelectedPlayerBtn").addEventListener("click",deleteSelectedPlayer);
$("resetMatchesBtn").addEventListener("click",resetMatches);
$("resetAllBtn").addEventListener("click",resetAll);
$("createEventBtn").addEventListener("click",createFriendly);
$("finalizeBtn").addEventListener("click",finalizeFriendly);

async function init(){
  $("eventDate").value=localDateKey();
  await ensureLegacyFriendly();
  onValue(friendliesRef,snap=>{friendlies=snap.val()||{};renderHistory()});
  onValue(activeFriendlyIdRef,snap=>subscribeCurrentEvent(snap.exists()?String(snap.val()):""));
  if(new URLSearchParams(location.search).get("view")==="history") showPanel("historyPanel");
}
init().catch(error=>{console.error(error);alert("자료를 불러오는 중 오류가 발생했습니다.")});
</script>
