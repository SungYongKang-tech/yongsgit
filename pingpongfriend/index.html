<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>🏓 탁구 친선경기</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{
  --ink:#0f172a;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--line:#e2e8f0;
  --accent:#2563eb;--ok:#16a34a;--danger:#ef4444;--gold:#f59e0b;
  --shadow:0 8px 28px rgba(15,23,42,.08);
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-weight:650}
header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;text-align:center;padding:8px 6px}
h1{margin:1px 0 6px;color:var(--accent);font-size:clamp(17px,4vw,22px);font-weight:900}
h2{font-size:18px;text-align:center;color:#1e3a8a;margin:16px 0 10px;font-weight:900}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.headerNav{display:flex;flex-wrap:nowrap;gap:2px;align-items:stretch;justify-content:center;width:100%;max-width:680px;margin:0 auto}
.headerNav .btn{flex:1 1 0;min-width:0;padding:7px 2px;font-size:13.5px;line-height:1.05;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.headerNav .historyNavBtn{line-height:1.02;padding-left:1px;padding-right:1px}
.headerNav #finalizeBtn{padding-left:1px;padding-right:1px}
.btn{border:1px solid #cbd5e1;border-radius:9px;padding:7px 11px;font-size:14px;cursor:pointer;background:#fff;font-weight:800;color:#111827;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:960px;margin:0 auto;padding:10px 8px 50px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid rgba(226,232,240,.8);border-radius:14px;box-shadow:var(--shadow);padding:11px;margin-bottom:12px}
.eventBar{display:flex;align-items:center;justify-content:center;padding:9px 10px;background:linear-gradient(135deg,#eff6ff,#fff)}
.eventBarTitle{font-size:16px;font-weight:950;color:#1e3a8a;line-height:1.4;text-align:center;word-break:keep-all}
.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;white-space:nowrap}
.status.draft{background:#dcfce7;color:#166534}.status.finalized{background:#e2e8f0;color:#475569}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.teamRosterGrid{display:grid;grid-template-columns:1fr;gap:6px;align-items:start;margin-top:4px}
.teamRoster{min-width:0;border:1px solid #dbeafe;border-radius:11px;background:#f8fbff;overflow:hidden;display:grid;grid-template-columns:62px minmax(0,1fr);align-items:stretch}
.teamRoster h3{margin:0;padding:2px 2px;background:#dbeafe;color:#1e3a8a;text-align:center;font-size:12px;font-weight:950;line-height:1.15;display:flex;align-items:center;justify-content:center;word-break:keep-all;overflow-wrap:anywhere}
.teamPlayers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:3px 2px}
.chip{border:1px solid #ccc;border-radius:10px;padding:7px 10px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:#fff;color:#111;cursor:pointer;font-weight:800;line-height:1.15;touch-action:manipulation}
.teamPlayers .chip{width:100%;min-width:0;min-height:32px;padding:3px 1px;font-size:12.5px}
.teamPlayers .chip span{display:block;max-width:100%;overflow:visible;text-overflow:clip;white-space:normal;word-break:keep-all;line-height:1.08}
.chip small{font-size:10px;margin-top:3px;opacity:.9}.chip.selected{border-color:var(--accent)!important;background:#efef07!important;color:#111!important;outline:2px solid var(--accent)}
.chip.bu1,.chip.bu2,.chip.bu3{background:#dc2626;color:#fff;border-color:#dc2626}.chip.bu4{background:#f97316;color:#fff;border-color:#f97316}.chip.bu5{background:#facc15;color:#111;border-color:#eab308}.chip.bu6{background:#22c55e;color:#fff;border-color:#16a34a}.chip.bu7{background:#06b6d4;color:#fff;border-color:#0891b2}.chip.bu8{background:#3b82f6;color:#fff;border-color:#2563eb}.chip.bu9{background:#6366f1;color:#fff;border-color:#4f46e5}.chip.bu10{background:#8b5cf6;color:#fff;border-color:#7c3aed}.chip.bu11{background:#ec4899;color:#fff;border-color:#db2777}.chip.bu12{background:#94a3b8;color:#fff;border-color:#64748b}
.matchBox{margin:8px 0 5px;text-align:center;font-size:18px;font-weight:900;line-height:1.35;min-height:24px}
.sidePick{display:flex;gap:7px;justify-content:center;margin:5px 0 3px}.sideBtn{display:none;flex:1;max-width:360px;border:0;border-radius:12px;padding:11px 8px;font-size:17px;font-weight:950;cursor:pointer;color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.12)}
.sideBtn.left{background:#2563eb}.sideBtn.right{background:#ef4444}.subActions{display:flex;justify-content:center;gap:6px;margin-top:5px}
.sideBtn.live{background:#7c3aed}.subActions .btn{flex:0 1 auto}
.liveResultSummary{margin:12px 0;padding:13px;border-radius:13px;background:#f8fafc;border:1px solid #dbeafe;text-align:center}
.liveResultTeams{font-size:17px;font-weight:950;color:#1e3a8a;line-height:1.45}.liveResultScore{margin-top:7px;font-size:30px;font-weight:950;color:#111827}.liveResultSets{margin-top:6px;color:#64748b;font-size:13px;font-weight:800;line-height:1.45}
.notice{position:fixed;left:12px;right:12px;bottom:18px;z-index:60;display:none;max-width:520px;margin:0 auto;padding:11px 12px;border-radius:12px;background:#111827;color:#fff;font-size:14px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--muted);padding:22px 14px;background:#fff;border-radius:14px;box-shadow:var(--shadow);line-height:1.6}
#logs{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px 10px}.log-item{border-bottom:1px solid #e5e7eb;padding:9px 34px 9px 2px;position:relative}.log-item:last-child{border-bottom:none}.log-time{display:block;font-size:13px;color:#334155;margin-bottom:4px;font-weight:850}.log-match{font-size:15px;font-weight:850;line-height:1.45}.log-win{color:#dc2626;font-weight:950}.delete-btn{position:absolute;right:6px;top:8px;border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:17px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(120px,.7fr);gap:8px}input,select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:9px 10px;background:#fff;font-size:15px;font-weight:750;color:var(--ink)}
.adminActions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.adminActions .btn{flex:1;min-width:90px}.playerList{margin-top:12px}.playerChip{min-height:44px}.resetBox{margin-top:14px;padding-top:12px;border-top:1px dashed #cbd5e1}.resetBox p,.helper{margin:0 0 8px;color:#64748b;font-size:13px;font-weight:700;line-height:1.45}
.historyHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;padding:2px}.historyHead h2{margin:0;text-align:left}.historyHead p{margin:4px 0 0;color:var(--muted);font-size:12px;font-weight:750}.historyList{display:grid;gap:9px}.historyItem{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 16px rgba(15,23,42,.05);transition:.15s;overflow:hidden}.historyItem:hover{border-color:#93c5fd;transform:translateY(-1px)}.historyOpen{min-width:0;flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;text-decoration:none;color:inherit}.historyDelete{flex:0 0 auto;margin-right:11px}.historyTitle{font-size:16px;font-weight:950;color:#1e3a8a}.historyMeta{font-size:12px;color:var(--muted);font-weight:800;margin-top:5px}.historyArrow{font-size:20px;color:#94a3b8}.historyEmpty{text-align:center;color:var(--muted);padding:20px}
.modalBackdrop{display:none;position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.62);padding:18px;align-items:center;justify-content:center}.modalBackdrop.open{display:flex}.modalCard{width:min(540px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.3);padding:16px}.modalHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.modalHeader h2{margin:0;text-align:left}.modalClose{border:0;background:#f1f5f9;color:#475569;border-radius:999px;width:34px;height:34px;font-size:20px;cursor:pointer}.createGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.createGrid .dateField{grid-column:1/-1}.createActions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}
@media(max-width:680px){.grid{grid-template-columns:1fr 88px}.grid select{grid-column:1/-1}.historyHead{align-items:flex-start}.historyHead .btn{white-space:nowrap}}
@media(max-width:520px){header{padding-left:2px;padding-right:2px}.headerNav{gap:2px}.headerNav .btn{font-size:12.8px;padding:6px 1px}.headerNav #finalizeBtn{padding-left:1px;padding-right:1px}.teamRoster{grid-template-columns:54px minmax(0,1fr)}.teamRoster h3{font-size:11px;padding:2px 1px;line-height:1.1}.teamPlayers{gap:2px;padding:2px}.teamPlayers .chip{font-size:12px;padding:2px 0;min-height:30px}}
@media(max-width:390px){.chip{font-size:12px;padding:4px 2px}.btn{font-size:12px;padding:6px 4px}.headerNav .btn{font-size:12px;padding:6px 0}.sideBtn{font-size:15px}.createGrid{grid-template-columns:1fr}.createGrid .dateField{grid-column:auto}.historyHead{flex-direction:column}.historyHead .btn{width:100%}.modalBackdrop{padding:10px}.modalCard{padding:14px}.teamRoster{grid-template-columns:48px minmax(0,1fr)}.teamRoster h3{font-size:10.5px;padding:1px;line-height:1.05}.teamPlayers .chip{font-size:11.5px}}
</style>
</head>
<body>
<header>
  <h1>🏓 탁구 친선경기</h1>
  <div class="headerNav">
    <button id="showMainBtn" class="btn primary">경기입력</button>
    <button id="showHistoryBtn" class="btn historyNavBtn">역대<br>친선경기</button>
    <button id="adminBtn" class="btn">관리자</button>
    <a id="reportLink" href="report.html" class="btn ok">Report</a>
    <button id="finalizeBtn" class="btn gold" style="display:none">최종저장</button>
  </div>
</header>
<main>
  <div id="notice" class="notice"></div>

  <section id="mainPanel" class="panel active">
    <div id="noActiveEvent" class="empty" style="display:none">
      현재 입력 중인 친선경기가 없습니다.<br />
      <button id="goCreateBtn" class="btn primary" style="margin-top:10px">새 친선경기 만들기</button>
    </div>
    <div id="activeEventArea" style="display:none">
      <div class="card eventBar">
        <div id="currentEventTitle" class="eventBarTitle"></div>
      </div>
      <div class="card">
        <div id="playerTiles" class="teamRosterGrid"></div>
        <div id="matchDisplay" class="matchBox"></div>
        <div class="sidePick">
          <button id="leftWinBtn" class="sideBtn left"></button>
          <button id="rightWinBtn" class="sideBtn right"></button>
          <button id="liveMatchBtn" class="sideBtn live">경기 진행</button>
        </div>
        <div class="subActions">
          <button id="clearSelected" class="btn">선택 초기화</button>
          <button id="openScoreboardBtn" class="btn">📺 전광판 열기</button>
        </div>
      </div>
      <h2>📝 최근 경기</h2>
      <div id="logs"></div>
    </div>
  </section>

  <section id="historyPanel" class="panel">
    <div class="historyHead">
      <div>
        <h2>📚 역대 친선경기</h2>
        <p>목록을 누르면 해당 날짜의 경기 내용과 개인별 성적을 확인합니다.</p>
      </div>
      <button id="openCreateEventBtn" class="btn primary">+ 새 친선경기 만들기</button>
    </div>
    <div id="historyList" class="historyList"></div>
  </section>

  <section id="adminPanel" class="panel">
    <div class="card">
      <h2 style="margin-top:4px">관리자 선수입력</h2>
      <div class="grid">
        <input id="playerName" placeholder="선수 이름" />
        <input id="playerBu" type="number" placeholder="부수" />
        <select id="playerTeam" aria-label="소속 팀"></select>
      </div>
      <div class="adminActions">
        <button id="addPlayerBtn" class="btn primary">추가</button>
        <button id="deleteSelectedPlayerBtn" class="btn danger">선택삭제</button>
        <button id="closeAdminBtn" class="btn">닫기</button>
      </div>
      <div id="playerList" class="playerList teamRosterGrid"></div>
      <div class="resetBox">
        <p>아래 리셋은 현재 입력 중인 친선경기에만 적용됩니다. 최종 저장된 역대 경기는 변경되지 않습니다.</p>
        <div class="adminActions">
          <button id="resetMatchesBtn" class="btn danger">현재 경기기록 리셋</button>
          <button id="resetAllBtn" class="btn danger">현재 선수·경기 전체리셋</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="createEventModal" class="modalBackdrop" aria-hidden="true">
  <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="createEventTitle">
    <div class="modalHeader">
      <h2 id="createEventTitle">새 친선경기 만들기</h2>
      <button id="closeCreateModalBtn" class="modalClose" aria-label="닫기">×</button>
    </div>
    <p class="helper">경기 날짜와 참가팀을 입력하세요. 두 팀은 필수이며 최대 네 팀까지 등록할 수 있습니다.</p>
    <div class="createGrid">
      <input id="eventDate" class="dateField" type="date" aria-label="경기 날짜" />
      <input id="team1" value="남동" placeholder="1팀 (예: 남동)" />
      <input id="team2" placeholder="2팀 (필수)" />
      <input id="team3" placeholder="3팀 (선택)" />
      <input id="team4" placeholder="4팀 (선택)" />
    </div>
    <div class="createActions">
      <button id="cancelCreateEventBtn" class="btn">취소</button>
      <button id="createEventBtn" class="btn primary">만들기</button>
    </div>
  </div>
</div>

<div id="liveResultModal" class="modalBackdrop" aria-hidden="true">
  <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="liveResultTitle">
    <div class="modalHeader">
      <h2 id="liveResultTitle">복식 경기 결과</h2>
    </div>
    <p class="helper">경기 결과를 현재 친선경기 성적에 반영할지 선택하세요.</p>
    <div class="liveResultSummary">
      <div id="liveResultTeams" class="liveResultTeams">-</div>
      <div id="liveResultScore" class="liveResultScore">0 : 0</div>
      <div id="liveResultSets" class="liveResultSets"></div>
    </div>
    <div class="createActions">
      <button id="discardLiveResultBtn" class="btn">저장 없이 닫기</button>
      <button id="saveLiveResultBtn" class="btn ok">경기결과 저장</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, get, onValue, push, set, remove, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";
import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyC0prJtmZ25JTLsG9R9JRCapCtOqH2PGaA",
  authDomain:"pingpongfriend-19295.firebaseapp.com",
  databaseURL:"https://pingpongfriend-19295-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"pingpongfriend-19295",
  storageBucket:"pingpongfriend-19295.firebasestorage.app",
  messagingSenderId:"201223495919",
  appId:"1:201223495919:web:b8f20c2cfec45043d8fb1a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const friendliesRef = ref(db,"friendlies");
const activeFriendlyIdRef = ref(db,"config/activeFriendlyId");
const legacyMembersRef = ref(db,"members");
const legacyMatchesRef = ref(db,"matches");
const LEGACY_ID = "friendly-2026-07-06-koen-kcc";

let friendlies = {};
let currentEventId = "";
let currentMeta = null;
let players = {};
let matches = {};
let selectedNames = [];
let selectedAdminPlayerId = null;
let isAdmin = false;
let stopCurrentEvent = null;
let authReadyPromise = null;
let liveStartBusy = false;
let pendingLiveResult = null;

const LIVE_MATCH_TTL_MS = 10*60*1000;
const LIVE_ACTIVE_STATUSES = new Set(["setup","playing","awaiting_end"]);

const $ = id => document.getElementById(id);
const escapeHtml = str => String(str ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const pad2 = n => String(n).padStart(2,"0");
const safeNameKey = name => String(name).trim().replace(/[.#$[\]/]/g,"_");
const getKSTDate = (date=new Date()) => new Date(date.toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
const localDateKey = () => { const d=getKSTDate(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const monthKey = () => localDateKey().slice(0,7);
const isEditable = () => Boolean(currentEventId && currentMeta && currentMeta.status !== "finalized" && currentMeta.locked !== true);

function showNotice(message){
  const box=$("notice"); box.textContent=message; box.style.display="block";
  clearTimeout(showNotice.timer); showNotice.timer=setTimeout(()=>box.style.display="none",1900);
}
function ensureAuthReady(){
  if(authReadyPromise) return authReadyPromise;
  authReadyPromise=new Promise(resolve=>{
    const unsubscribe=onAuthStateChanged(auth,user=>{
      if(user){ unsubscribe(); resolve(user); }
    });
    if(!auth.currentUser) signInAnonymously(auth).catch(error=>{
      unsubscribe();
      console.warn("익명 로그인 없이 기존 Firebase 권한으로 연결합니다.",error);
      resolve(null);
    });
  });
  return authReadyPromise;
}
function showPanel(id){
  ["mainPanel","historyPanel","adminPanel"].forEach(panelId => $(panelId).classList.toggle("active",panelId===id));
  $("showMainBtn").classList.toggle("primary",id==="mainPanel");
  $("showHistoryBtn").classList.toggle("primary",id==="historyPanel");
}
function eventTeams(){ return Array.isArray(currentMeta?.teams) ? currentMeta.teams.filter(Boolean) : []; }
function playerArray(){
  return Object.entries(players||{}).map(([id,p])=>({id,name:p?.name||"",bu:Number(p?.bu??99),team:p?.team||"",active:p?.active!==false}))
    .filter(p=>p.name&&p.active).sort((a,b)=>a.bu-b.bu||a.name.localeCompare(b.name,"ko"));
}
function getMode(){ return selectedNames.length===2 ? "single" : selectedNames.length===4 ? "double" : ""; }
function getSides(){
  if(selectedNames.length===2) return {left:[selectedNames[0]],right:[selectedNames[1]]};
  if(selectedNames.length===4) return {left:selectedNames.slice(0,2),right:selectedNames.slice(2,4)};
  return {left:[],right:[]};
}
function teamForName(name){ return playerArray().find(p=>p.name===name)?.team||""; }
function groupPlayersByTeam(arr){
  const grouped=new Map();
  eventTeams().forEach(team=>grouped.set(team,[]));
  arr.forEach(player=>{
    const team=player.team||"소속 미지정";
    if(!grouped.has(team)) grouped.set(team,[]);
    grouped.get(team).push(player);
  });
  return [...grouped.entries()].map(([team,members])=>({team,members})).filter(group=>group.members.length);
}

async function ensureLegacyFriendly(){
  const migrationSnap = await get(ref(db,"config/historyMigratedAt"));
  if(migrationSnap.exists()) return;
  const existing = await get(friendliesRef);
  if(existing.exists()) { await set(ref(db,"config/historyMigratedAt"),Date.now()); return; }
  const [memberSnap,matchSnap] = await Promise.all([get(legacyMembersRef),get(legacyMatchesRef)]);
  if(!memberSnap.exists()&&!matchSnap.exists()) return;
  await set(ref(db,`friendlies/${LEGACY_ID}`),{
    meta:{
      date:"2026-07-06",teams:["남동","저작권위원회"],displayTitle:"26.7.6 남동 vs 저작권위원회",
      status:"finalized",locked:true,createdAt:Date.now(),finalizedAt:Date.now(),migratedFromLegacy:true
    },
    members:memberSnap.val()||{},matches:matchSnap.val()||{}
  });
  await set(ref(db,"config/historyMigratedAt"),Date.now());
}

function subscribeCurrentEvent(eventId){
  if(stopCurrentEvent){ stopCurrentEvent(); stopCurrentEvent=null; }
  currentEventId=eventId||""; currentMeta=null; players={}; matches={}; selectedNames=[]; selectedAdminPlayerId=null;
  if(!currentEventId){ renderCurrentEvent(); return; }
  stopCurrentEvent=onValue(ref(db,`friendlies/${currentEventId}`),snap=>{
    const event=snap.val()||{}; currentMeta=event.meta||{}; players=event.members||{}; matches=event.matches||{};

function calculateDoublesHandicap(left,right){
  const infoByName=new Map(playerArray().map(player=>[player.name,player]));
  const levelsA=left.map(name=>Number(infoByName.get(name)?.bu));
  const levelsB=right.map(name=>Number(infoByName.get(name)?.bu));
  const levelsValid=[...levelsA,...levelsB].every(level=>Number.isInteger(level)&&level>=1&&level<=12);
  const sumA=levelsValid ? levelsA.reduce((sum,level)=>sum+level,0) : 0;
  const sumB=levelsValid ? levelsB.reduce((sum,level)=>sum+level,0) : 0;
  if(!levelsValid || sumA===sumB) return {sumA,sumB,side:"",points:0,levelsValid};
  const side=sumA>sumB ? "A" : "B";
  const points=Math.min(4,Math.abs(sumA-sumB));
  return {sumA,sumB,side,points,levelsValid,formula:"team-sum-difference-max-4"};
}
function generateRoomCode(){
  if(globalThis.crypto?.getRandomValues){
    const value=new Uint32Array(1); crypto.getRandomValues(value);
    return String(100000+(value[0]%900000));
  }
  return String(Math.floor(100000+Math.random()*900000));
}
async function startLiveDoublesMatch(){
  if(liveStartBusy) return;
  if(!isEditable()) return showNotice("입력 중인 친선경기에서만 진행할 수 있습니다");
  if(getMode()!=="double") return showNotice("복식 선수 4명을 선택하세요");
  liveStartBusy=true;
  const button=$("liveMatchBtn"); button.disabled=true; button.textContent="연결 준비 중";
  try{
    await ensureAuthReady();
    const {left,right}=getSides();
    const playerInfo=new Map(playerArray().map(player=>[player.name,player]));
    const teamByName={};
    const playerBu={};
    [...left,...right].forEach(name=>{
      teamByName[name]=playerInfo.get(name)?.team||"";
      playerBu[name]=Number(playerInfo.get(name)?.bu??99);
    });
    const handicap=calculateDoublesHandicap(left,right);

    for(let attempt=0;attempt<10&&!createdRoom;attempt+=1){

      const now=Date.now();

        bestOf:5,gamesToWin:3,matchComplete:false,winnerSide:"",sidesSwapped:false,
        createdAt:now,updatedAt:now,lastRefereeSeenAt:now
      };
      const result=await runTransaction(ref(db,`team_live_matches/${code}`),current=>current===null?liveState:undefined,{applyLocally:false});
      if(result.committed) createdRoom=code;
    }
    if(!createdRoom) throw new Error("사용 가능한 경기코드를 만들지 못했습니다.");
    try{
      await set(ref(db,"config/currentDoubleRoom"),{room:createdRoom,updatedAt:Date.now()});
    }catch(pointerError){
      console.warn("최근 복식경기 연결정보 저장 생략:",pointerError);
    }
    const url=new URL("./doubles-match.html",location.href);
    url.searchParams.set("room",createdRoom);
    url.searchParams.set("role","referee");

  }catch(error){

  }finally{
    liveStartBusy=false; button.disabled=false; button.textContent="경기 진행";
  }
}

function latestLiveActivity(state){
  return Math.max(Number(state?.lastRefereeSeenAt||0),Number(state?.updatedAt||0),Number(state?.createdAt||0));

async function cleanupExpiredLiveMatches(){
  const snapshot=await get(ref(db,"team_live_matches"));
  if(!snapshot.exists()) return;
  const now=Date.now();
  for(const [roomCode,state] of Object.entries(snapshot.val()||{})){
    const activeExpired=LIVE_ACTIVE_STATUSES.has(state?.status) && now-latestLiveActivity(state)>LIVE_MATCH_TTL_MS;
    const finishedAt=Number(state?.endedAt||state?.completedAt||state?.updatedAt||0);
    const finishedExpired=state?.status==="finished" && finishedAt>0 && now-finishedAt>LIVE_MATCH_TTL_MS;
    if(!activeExpired&&!finishedExpired) continue;
    try{
      await runTransaction(ref(db,`team_live_matches/${roomCode}`),current=>{
        if(!current) return;
        const currentActiveExpired=LIVE_ACTIVE_STATUSES.has(current.status) && Date.now()-latestLiveActivity(current)>LIVE_MATCH_TTL_MS;
        const currentFinishedAt=Number(current.endedAt||current.completedAt||current.updatedAt||0);
        const currentFinishedExpired=current.status==="finished" && currentFinishedAt>0 && Date.now()-currentFinishedAt>LIVE_MATCH_TTL_MS;
        return currentActiveExpired||currentFinishedExpired ? null : undefined;
      },{applyLocally:false});
    }catch(error){
      console.warn(`실시간 경기 ${roomCode} 자동 정리 실패:`,error);
    }
  }
}

async function openAdmin(){
  if(!isEditable()) return alert("먼저 새 친선경기를 만들거나 입력 중인 경기를 선택하세요. 최종 저장된 경기는 수정할 수 없습니다.");
  if(!isAdmin&&!(await verifyPassword("adminPassword","관리자 비밀번호를 입력하세요."))) return;
  isAdmin=true; updateTeamSelect(); renderPlayerList(); showPanel("adminPanel");
}
async function addTeamDuringMatch(){
  if(!isEditable()) return null;

  const teams=eventTeams();
  if(teams.length>=8){
    alert("경기 중 참가팀은 최대 8팀까지 등록할 수 있습니다.");
    updateTeamSelect();
    return null;
  }

  const input=prompt("추가할 팀 이름을 입력하세요.");
  if(input===null){
    updateTeamSelect();
    return null;
  }

  const teamName=String(input).trim();
  if(!teamName){
    alert("팀 이름을 입력하세요.");
    updateTeamSelect();
    return null;
  }
  if(teams.includes(teamName)){
    alert("이미 등록된 팀입니다.");
    updateTeamSelect();
    $("playerTeam").value=teamName;
    return teamName;
  }

  const nextTeams=[...teams,teamName];
  const date=String(currentMeta?.date||localDateKey());
  const [year,month,day]=date.split("-").map(Number);
  const displayTitle=`${String(year).slice(-2)}.${month}.${day} ${nextTeams.join(" vs ")}`;

  await update(ref(db),{
    [`friendlies/${currentEventId}/meta/teams`]:nextTeams,
    [`friendlies/${currentEventId}/meta/displayTitle`]:displayTitle
  });

  // Firebase 실시간 반영 전에 바로 새 팀을 선택할 수 있도록 화면 상태도 갱신
  currentMeta={...(currentMeta||{}),teams:nextTeams,displayTitle};
  updateTeamSelect();
  $("playerTeam").value=teamName;
  renderCurrentEvent();
  showNotice(`${teamName} 팀이 추가되었습니다`);
  return teamName;
}

async function addPlayer(){
  if(!isEditable()) return;
  const name=$("playerName").value.trim();
  const bu=Number($("playerBu").value||99);
  let team=$("playerTeam").value;

  if(team==="__ADD_TEAM__"){
    team=await addTeamDuringMatch();
    if(!team) return;
  }

  if(!name) return alert("선수 이름을 입력하세요.");
  if(playerArray().some(p=>p.name===name)) return alert("이미 등록된 선수입니다.");

  await set(ref(db,`friendlies/${currentEventId}/members/${safeNameKey(name)}`),{
    name,bu:Number.isFinite(bu)?bu:99,team,active:true,createdAt:Date.now()
  });
  $("playerName").value="";
  $("playerBu").value="";
  showNotice("추가되었습니다");
}
async function deleteSelectedPlayer(){
  if(!isEditable()||!selectedAdminPlayerId) return alert("삭제할 선수를 먼저 선택하세요.");
  const p=playerArray().find(item=>item.id===selectedAdminPlayerId); if(!confirm(`${p?.name||"선택한 선수"} 선수를 삭제할까요?`)) return;
  await remove(ref(db,`friendlies/${currentEventId}/members/${selectedAdminPlayerId}`)); selectedAdminPlayerId=null; showNotice("선수 삭제 완료");
}
async function resetMatches(){
  if(!isEditable()||!(await verifyPassword("adminPassword","관리자 비밀번호를 입력하세요."))) return;
  if(!confirm("현재 친선경기의 경기 기록을 전부 삭제할까요?")) return;
  await remove(ref(db,`friendlies/${currentEventId}/matches`)); selectedNames=[]; renderMatchDisplay(); showNotice("현재 경기 기록이 리셋되었습니다");
}
async function resetAll(){
  if(!isEditable()||!(await verifyPassword("adminPassword","관리자 비밀번호를 입력하세요."))) return;
  if(!confirm("현재 친선경기의 선수와 경기 기록을 모두 삭제할까요?")) return; if(!confirm("정말 삭제합니다. 되돌릴 수 없습니다.")) return;
  await remove(ref(db,`friendlies/${currentEventId}/matches`)); await remove(ref(db,`friendlies/${currentEventId}/members`)); selectedNames=[]; selectedAdminPlayerId=null; showNotice("현재 친선경기 전체 리셋 완료");
}

async function createFriendly(){
  const date=$("eventDate").value; const teams=[$("team1").value,$("team2").value,$("team3").value,$("team4").value].map(v=>v.trim()).filter(Boolean);
  if(!date) return alert("경기 날짜를 선택하세요."); if(teams.length<2) return alert("두 팀 이상 입력하세요.");
  if(new Set(teams).size!==teams.length) return alert("같은 팀명이 중복되었습니다.");
  if(currentEventId&&isEditable()) return alert("현재 입력 중인 친선경기를 먼저 최종 저장한 뒤 새 경기를 만들어 주세요.");
  if(!(await verifyPassword("adminPassword","새 친선경기 생성 관리자 비밀번호를 입력하세요."))) return;
  const [year,month,day]=date.split("-").map(Number); const displayTitle=`${String(year).slice(-2)}.${month}.${day} ${teams.join(" vs ")}`; const id=`friendly-${date}-${Date.now()}`;
  await set(ref(db,`friendlies/${id}/meta`),{date,teams,displayTitle,status:"draft",locked:false,createdAt:Date.now()});
  await set(activeFriendlyIdRef,id); isAdmin=false; $("team2").value=""; $("team3").value=""; $("team4").value=""; closeCreateModal(); showPanel("mainPanel"); showNotice("새 친선경기를 시작했습니다");
}
async function finalizeFriendly(){
  if(!isEditable()) return;
  if(!(await verifyPassword("adminPassword","최종 저장 관리자 비밀번호를 입력하세요."))) return;
  const count=Object.keys(matches||{}).length;
  if(!confirm(`${currentMeta.displayTitle||"현재 친선경기"} (${count}경기)를 최종 저장할까요?\n최종 저장 후에는 선수·경기 기록을 수정하거나 삭제할 수 없습니다.`)) return;
  await update(ref(db),{
    [`friendlies/${currentEventId}/meta/status`]:"finalized",
    [`friendlies/${currentEventId}/meta/locked`]:true,
    [`friendlies/${currentEventId}/meta/finalizedAt`]:Date.now(),
    "config/activeFriendlyId":null
  });
  isAdmin=false; showPanel("historyPanel"); showNotice("최종 저장되어 역대 친선경기에 보관되었습니다");
}

$("leftWinBtn").addEventListener("click",()=>saveByWinner("left"));
$("rightWinBtn").addEventListener("click",()=>saveByWinner("right"));
$("liveMatchBtn").addEventListener("click",startLiveDoublesMatch);
$("openScoreboardBtn").addEventListener("click",()=>{location.href="./doubles-match.html?role=display&auto=1"});
$("saveLiveResultBtn").addEventListener("click",saveReturnedLiveResult);
$("discardLiveResultBtn").addEventListener("click",discardReturnedLiveResult);
$("clearSelected").addEventListener("click",()=>{selectedNames=[];renderTiles();renderMatchDisplay()});
$("showMainBtn").addEventListener("click",()=>showPanel("mainPanel"));
$("showHistoryBtn").addEventListener("click",()=>{closeCreateModal();showPanel("historyPanel")});
$("goCreateBtn").addEventListener("click",()=>{showPanel("historyPanel");openCreateModal()});
$("openCreateEventBtn").addEventListener("click",openCreateModal);
$("closeCreateModalBtn").addEventListener("click",closeCreateModal);
$("cancelCreateEventBtn").addEventListener("click",closeCreateModal);
$("createEventModal").addEventListener("click",event=>{if(event.target===$("createEventModal")) closeCreateModal()});
document.addEventListener("keydown",event=>{if(event.key==="Escape") closeCreateModal()});
$("adminBtn").addEventListener("click",openAdmin);
$("closeAdminBtn").addEventListener("click",()=>showPanel("mainPanel"));
$("playerTeam").addEventListener("change",async event=>{
  if(event.target.value==="__ADD_TEAM__") await addTeamDuringMatch();
});
$("addPlayerBtn").addEventListener("click",addPlayer);
$("deleteSelectedPlayerBtn").addEventListener("click",deleteSelectedPlayer);
$("resetMatchesBtn").addEventListener("click",resetMatches);
$("resetAllBtn").addEventListener("click",resetAll);
$("createEventBtn").addEventListener("click",createFriendly);
$("finalizeBtn").addEventListener("click",finalizeFriendly);

async function init(){
  await ensureAuthReady();
  $("eventDate").value=localDateKey();
  await ensureLegacyFriendly();
  onValue(friendliesRef,snap=>{friendlies=snap.val()||{};renderHistory()});
  onValue(activeFriendlyIdRef,snap=>subscribeCurrentEvent(snap.exists()?String(snap.val()):""));
  if(new URLSearchParams(location.search).get("view")==="history") showPanel("historyPanel");
  await loadReturnedLiveResult();
  cleanupExpiredLiveMatches().catch(error=>console.warn("실시간 경기 자동 정리 확인 실패:",error));
}
init().catch(error=>{console.error(error);alert("자료를 불러오는 중 오류가 발생했습니다.")});
</script>
